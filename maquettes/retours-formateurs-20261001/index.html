<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Retours · Pilotage formateurs</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e5e7eb;--violet:#7c3aed;--violet-50:#f5f3ff;--gris:#cbd5e1;--ok:#059669;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.bandeau{background:#fef3c7;color:#92400e;text-align:center;padding:8px 12px;font-size:12px;font-weight:600}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
.marque{font-weight:800;color:var(--violet);margin-right:8px}
select,.onglet{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.onglets{display:flex;gap:6px;margin-left:auto}
.onglet{cursor:pointer;font-weight:600;color:var(--mute)}
.onglet.on{background:var(--violet);color:#fff;border-color:var(--violet)}
main{max-width:1080px;margin:0 auto;padding:20px;display:grid;gap:18px}
h1{font-size:22px}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:15px}
.card .hint{color:var(--mute);font-size:12px;margin:2px 0 12px}
.ligne{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;padding:5px 0}
.ligne .nom{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.piste{position:relative;height:20px}
.barre{position:absolute;left:0;top:0;height:20px;border-radius:0 5px 5px 0;display:flex;align-items:center;justify-content:flex-end;min-width:34px}
.barre.fine{top:5px;height:10px}
.barre span{position:absolute;left:calc(100% + 6px);font-size:11px;font-weight:700;color:#374151;white-space:nowrap}
.barre.fine span{font-weight:500;color:#6b7280;font-size:10px}
.double .piste{height:34px}
.double .barre:first-child{height:16px}
.double .barre.fine{top:20px;height:10px}
.gris{background:var(--gris)!important}
.gris span{color:#94a3b8}
.legende{font-size:11px;color:var(--mute);margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:24px;margin:4px 0}
.kpi small{color:var(--mute);font-size:11px}
.bloc{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.bloc.peu{background:#f1f5f9;opacity:.75}
.bloc .tete{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:baseline}
.bloc h3{font-size:14px}
.chiffres{font-size:11px;color:var(--mute)}
.alerte-peu{font-size:11px;font-weight:600;color:var(--mute);margin-top:6px}
.action{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fff}
.action .titre{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:13px}
.badge{font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap}
.b-alerte{background:#fee2e2;color:#991b1b}.b-surveiller{background:#fef3c7;color:#92400e}.b-bon{background:#d1fae5;color:#065f46}
.action ul{margin:8px 0 0 22px;color:var(--mute);font-size:12px;display:grid;gap:3px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--mute);font-weight:600;padding:8px;background:var(--violet-50);border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
tr.peu{opacity:.5}
.vide{color:var(--mute);font-size:13px;padding:10px 0}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.ligne{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<div class="bandeau">Maquette de test · données entièrement fictives et anonymisées · pour recueillir des retours</div>
<header>
  <span class="marque">Retours</span>
  <select id="menu" aria-label="Filtrer par formateur"></select>
  <select aria-label="Période"><option>30 derniers jours</option><option>90 derniers jours</option><option>Tout</option></select>
  <div class="onglets">
    <button class="onglet on" data-vue="admin">Vue admin</button>
    <button class="onglet" data-vue="formateur">Vue formateur (exemple)</button>
  </div>
</header>
<main id="app"></main>

<script>
// Données FICTIVES. Répartition de « Très satisfait » (tres) sur total de réponses par thème.
const F = [
  {n:"Formateur A",s:5,r:18,note:9.4,f:[17,18],c:[34,36],o:[33,36],obj:9.2},
  {n:"Formateur B",s:4,r:12,note:8.6,f:[6,12],c:[21,24],o:[21,24],obj:8.8},
  {n:"Formateur C",s:3,r:10,note:8.3,f:[9,10],c:[12,20],o:[18,20],obj:8.1},
  {n:"Formateur D",s:3,r:9,note:8.4,f:[8,9],c:[17,18],o:[9,18],obj:8.9},
  {n:"Formateur E",s:4,r:14,note:7.1,f:[7,14],c:[15,28],o:[17,28],obj:7.0},
  {n:"Formateur F",s:2,r:11,note:9.0,f:[10,11],c:[20,22],o:[21,22],obj:6.2},
  {n:"Formateur G",s:2,r:2,note:8.5,f:[1,2],c:[4,4],o:[4,4],obj:9.0},
  {n:"Formateur H",s:1,r:3,note:9.7,f:[3,3],c:[6,6],o:[5,6],obj:9.5},
  {n:"Formateur I",s:0,r:0,note:null,f:[0,0],c:[0,0],o:[0,0],obj:null},
  {n:"Formateur J",s:0,r:0,note:null,f:[0,0],c:[0,0],o:[0,0],obj:null}
];
const GLOBAL={note:8.8,reco:96,obj:8.6,taux:61};
const SEUIL=5, BON=.85, SURV=.70;
const pct=a=>a[1]?a[0]/a[1]:null;
const niv=p=>p===null?null:p>=BON?"bon":p>=SURV?"surveiller":"alerte";
const mal=x=>x==="surveiller"||x==="alerte";
const pire=(a,b)=>a==="alerte"||b==="alerte"?"alerte":"surveiller";
const fmtP=p=>p===null?"–":Math.round(p*100)+" %";
const rag=(t)=>{t=Math.max(0,Math.min(1,t));const R=[239,68,68],A=[245,158,11],G=[16,185,129];const l=(a,b,u)=>a.map((v,i)=>Math.round(v+(b[i]-v)*u));const c=t<.5?l(R,A,t/.5):l(A,G,(t-.5)/.5);return`rgb(${c})`};
const colP=p=>rag((p-.5)/.5), colN=n=>rag((n-6.5)/3.5);

function diag(x){
  const f=pct(x.f),c=pct(x.c),o=pct(x.o);
  const d={...x,pf:f,pc:c,po:o,nf:niv(f),nc:niv(c),no:niv(o),no2:x.obj===null?null:niv(x.obj/10),fiable:x.r>=SEUIL,actions:[]};
  const a=d.actions;
  if(mal(d.nf)&&mal(d.nc)) a.push({n:pire(d.nf,d.nc),t:"Problème mixte : formateur et formation à traiter ensemble",
    p:["Traiter d'abord le contenu (mise à jour, exercices, découpage des journées), il touche tous les formateurs","Puis faire un point individuel avec le formateur et observer une session","Relire les verbatims pour voir si les reproches visent la personne ou le programme"],
    pf:["Relisez les commentaires de vos apprenants : plusieurs touchent à la fois l'animation et le contenu","Demandez un échange avec l'équipe pour revoir ensemble le déroulé de vos journées"]});
  else if(mal(d.nf)) a.push({n:d.nf,t:d.nf==="alerte"?"Problème formateur : accompagnement à engager":"Formateur à surveiller",
    p:d.nf==="alerte"?["Entretien individuel pour partager les retours des apprenants","Observer une session et fixer un plan d'accompagnement (animation, posture, clarté)","Réévaluer après 2 sessions ; sans progrès, réfléchir à ne plus le programmer"]:["Partager les retours lors d'un échange informel","Proposer d'observer une session ou de co-animer avec un formateur très bien noté"],
    pf:["Relisez les commentaires de vos apprenants sur l'animation et l'accompagnement","Demandez à observer ou à co-animer une session avec un formateur très bien noté"]});
  else if(mal(d.nc)) a.push({n:d.nc,t:"Formation à mettre à jour : contenu ou rythme",
    p:["Mettre à jour le contenu, les supports et les outils présentés","Alléger ou rééquilibrer le rythme (limiter les cas d'usage de la 2e journée)","Ajouter des exercices pratiques plutôt que des exemples déjà faits"],
    pf:["Adaptez le rythme : moins de cas d'usage sur la 2e journée si le temps manque","Remontez à l'équipe les supports ou outils qui vous semblent dépassés"]});
  if(mal(d.no)) a.push({n:d.no,t:"Organisation à corriger : lieu, supports, informations avant la formation",
    p:["Vérifier la salle, les accès et les changements de lieu annoncés trop tard","Mettre à jour les supports et l'espace apprenant","Revoir les e-mails envoyés avant la formation (clarté, quantité)"],
    pf:["Signalez à l'équipe les problèmes de salle, d'accès ou de supports constatés","Rappelez le programme et le lieu à l'ouverture de la journée"]});
  if(mal(d.no2)&&!mal(d.nf)&&!mal(d.nc)) a.push({n:d.no2,t:"Objectifs peu atteints malgré de bonnes notes : revoir le lien exercices et objectifs",
    p:["Vérifier que chaque objectif a un exercice qui le travaille vraiment","Ajouter un point de contrôle en fin de journée pour mesurer l'acquis"],
    pf:["Terminez chaque journée par un exercice qui vérifie l'objectif visé","Précisez en début de séance ce que les apprenants sauront faire à la fin"]});
  if(!a.length&&[d.nf,d.nc,d.no,d.no2].some(Boolean)) a.push({n:"bon",t:"Rien à corriger : valoriser",
    p:["Demander un avis Google ou Trustpilot aux apprenants très satisfaits","Utiliser les verbatims positifs (avec consentement) et partager les bonnes pratiques"],
    pf:["Vos apprenants sont ultra satisfaits : continuez ainsi","Invitez-les à laisser un avis Google ou Trustpilot"]});
  return d;
}
const D=F.map(diag);
const LAB={alerte:"Alerte",surveiller:"À surveiller",bon:"Bon"};

function barres(rows,{max,fmt,col,doubles}){
  return rows.map(r=>{
    const w=v=>Math.max(2,v/max*100)+"%";
    const g=r.fiable?"":" gris";
    const main=`<div class="barre${g}" style="width:${w(r.v)};background:${r.fiable?col(r.v):""}"><span>${fmt(r.v)}</span></div>`;
    const fine=doubles&&r.w!==null?`<div class="barre fine${g}" style="width:${w(r.w)};background:${r.fiable?doubles(r.w):""}"><span>${fmt(r.w)}</span></div>`:"";
    return `<div class="ligne${doubles?" double":""}"><div class="nom">${r.nom}</div><div class="piste">${main}${fine}</div></div>`;
  }).join("");
}

function blocAction(d,pourFormateur){
  const acts=d.actions.map(a=>`<div class="action"><div class="titre"><span class="badge b-${a.n}">${LAB[a.n]}</span><span>${a.t}</span></div><ul>${(pourFormateur?a.pf:a.p).map(p=>`<li>${p}</li>`).join("")}</ul></div>`).join("")||`<p class="vide">Pas de mesure suffisante.</p>`;
  return `<div class="bloc${d.fiable?"":" peu"}"><div class="tete"><h3>${d.n}</h3><span class="chiffres">Formateur ${fmtP(d.pf)} · Contenu et rythme ${fmtP(d.pc)} · Organisation ${fmtP(d.po)} · Objectifs ${d.obj===null?"–":d.obj.toFixed(1)+"/10"} · ${d.r} réponses</span></div>${d.fiable||!d.r?"":`<p class="alerte-peu">Moins de 5 réponses : verdict à confirmer avec davantage de retours.</p>`}${acts}</div>`;
}

function vueAdmin(sel){
  const L=D.filter(d=>sel==="all"||d.n===sel);
  const avecNote=L.filter(d=>d.note!==null).sort((a,b)=>b.note-a.note);
  const avecF=L.filter(d=>d.pf!==null).sort((a,b)=>b.pf-a.pf);
  const avecC=L.filter(d=>d.pc!==null).sort((a,b)=>b.pc-a.pc);
  const diagnostics=[...L].filter(d=>d.r>0).sort((a,b)=>(b.fiable-a.fiable)||(Math.min(...a.actions.map(x=>["alerte","surveiller","bon"].indexOf(x.n)),3)-Math.min(...b.actions.map(x=>["alerte","surveiller","bon"].indexOf(x.n)),3)));
  const aucune=L.filter(d=>d.r===0).map(d=>d.n);
  return `
  <div><h1>Formateurs</h1><p class="sub">Comparatif par formateur (questionnaires à chaud). Les barres grises reposent sur moins de ${SEUIL} réponses.</p></div>
  <section class="card"><h2>Satisfaction globale</h2><p class="hint">Note /10 sur l'ensemble : formateur, contenu, lieu, supports</p>
    ${barres(avecNote.map(d=>({nom:d.n,v:d.note,fiable:d.fiable})),{max:10,fmt:v=>v.toFixed(1).replace(".",",")+"/10",col:colN})}</section>
  <section class="card"><h2>Satisfaction du formateur</h2><p class="hint">% d'apprenants « Très satisfaits » de la pédagogie et de l'accompagnement</p>
    ${barres(avecF.map(d=>({nom:d.n,v:d.pf*100,fiable:d.fiable})),{max:100,fmt:v=>Math.round(v)+"%",col:v=>colP(v/100)})}</section>
  <section class="card"><h2>Qualité de la formation</h2><p class="hint">% d'apprenants « Très satisfaits » du contenu et du rythme, et de l'organisation</p>
    ${barres(avecC.map(d=>({nom:d.n,v:d.pc*100,w:d.po===null?null:d.po*100,fiable:d.fiable})),{max:100,fmt:v=>Math.round(v)+"%",col:v=>colP(v/100),doubles:v=>colP(v/100)})}
    <p class="legende">Barre épaisse : contenu et rythme. Barre fine : organisation (logistique, supports, informations avant la formation). Gris : moins de ${SEUIL} réponses.</p></section>
  <section class="card"><h2>Actions à prendre</h2><p class="hint">Part d'apprenants « Très satisfait » : bon à partir de 85 %, à surveiller de 70 à 85 %, alerte sous 70 %. Aide à la lecture, pas un verdict.</p>
    ${diagnostics.map(d=>blocAction(d,false)).join("")||`<p class="vide">Pas assez de réponses sur la période.</p>`}
    ${aucune.length&&sel==="all"?`<p class="legende">Sans session remontée : ${aucune.join(", ")}.</p>`:""}</section>
  <section class="card"><h2>Détail comparatif</h2><p class="hint"></p>
    <table><thead><tr><th>Formateur</th><th>Sessions</th><th>Réponses</th><th>Satisfaction</th><th>Formateur</th><th>Contenu et rythme</th><th>Organisation</th></tr></thead><tbody>
    ${L.map(d=>`<tr class="${d.fiable?"":"peu"}" title="${d.fiable?"":"Peu de réponses : chiffres à prendre avec prudence"}"><td><b>${d.n}</b></td><td>${d.s}</td><td>${d.r}</td><td>${d.note===null?"–":d.note.toFixed(1).replace(".",",")+"/10"}</td><td>${fmtP(d.pf)}</td><td>${fmtP(d.pc)}</td><td>${fmtP(d.po)}</td></tr>`).join("")}
    </tbody></table></section>`;
}

function vueFormateur(){
  const d=D.find(x=>x.n==="Formateur E");
  return `
  <div><h1>Vue d'ensemble</h1><p class="sub">Vos chiffres comparés au global France IA · connecté en tant que « ${d.n} »</p></div>
  <div class="kpis">
    <div class="kpi"><small>Satisfaction à chaud</small><b>${d.note.toFixed(1).replace(".",",")}/10</b><small>Vous : ${d.r} réponses · Global : ${GLOBAL.note.toFixed(1).replace(".",",")}/10</small></div>
    <div class="kpi"><small>Recommandation</small><b>93 %</b><small>Vos apprenants · Global : ${GLOBAL.reco} %</small></div>
    <div class="kpi"><small>Objectifs pédago</small><b>${d.obj.toFixed(1).replace(".",",")}/10</b><small>Atteinte moyenne · Global : ${GLOBAL.obj.toFixed(1).replace(".",",")}/10</small></div>
    <div class="kpi"><small>Taux de réponse</small><b>54 %</b><small>Vos questionnaires · Global : ${GLOBAL.taux} %</small></div>
  </div>
  <section class="card"><h2>Vos pistes d'amélioration</h2><p class="hint">Part d'apprenants « Très satisfait » : bon à partir de 85 %, à surveiller de 70 à 85 %, alerte sous 70 %. Aide à la lecture, pas un verdict.</p>
    ${blocAction(d,true)}</section>
  <section class="card"><h2>Vos résultats</h2><p class="hint"></p>
    ${barres([{nom:"Formateur",v:d.pf*100,fiable:true},{nom:"Contenu et rythme",v:d.pc*100,fiable:true},{nom:"Organisation",v:d.po*100,fiable:true}],{max:100,fmt:v=>Math.round(v)+"%",col:v=>colP(v/100)})}</section>
  <p class="legende">Dans l'app réelle, le formateur voit aussi sa synthèse IA et ses propres verbatims. Il ne voit que ses données.</p>`;
}

const menu=document.getElementById("menu"),app=document.getElementById("app");
menu.innerHTML=`<option value="all">Tous les formateurs</option>`+F.map(f=>`<option>${f.n}</option>`).join("");
let vue="admin";
function rendre(){
  menu.style.display=vue==="admin"?"":"none";
  app.innerHTML=vue==="admin"?vueAdmin(menu.value):vueFormateur();
  document.querySelectorAll(".onglet").forEach(b=>b.classList.toggle("on",b.dataset.vue===vue));
  history.replaceState(null,"","#"+vue);
}
menu.onchange=rendre;
document.querySelectorAll(".onglet").forEach(b=>b.onclick=()=>{vue=b.dataset.vue;rendre()});
if(location.hash==="#formateur")vue="formateur";
rendre();
</script>
</body>
</html>
