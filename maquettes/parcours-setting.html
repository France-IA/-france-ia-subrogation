<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Parcours de setting</title>
<meta name="description" content="Le parcours de setting proposé par Tanguy, du formulaire au rendez-vous, avec ses messages et leurs scripts finaux.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fragment+Mono&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Design system France IA : blanc, encre, bleu du logo en seul accent. */
:root{
  --ink:#16161a; --ink2:#2e2e36; --muted:#54545e; --faint:#8a8a96;
  --line:#e6e6ee; --line2:#d6d6e0; --bg:#ffffff; --soft:#f7f7fa; --soft2:#f1f1f5;
  --blue:#4379f2; --blue-50:#EFF6FF; --blue-line:#cddbfb; --red:#DC2626;
  --f-display:"Manrope", system-ui, sans-serif;
  --f-body:"DM Sans", system-ui, sans-serif;
  --f-mono:"Fragment Mono", ui-monospace, monospace;
  --r:18px; --r-s:12px;
  --shadow:0 1px 2px rgba(22,22,26,.05), 0 4px 14px rgba(22,22,26,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-padding-top:16px}
body{margin:0; background:var(--bg); color:var(--ink); font:400 15.5px/1.6 var(--f-body); -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display); color:var(--ink); margin:0; letter-spacing:-.01em}
p{margin:0 0 10px}
a{color:var(--blue)}
b,strong{font-weight:600}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:6px}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px}
.muted{color:var(--muted)}

/* Titre de la page, pour les lecteurs d'écran seulement */
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}

/* Contenu */
.vue{max-width:none; padding-top:40px; padding-bottom:24px; outline:none}
.vue > *{max-width:1132px; margin-left:auto; margin-right:auto}
.vue > .flow-wrap{max-width:1760px}
.v-head{margin-bottom:26px}
.v-head > p{max-width:760px}
.v-head h2{font-weight:800; font-size:clamp(25px,3vw,32px); line-height:1.15; letter-spacing:-.02em; margin-bottom:10px}
.v-head p{color:var(--muted); font-size:16px}
.block{margin-top:64px}
.block.first{margin-top:12px}
.block h3{font-weight:700; font-size:22px; line-height:1.25; margin-bottom:8px}
.block > .lead{color:var(--muted); max-width:72ch; margin-bottom:20px}
.card{border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; background:var(--bg)}
.card h4{font-weight:700; font-size:16.5px; line-height:1.3; margin-bottom:8px}
.grid2,.grid3,.grid4{display:grid; gap:14px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k{font:800 28px/1.1 var(--f-display); letter-spacing:-.02em; color:var(--ink)}
.ks{font-size:12.5px; color:var(--muted); margin:2px 0 12px}

/* Barre d'outils du schéma */
.toolbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px}
.seg{display:inline-flex; padding:4px; border:1px solid var(--line); border-radius:99px; background:var(--soft); gap:2px; max-width:100%}
.seg button{border:0; background:none; border-radius:99px; padding:8px 16px; font-size:14px; font-weight:500; color:var(--muted); cursor:pointer; display:inline-flex; align-items:baseline; gap:8px; white-space:nowrap}
.seg.n4 button{flex-direction:column; align-items:flex-start; gap:4px; padding:8px 18px}
.seg button small{font:400 10.5px/1 var(--f-mono); letter-spacing:.05em; text-transform:uppercase; color:var(--faint)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--bg); color:var(--ink); box-shadow:0 1px 2px rgba(22,22,26,.08), 0 0 0 1px var(--line)}
.seg button[aria-pressed="true"] small{color:var(--blue)}
.zoom{display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:99px; padding:3px}
.zoom button{border:0; background:none; min-width:32px; height:30px; border-radius:99px; cursor:pointer; font-size:16px; color:var(--ink2)}
.zoom button:hover{background:var(--soft2)}
.zoom .fit{font-size:13px; font-weight:500; padding:0 12px; border-left:1px solid var(--line); border-radius:0 99px 99px 0}
#zoom-v{font:400 11.5px/1 var(--f-mono); color:var(--muted); min-width:44px; text-align:center}

/* Le schéma */
.flow{position:relative; border:1px solid var(--line); border-radius:var(--r); overflow:auto; cursor:grab; background-color:var(--bg);
  background-image:radial-gradient(circle, #d9d9e2 1px, transparent 1.2px); background-size:20px 20px; overscroll-behavior-x:contain}
.flow.drag{cursor:grabbing; user-select:none}
.flow.drag .node{cursor:grabbing}
.flow-in{position:relative; transform-origin:0 0}

.edges{position:absolute; inset:0; overflow:visible; pointer-events:none}
.edges path{fill:none; stroke:#b8b8c6; stroke-width:1.5}
.edges path.faible{stroke-dasharray:4 4}
.edges marker path{fill:#b8b8c6; stroke:none}
.el{position:absolute; transform:translate(-50%,-50%); max-width:70px; padding:2px 6px; border:1px solid var(--line); border-radius:99px; background:var(--bg);
  font:400 10.5px/1.25 var(--f-mono); color:var(--muted); text-align:center; z-index:1; pointer-events:none}

.node{position:absolute; display:flex; flex-direction:column; align-items:center; gap:8px; padding:0; border:0; background:none; text-align:center; z-index:2}
button.node{cursor:pointer}
.tile{position:relative; width:56px; height:56px; border-radius:15px; border:1px solid var(--line2); background:var(--bg); display:grid; place-items:center; box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s, border-color .15s}
.tile svg{width:24px; height:24px; fill:none; stroke:var(--ink); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.nl{font-size:13px; line-height:1.3; font-weight:500; color:var(--ink); max-width:112px}
.nm{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:500; color:var(--blue); margin-top:-4px}
.nm svg{width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
button.node:hover .tile{transform:translateY(-2px); border-color:#bdbdca; box-shadow:0 2px 4px rgba(22,22,26,.06), 0 10px 24px rgba(22,22,26,.08)}
button.node[aria-pressed="true"] .tile{border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-50), var(--shadow)}
button.node[aria-pressed="true"] .tile svg{stroke:var(--blue)}
.node.ghost .tile{border-style:dashed; background:transparent; box-shadow:none}
.node.ghost .tile svg{stroke:var(--faint)}
.node.ghost .nl{color:var(--muted)}
.node.del{opacity:.55}
.node.del .nl{text-decoration:line-through}
/* Fin de branche : la bulle grisée remplace le drapeau (Tanguy, 28/10) */
.node.bout .tile{background:var(--soft); border-color:var(--line); box-shadow:none}
.node.bout .tile svg{stroke:var(--muted)}
.node.bout .nl{color:var(--muted)}
.pill-bout{background:var(--soft)}
.node.depart .tile{background:var(--ink); border-color:var(--ink)}
.node.depart .tile svg{stroke:#fff; fill:#fff}
.node.depart .nl,.node.si .nl{font-weight:600}
.node.si .tile{width:42px; height:42px; margin:7px; border-radius:10px; transform:rotate(45deg); background:var(--soft)}
.node.si .tile svg{transform:rotate(-45deg); width:20px; height:20px}
.node.si .nl{margin-top:-6px}
.node.fin .tile{background:var(--soft); box-shadow:none}
.node.fin .tile svg{stroke:var(--muted)}
.node.fin .nl{color:var(--muted)}
.node.suite .tile{background:var(--blue-50); border-color:var(--blue-line); box-shadow:none}
.node.suite .tile svg{stroke:var(--blue)}
.node.suite .nl{color:var(--blue)}
.node.suite:hover .nl{text-decoration:underline; text-underline-offset:3px}

/* Marques : verdict de Roxane, changements du parcours proposé */
.vd{position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font:700 11px/1 var(--f-body); background:var(--bg); border:1px solid var(--line2); color:var(--ink)}
.vd-ok{background:var(--ink); border-color:var(--ink); color:#fff}
.vd-adj{border-color:var(--ink)}
.vd-no{border-color:var(--red); color:var(--red)}
.tg{position:absolute; top:-10px; left:50%; transform:translateX(-50%); padding:2px 7px; border-radius:99px; font:400 9.5px/1.3 var(--f-mono); letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; background:var(--bg); border:1px solid var(--line2); color:var(--muted)}
.tg-new{background:var(--blue); border-color:var(--blue); color:#fff}
.tg-mod{border-color:var(--blue); color:var(--blue)}
.tg-del{text-decoration:line-through}
.libre .vd,.libre .tg{position:static; transform:none}

.flow-hint{font-size:12.5px; color:var(--faint); margin:10px 2px 0}
.libres{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:16px}
.libres-h{font:400 11px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-right:4px}
.libre{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:99px; background:var(--bg); padding:7px 14px 7px 10px; font-size:13.5px; font-weight:500; cursor:pointer}
.libre svg{width:16px; height:16px; fill:none; stroke:var(--ink); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.libre:hover{border-color:#bdbdca}
.libre[aria-pressed="true"]{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-50)}

/* Scripts finaux (onglet de Tanguy) */
.pn-note{font-size:13.5px; color:var(--ink2); margin-bottom:12px}
.pn-rox .sms{background:var(--soft)}
.pn-regle{display:grid; gap:8px; margin:14px 0 0}
.pn-regle div{border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.pn-regle dt{font-size:13.5px; font-weight:600; color:var(--ink)}
.pn-regle dd{margin:3px 0 0; font-size:13.5px; color:var(--ink2)}
.fx-zone .final-aide{margin-bottom:10px}
.fx-g{margin:22px 0 8px; font:600 15px/1.3 var(--f-display); color:var(--ink)}
.pn-final{margin-top:10px; padding:14px 14px 10px; border:1.5px solid var(--blue); border-radius:14px; background:var(--blue-50)}
.fx-h{display:block; margin-bottom:8px; font-size:14px; font-weight:600; color:var(--blue)}
.pn-final .final-act{margin-top:8px}
.pn-final .final-st{margin-top:8px}
.sugg{display:flex; flex-wrap:wrap; gap:0 18px; margin-top:4px; border-top:1px solid var(--blue-line)}
.pn-final .tgl-p{border-top-color:var(--blue-line); background:var(--bg); border-radius:10px; padding:4px 12px 12px}
.pn-final .fx-n{margin:8px 0 2px; font-size:13px; color:var(--muted)}
.pn-final.multi textarea{min-height:130px}
.pn-final textarea{display:block; width:100%; min-height:190px; resize:vertical; border:1px solid var(--line2); border-radius:var(--r-s); padding:12px 14px; font:400 14.5px/1.55 var(--f-body); color:var(--ink); background:var(--bg)}
.pn-final textarea:focus-visible{outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue)}
.final-aide{font-size:13px; color:var(--muted)}
.final-act{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.btn-f{border:1px solid var(--line2); background:var(--bg); border-radius:99px; padding:8px 14px; font-size:13.5px; font-weight:500; cursor:pointer}
.btn-f:hover{border-color:#bdbdca; background:var(--soft)}
.btn-f.pri{background:var(--blue); border-color:var(--blue); color:#fff}
.btn-f.pri:hover{background:#3466dc; border-color:#3466dc}
.btn-f:disabled{opacity:.5; cursor:default}
.final-st{font-size:12.5px; color:var(--muted); margin:10px 0 0}
.final-st.mod{color:var(--ink2); font-weight:500}
.final-st.err{color:var(--red)}
.txt-list{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr)); gap:8px}
.txt-i{width:100%; display:flex; align-items:center; gap:12px; text-align:left; border:1px solid var(--line); border-radius:14px; background:var(--bg); padding:12px 14px; cursor:pointer}
.txt-i:hover{border-color:#bdbdca}
.txt-i svg{flex:none; width:18px; height:18px; fill:none; stroke:var(--ink); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.txt-i .t{flex:1; min-width:0; font-size:14px; font-weight:500; line-height:1.35}
.txt-i small{display:block; margin-top:2px; font-size:12.5px; font-weight:400; color:var(--muted)}
.txt-st{flex:none; font:400 11px/1.3 var(--f-mono); letter-spacing:.05em; text-transform:uppercase; color:var(--faint); white-space:nowrap}
.txt-st.ok{color:var(--blue)}
.txt-st.mod{color:var(--ink)}

/* Panneau de détail */
.panel{position:fixed; top:0; right:0; bottom:0; width:min(480px,100vw); z-index:60; display:flex; flex-direction:column; background:var(--bg); border-left:1px solid var(--line);
  box-shadow:-16px 0 48px rgba(22,22,26,.10); transform:translateX(100%); transition:transform .22s cubic-bezier(.2,.7,.2,1)}
.panel[hidden]{display:none}
.panel.on{transform:none}
.pn-h{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px 14px 24px; border-bottom:1px solid var(--line)}
.pn-eyebrow{margin:0; font:400 11px/1.4 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.pn-x{flex:none; width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--bg); display:grid; place-items:center; cursor:pointer}
.pn-x:hover{background:var(--soft)}
.pn-x svg{width:18px; height:18px; fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round}
.pn-b{flex:1; overflow-y:auto; padding:20px 24px 32px; overscroll-behavior:contain}
.pn-f{display:flex; justify-content:space-between; gap:8px; padding:10px 16px; border-top:1px solid var(--line)}
.pn-nav{border:0; background:none; padding:8px; font-size:13.5px; font-weight:500; color:var(--ink2); cursor:pointer; border-radius:8px}
.pn-nav:hover:not(:disabled){background:var(--soft)}
.pn-nav:disabled{opacity:.35; cursor:default}
.pn-meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.pn-canal{display:inline-flex; align-items:center; gap:6px; font:400 11px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--ink); margin-right:6px}
.pn-canal svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.pill{display:inline-block; padding:3px 10px; border-radius:99px; border:1px solid var(--line); font-size:12px; color:var(--muted); line-height:1.4}
.vd-l-ok{background:var(--ink); border-color:var(--ink); color:#fff}
.vd-l-adj{border-color:var(--ink); color:var(--ink)}
.vd-l-no{border-color:var(--red); color:var(--red)}
.tg-l-new{background:var(--blue); border-color:var(--blue); color:#fff}
.tg-l-mod{border-color:var(--blue); color:var(--blue)}
.tg-l-del{text-decoration:line-through}
#pn-titre{font-weight:700; font-size:21px; line-height:1.28; margin:14px 0 4px}
.pn-qui{font-size:13px; color:var(--muted)}
.pn-court{font-size:15px; color:var(--ink2)}
.pn-notes{list-style:none; margin:12px 0 0; padding:0; font-size:13.5px; color:var(--ink2)}
.pn-notes li{position:relative; padding-left:16px; margin-bottom:6px}
.pn-notes li::before{content:""; position:absolute; left:2px; top:.68em; width:6px; height:1.5px; background:var(--faint)}
.pn-s{margin-top:24px; padding-top:16px; border-top:1px solid var(--line)}
.pn-s h4{font:400 11px/1.4 var(--f-mono); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:12px}
.pn-d{font-size:14px; color:var(--ink2)}
.pn-d p{margin-bottom:10px}
.pn-d ul,.pn-d ol{padding-left:18px; margin:0 0 10px}
.pn-goto{margin-top:22px; width:100%; border:1px solid var(--blue); background:var(--bg); color:var(--blue); border-radius:99px; padding:10px 16px; font-size:14px; font-weight:500; cursor:pointer}
.pn-goto:hover{background:var(--blue-50)}

/* Messages */
.msg{margin-bottom:18px}
.msg:last-child{margin-bottom:0}
.msg-h{font-size:12.5px; color:var(--muted); margin-bottom:6px}
.msg-meta{font-size:12px; color:var(--faint); margin:6px 0 0}
.sms{background:var(--soft2); border-radius:18px 18px 18px 5px; padding:11px 14px; font-size:14.5px; line-height:1.5; color:var(--ink)}
.mail{border:1px solid var(--line); border-radius:var(--r-s); overflow:hidden}
.mail dl{margin:0; padding:10px 14px; background:var(--soft); border-bottom:1px solid var(--line); display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:13px}
.mail dt{color:var(--muted)}
.mail dd{margin:0; font-weight:500}
.mail-b{padding:14px; font-size:14.5px; line-height:1.6}
.script{border-left:2px solid var(--ink); padding:4px 0 4px 14px; font-size:14.5px; font-style:italic; color:var(--ink2)}
.cond{display:block; margin:8px 0; padding:8px 10px; border-left:2px solid var(--blue); background:var(--blue-50); border-radius:0 6px 6px 0; font-style:normal}
.cond-l{display:block; font:500 11px/1.4 var(--f-mono); color:var(--muted); margin-bottom:3px}
.pagemsg{border:1px solid var(--line); border-radius:var(--r-s); padding:16px; font-size:14.5px}
.pagemsg strong{display:block; font:700 17px/1.3 var(--f-display); margin-bottom:6px}
.var{font:400 .84em/1 var(--f-mono); background:var(--blue-50); box-shadow:inset 0 0 0 1px var(--blue-line); color:var(--ink); padding:2px 5px; border-radius:5px; white-space:nowrap; font-style:normal}
.lnk{color:var(--blue); text-decoration:underline; text-underline-offset:2px}
.why{font-size:13px; color:var(--muted); margin:8px 0 0}
details.why summary{cursor:pointer; list-style:none}
details.why summary::-webkit-details-marker{display:none}
.why b{color:var(--ink2)}
.why .plus{font-weight:500; color:var(--blue); margin-left:6px; white-space:nowrap}
.why .plus::after{content:" +"}
details.why[open] .plus::after{content:" −"}
.why .more{margin-top:8px; padding:10px 12px; border-radius:10px; background:var(--soft); color:var(--ink2); font-size:13.5px}

/* Tableaux et renvois dans les textes */
.tbl{overflow-x:auto; margin:4px 0 14px}
.mini{width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums}
.mini caption{text-align:left; font:400 10.5px/1.4 var(--f-mono); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding-bottom:6px}
.mini th,.mini td{padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap}
.mini th:first-child,.mini td:first-child{text-align:left; white-space:normal; padding-left:0}
.mini th{font-weight:500; color:var(--muted); font-size:12px; vertical-align:bottom}
.mini th small{font-weight:400}
.mini tr.hl td{background:var(--blue-50); font-weight:600}
.mini tr.sub td{font:400 10.5px/1.3 var(--f-mono); text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding-top:14px; text-align:left}
.ord{margin:0 0 10px; padding-left:20px}
.ref{font:400 10.5px/1 var(--f-mono); color:var(--blue); vertical-align:super; padding:0 1px}
.ref a{color:inherit; text-decoration:none}
.ref a:hover{text-decoration:underline}

/* Boutons texte */
.tgl{margin-top:10px; border:0; background:none; padding:0; font-size:13.5px; font-weight:500; color:var(--blue); cursor:pointer}
.tgl::after{content:" +"}
.tgl[aria-expanded="true"]::after{content:" −"}
.tgl-p{margin-top:10px; padding-top:12px; border-top:1px solid var(--line); font-size:14px; color:var(--ink2)}
.lien{border:0; background:none; padding:0; font-size:13.5px; font-weight:500; color:var(--blue); cursor:pointer; text-align:left}
.lien:hover{text-decoration:underline; text-underline-offset:3px}

@media (max-width:1439px){
  .vue > .flow-wrap{max-width:1132px}
}
@media (max-width:980px){
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  body{font-size:15px}
  .vue{padding-top:28px}
  .grid2,.grid4{grid-template-columns:1fr}
  .seg{width:100%}

<script>
/* Données du mini-site « Parcours de setting ». Sources internes : CRMIA (production, lecture seule, 23/10/2026, puis 27/10/2026 pour la v7). */

const SOURCES = [
  {k:"steiner", t:"Steiner et al., « Optimizing number and timing of appointment reminders: a randomized trial », American Journal of Managed Care, 2018. 54 066 visites : rappels à J-3 et J-1 combinés, 4,4 % d'absences contre 5,8 % et 5,3 % avec un seul.", u:"https://www.ajmc.com/view/optimizing-number-and-timing-of-appointment-reminders-a-randomized-trial", f:"Essai contrôlé"},
  {k:"robotham", t:"Robotham et al., méta-analyse de 21 études sur les notifications de rendez-vous, BMJ Open, 2016. Présence 67 % contre 54 % ; plusieurs rappels font mieux qu'un seul.", u:"https://bmjopen.bmj.com/content/6/10/e012116", f:"Méta-analyse"},
  {k:"cochrane", t:"Gurol-Urganci et al., revue Cochrane CD007458 (8 essais, 6 615 personnes). SMS contre aucun rappel : présence 78,6 % contre 67,8 % ; SMS et appel font jeu égal, le SMS coûte moins cher.", u:"https://www.cochrane.org/evidence/CD007458_mobile-phone-messaging-reminders-attendance-healthcare-appointments", f:"Méta-analyse"},
  {k:"parikh", t:"Parikh et al., essai randomisé (environ 9 835 patients, appel à J-3), 2010. Absences : 13,6 % avec un appel du personnel, 17,3 % avec un appel automatique, 23,1 % sans rappel.", u:"https://pubmed.ncbi.nlm.nih.gov/20569761/", f:"Essai contrôlé"},
  {k:"teo", t:"Teo et al., Psychiatric Services, 2017 (250 patients). Absences : 3 % quand le rappel est donné de vive voix, 24 % sur message vocal, 39 % sans réponse. Étude observationnelle.", u:"https://psychiatryonline.org/doi/10.1176/appi.ps.201700128", f:"Observationnel"},
  {k:"penn", t:"Penn Medicine (poster Vizient, 2022), téléconsultations : message à la réservation, puis 3 à 2 jours avant, puis le lien seul 10 minutes avant. Absences de 4,5 % à 3,9 % sur 1,36 million de visites, avant/après.", u:"https://continuingeducation.vizientinc.com/sites/default/files/media/2022-09/P149_0.pdf", f:"Observationnel"},
  {k:"hbr", t:"Oldroyd, McElheran, Elkington, « The Short Life of Online Sales Leads », Harvard Business Review, 2011. Contacter en moins d'une heure rend la qualification environ 7 fois plus probable qu'une heure plus tard.", u:"https://hbr.org/2011/03/the-short-life-of-online-sales-leads", f:"Gros volume"},
  {k:"lrm", t:"Lead Response Management Study (Oldroyd, InsideSales). Entre 5 et 30 minutes, les chances de qualifier un lead sont divisées par 21.", u:"https://www.leadresponsemanagement.org/lrm_study", f:"Gros volume"},
  {k:"velocify", t:"Velocify, « The Ultimate Contact Strategy » (3,5 millions de leads). 93 % des leads convertis sont joints au plus tard au 6e appel ; 2e appel conseillé 30 à 60 minutes après le premier.", u:"https://www.slideshare.net/Velocify/the-ultimate-contact-strategy", f:"Gros volume"},
  {k:"berliner", t:"Berliner Senderey et al., 2020 (161 587 rendez-vous, SMS à J-5). Avec un lien pour confirmer ou annuler et le message « d'autres attendent ce créneau », les absences passent de 21,1 % à 14,2 % et les annulations anticipées de 17,2 % à 26,3 %.", u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC7310733", f:"Essai contrôlé"},
  {k:"stephenson", t:"Pilote de confirmation de rendez-vous (University of Kentucky, 577 patients, sans groupe témoin). 82 % des confirmés sont venus, et 58 % des patients qui n'avaient pas confirmé aussi.", u:"https://uknowledge.uky.edu/dnp_etds/82", f:"Indicatif"},
  {k:"hallsworth", t:"Hallsworth et al., PLOS ONE, 2015 (environ 10 000 patients par essai). Dire le coût précis d'une absence fait passer les absences de 11,1 % à 8,4 % ; la norme sociale seule n'a pas d'effet significatif.", u:"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0137306", f:"Essai contrôlé"},
  {k:"sanders", t:"Sanders et Kirkman, Journal of Behavioral Public Administration (Jobcentre de Bedford, 1 224 personnes). Présence de 10,5 % (témoin) à 26,8 % avec le prénom, le nom du conseiller et « je vous ai réservé une place ».", u:"https://journal-bpa.org/index.php/jbpa/article/view/24", f:"Essai contrôlé"},
  {k:"milkman11", t:"Milkman et al., 2011 (vaccination). Faire écrire la date et l'heure prévues : +4,2 points ; la date seule : pas d'effet significatif.", u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC3127912", f:"Essai contrôlé"},
  {k:"martin", t:"Martin, Bassi, Dunbar-Rees, « Commitments, norms and custard creams », 2012. Faire écrire au patient la date et l'heure de son rendez-vous : 18 % d'absences en moins. Avant/après, non randomisé.", u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC3308641", f:"Indicatif"},
  {k:"milkman21", t:"Milkman et al., PNAS, 2021 (47 306 personnes). Le meilleur SMS combine deux rappels et la mention « réservé pour vous ».", u:"https://doi.org/10.1073/pnas.2101165118", f:"Essai contrôlé"},
  {k:"altmann", t:"Altmann et Traxler, IZA DP 6699 (rendez-vous dentaires). Recevoir des rappels de façon répétée n'en réduit pas l'effet.", u:"https://www.iza.org/publications/dp/6699", f:"Essai contrôlé"},
  {k:"twilio", t:"Twilio, documentation des expéditeurs alphanumériques : « recipients cannot reply ». Un SMS envoyé sous le nom « FranceIA » ne peut pas recevoir de réponse.", u:"https://www.twilio.com/docs/numbers-and-senders/alphanumeric-senders", f:"Documentation"},
  {k:"af2m", t:"Charte af2m (1er mars 2026), via Twilio : SMS promotionnels de 8 h à 21 h 30 du lundi au samedi ; les messages fonctionnels, comme le rappel d'un RDV pris par la personne, ne sont pas concernés.", u:"https://www.twilio.com/en-us/guidelines/fr/sms", f:"Réglementaire"},
  {k:"demarchage", t:"Démarchage téléphonique au 11/08/2026 : consentement préalable, appels du lundi au vendredi de 10 h à 13 h et de 14 h à 20 h, 4 appels au plus sur 30 jours. Le Club des juristes et le Blog du Modérateur (sources secondaires).", u:"https://www.blogdumoderateur.com/demarchage-telephonique-fin-bloctel-11-aout/", f:"Réglementaire"},
  {k:"editeurs", t:"Recommandations d'éditeurs de prise de RDV, sans données contrôlées : Calendly (rappels 24 h et 4 h avant), Chili Piper (1 h et 1 min avant), SaleSkick (24 h, 8 h, 1 h, puis 15 min avec le lien).", u:"https://chilipiper.com/article/how-to-handle-no-shows", f:"Indicatif"},
  {k:"allo", t:"Allô, documentation de l'API, SMS en France : « French operators block SMS sent from standard mobile numbers » ; avec un expéditeur alphanumérique comme « FranceIA », « Recipients cannot reply » ; un numéro court accepte les réponses, avec 2 à 4 mois de mise en place.", u:"https://help.withallo.com/en/v2/api-reference/sms/send-sms-france", f:"Documentation"},
];
const SRC_INDEX = Object.fromEntries(SOURCES.map((s, i) => [s.k, i + 1]));
/* Une source : lien direct vers le document (la liste des sources a quitté la page le 28/10). */
const R = (...keys) => `<span class="ref">[${keys.map((k, i) => { const s = SOURCES[SRC_INDEX[k] - 1]; return `<a href="${s.u}" target="_blank" rel="noopener" title="${(s.t + " · " + s.f).replace(/"/g, "&quot;")}">source${keys.length > 1 ? " " + (i + 1) : ""}</a>`; }).join(", ")}]</span>`;

/* ------------------------------------------------------------------ */
/* Messages réutilisés                                                  */
/* ------------------------------------------------------------------ */
const MSG_PROGRAMME_AUJ = {type:"mail", de:"{prénom setteuse}, depuis sa boîte Gmail", objet:"Votre programme France IA",
  corps:"Bonjour {prénom},\n\nMerci pour votre intérêt pour les formations France IA. Vous pourrez [[retrouver le programme ici]].\n\nVous pouvez répondre directement à cet email si vous avez une question.\n\nÀ bientôt,\n{prénom setteuse}\nFrance IA"};

  corps:"Bonjour {prénom},\n\nNous avions rendez-vous {aujourd'hui ou date} pour échanger sur votre projet de formation en IA, mais nous n'avons pas réussi à vous avoir.\n\nSi vous souhaitez toujours avancer sur votre projet, vous pouvez choisir directement un nouveau créneau ici : {lien de reprise}\n\nSi votre projet ou vos disponibilités ont changé, aucun souci : vous pouvez simplement nous répondre à cet email pour nous le signaler.\n\nÀ bientôt,\n{prénom closer} - France IA"};

const ROX = {
  mailA: {type:"mail", de:"Automatique, au nom de la setteuse", objet:"(non précisé)", corps:"Bonjour [Prénom],\n\nMerci pour votre intérêt pour les formations France IA. Vous pourrez [consulter la brochure jointe / insérer le lien vers la brochure]. Un membre de notre équipe va vous appeler pour vous donner plus de renseignements. Répondez non à ce mail si vous ne souhaitez pas poursuivre.\n\nVous pouvez répondre directement à cet email si vous avez une question.\n\nÀ bientôt,\n[Prénom du setter]\nFrance IA"},
  mailE: {type:"mail", de:"Automatique, au nom du closer", objet:"(non précisé)", corps:"Bonjour [Prénom du client],\n\nJe vous écris pour vous confirmer notre rendez-vous le JJ/MM/AAAA à HH:MM. Un membre de notre équipe va vous contacter pour faire le point sur vos objectifs et votre usage actuel de l'IA pour comprendre quel accompagnement serait le plus adapté.\n\nMerci de répondre à ce mail avec des créneaux horaires précis si vous avez des contraintes de disponibilités. En l'absence de ce retour, nous vous appellerons dès que possible.\n\nÀ très vite,\n[Prénom du closer] – France IA\n\n(plaquette en pièce jointe)"},
  mailB: {type:"mail", de:"Automatique, au nom du closer", objet:"(non précisé)", corps:"Bonjour [Prénom],\n\nJe vous écris pour vous confirmer notre rendez-vous le JJ/MM/AAAA à HH:MM. Nous ferons le point en visio sur vos objectifs et votre usage actuel de l'IA pour comprendre quel accompagnement serait le plus adapté.\n\nVoilà à nouveau le lien Google Meet : {lien Meet}\n\nÀ très vite,\n[Prénom du closer] – France IA"},

  sms1: {type:"sms", de:"Ligne de la setteuse", corps:"Bonjour, c'est [Prénom du setter] de France IA. Je viens vers vous concernant votre demande de renseignements / le rendez-vous que vous avez pris auprès de notre organisme. Comme nous l'avons mentionné, nous avons plusieurs niveaux de formation et le but de cet appel est de vous permettre une préorientation vers ce qui serait le plus adapté pour vous. N'hésitez pas à me rappeler à ce numéro dès que vous avez un instant."},
  vocal2: {type:"script", label:"Vocal 2", corps:"Bonjour, c'est de nouveau [Prénom du setter] de chez France IA, l'organisme de formation en intelligence artificielle. J'ai tenté de vous joindre hier concernant nos programmes. N'hésitez pas à me rappeler au numéro qui s'affiche dès que possible. Belle journée."},
  mail1: {type:"mail", de:"La setteuse", objet:"(non précisé)", corps:"Bonjour,\n\nC'est de nouveau [Prénom du setter] de chez France IA, l'organisme de formation en intelligence artificielle. J'ai tenté de vous joindre hier concernant nos programmes. N'hésitez pas à me recontacter dès que possible.\n\nBelle journée,\n[Prénom du setter]"},

  smsD: {type:"sms", de:"Automatique, signé par la setteuse", corps:"Bonjour [Prénom du client],\n\nC'est [Prénom du setter] de France IA, j'espère que vous allez bien !\n\nJe tenais à vous souhaiter un excellent rendez-vous en visio avec [Prénom du closer] à HH:MM.\n\nVous avez reçu tous les éléments par mail : pensez à bien vérifier vos spams si vous ne les trouvez pas. Si vous avez la moindre question, n'hésitez pas à me contacter directement à ce numéro : {numéro de la setteuse} ou à envoyer « Lien » par SMS pour qu'on vous le renvoie.\n\nBelle journée,\n[Prénom du setter] – France IA"},

  scriptRdv: {type:"script", label:"Pour finir l'appel : confirmer", corps:"« C'est confirmé pour {jour} à {heure}. L'invitation est dans votre agenda, avec le lien de la visio : vous pouvez l'accepter maintenant. Une heure avant, vous recevrez aussi le lien par SMS. »",

  smsAppel: {type:"sms", de:"Ligne Allô de la setteuse · réponse possible", corps:"Bonjour {prénom}, c'est {prénom setteuse} de France IA. Je n'ai pas réussi à vous joindre au sujet de votre rendez-vous du {jour} à {heure}. Pouvons-nous nous appeler ? Dites-moi quand. Si vous préférez éviter l'appel, répondez OUI pour confirmer le rendez-vous, ou NON pour l'annuler.\n((RDV pris avant 18 h la veille|Sans réponse avant {ce soir ou jour de la veille} 18 h, le rendez-vous sera annulé pour libérer le créneau.))",
    why:"Le schéma de Tanguy : qui appelle et pourquoi, puis une question simple. Le lead choisit : un appel au moment qui l'arrange, ou une confirmation sans appel. Depuis le 27/10, il dit aussi ce qui se passe sans réponse, et ce qui est écrit est fait.",
    more:`Il part de la ligne Allô de la setteuse, pour que la réponse lui arrive : un SMS « FranceIA » ne peut pas en recevoir ${R("twilio")}. Il remplace le message vocal de la version précédente et, chez Roxane, un vocal et un SMS de plus de 400 caractères. Un seul SMS de ce type par RDV : sans réponse, les appels suivants partent sans nouveau message.</p><p>La dernière phrase date du 27/10. Tanguy : « si on dit par texto "répondez, ou on annule le rendez-vous", il faut le faire ». L'heure limite écrite rend l'annulation attendue, pas une surprise. Dans un essai sur 161 587 rendez-vous, un SMS qui permettait de confirmer ou d'annuler, en disant que d'autres attendaient le créneau, a fait passer les absences de 21,1 % à 14,2 %, et les annulations prévenues à l'avance de 17,2 % à 26,3 % ${R("berliner")}.</p><p>Elle n'apparaît pas pour un RDV pris après 18 h la veille ou le jour même : il n'a pas d'heure limite. {ce soir ou jour de la veille} s'écrit « ce soir » quand le RDV est le lendemain, sinon le jour (« demain », « dimanche »).`},

/* Texte d'un message : liens [[...]], variables {{...}}, {...} et [...] mises en évidence. */
/* ((condition|texte)) : passage envoyé seulement dans ce cas, montré en encadré. */
const COND = /\(\(([^|()]+)\|([\s\S]*?)\)\)/g;
function fmt(txt){
  return esc(txt)
    .replace(COND, (m, c, t) => `\u0001${c}\u0002${t}\u0003`)
    .replace(/\[\[([^\]]+)\]\]|\{\{([^}]+)\}\}|\{([^}]+)\}|\[([^\]]+)\]/g, (m, lnk, v2, v1, v0) =>
      lnk ? `<span class="lnk">${lnk}</span>` : `<span class="var">${v2 || v1 || v0}</span>`)
    .replace(/\n/g, "<br>")
    .replace(/(<br>)*\u0001([^\u0002]*)\u0002(<br>)*/g, (m, a, c) => `<span class="cond"><span class="cond-l">Seulement si ${c}</span>`)
    .replace(/(<br>)*\u0003(<br>)*/g, "</span>");
}
const sansCond = t => t.replace(COND, "$2");

function renderMsg(m){
  let h = "";
  if (m.type === "sms"){
    h = `<p class="msg-h">SMS · ${esc(m.de || "")}</p><div class="sms">${fmt(m.corps)}</div><p class="msg-meta">≈ ${sansCond(m.corps).length} caractères avec les passages conditionnels, variables non remplies</p>`;
  } else if (m.type === "mail"){
    h = `<div class="mail"><dl><dt>De</dt><dd>${esc(m.de || "")}</dd><dt>Objet</dt><dd>${esc(m.objet || "")}</dd></dl><div class="mail-b">${fmt(m.corps)}</div></div>`;
  } else if (m.type === "script"){
    h = `<p class="msg-h">${esc(m.label || "Ce que dit la setteuse")}</p><div class="script">${fmt(m.corps)}</div>`;
  } else if (m.type === "page"){
    h = `<p class="msg-h">${esc(m.vu || "Ce que voit le lead")}</p><div class="pagemsg"><strong>${esc(m.titre)}</strong>${fmt(m.corps)}</div>`;
  }
  if (m.why){
    h += m.more
      ? `<details class="why"><summary><b>Pourquoi ce texte :</b> ${m.why} <span class="plus">Le détail</span></summary><div class="more">${m.more}</div></details>`
      : `<p class="why"><b>Pourquoi ce texte :</b> ${m.why}</p>`;
  }
  return `<div class="msg">${h}</div>`;
}

function toggle(label, body){
  const pid = id("p");
  return {
    btn:`<button type="button" class="tgl" aria-expanded="false" aria-controls="${pid}">${label}</button>`,
    panel:`<div class="tgl-p" id="${pid}" hidden>${body}</div>`,
  };
}

/* ------------------------------------------------------------------ */
/* Le schéma : placement des étapes en colonnes (le temps) et en       */
/* rangées (0 = le lead décroche, 1 = tous les leads, 2 = il ne        */
/* décroche pas, 3 = sortie d'une branche).                            */
/* ------------------------------------------------------------------ */
const G = {colW:124, rowH:136, padX:16, top:26, tile:56};
const msgsOf = s => s.msgs || (s.msg ? [s.msg] : (s.textes || []).map(t => t.msg));
/* Les textes à écrire d'une étape : une liste (les appels), ou le seul message de l'étape. */
const textesOf = s => s.textes || (s.final ? [{final:s.final, nf:s.nf, msg:msgsOf(s)[0], rox:s.rox, roxNote:s.roxNote}] : []);

/* Le libellé d'un parcours : celui de PATHS, ou celui que la version lui donne (les cas de Tanguy). */
const chemin = (vk, pk) => ({...PATHS[pk], ...VERSIONS[vk].paths[pk]});

function layout(vk, pk){
  const moments = VERSIONS[vk].paths[pk].moments;
  const nodes = [], edges = [], segs = [], libres = [];
  const add = n => { n.k = "n" + nodes.length; nodes.push(n); return n.k; };
  const link = (tails, to, label) => tails.forEach(t => edges.push({from:t.k, to, label: label || t.label, pres:t.pres}));
  let tails = {main:[{k:add({kind:"depart", col:0, row:1, label:chemin(vk, pk).depart})}], joint:[], non:[]};
  let split = false, col = 1;
  const attente = {joint:[], non:[]}; /* liens qui rejoindront la prochaine étape de l'autre branche */

  const step = (s, m, c, row, from, label) => {
    const k = add({kind:"step", col:c, row, s, m, label:s.n});
    link(from, k, s.si || label);
    return k;
  };
  const lanes = (m, c0) => {
    let end = c0;
    for (const L of ["joint", "non"]){
      let c = c0;
      for (const s of m.steps.filter(x => x.pour === L)){
        if (s.vers){
          /* Rejoindre l'autre branche : sa prochaine étape recevra ce lien, et cette branche continue
             après une colonne laissée libre pour les deux étiquettes. */
          attente[s.vers].push(...tails[L].map(t => ({k:t.k, label:s.si, pres:true})));
          tails[L] = tails[L].map(t => ({k:t.k, label:s.sinon}));
          c++; continue;
        }
        if (s.fin && s.sinon){
          /* Sortie de branche : l'étape, grisée, part sur une rangée à part ; la branche continue. */
          const r = L === "non" ? 3 : -1;
          step(s, m, c + 1, r, tails[L]);
          tails[L] = tails[L].map(t => ({k:t.k, label:s.sinon}));
          c += 2; continue;
        }
        const from = attente[L].length ? [...tails[L].map(t => ({...t, pres:true})), ...attente[L].splice(0)] : tails[L];
        const k = step(s, m, c, L === "joint" ? 0 : 2, from);
        c++;
        if (s.fin) tails[L] = [];
        else if (s.goto){ edges.push({from:k, to:add({kind:"suite", col:c, row:L === "joint" ? 0 : 2, label:`Suite : parcours « ${PATHS[s.goto].l} »`, goto:s.goto})}); c++; tails[L] = []; }
        else tails[L] = [{k}];
      }
      end = Math.max(end, c);
    }
    return end;
  };
  const mains = (m, c, from) => {
    let first = true;
    for (const s of m.steps.filter(x => !x.pour || x.pour === "all")){
      const k = step(s, m, c++, 1, from, first ? m.cond : undefined);
      from = [{k}]; first = false;
    }
    tails.main = from;
    return c;
  };

  for (const m of moments){
    if (m.t === "À tout moment"){ libres.push(...m.steps.map(s => ({s, m}))); continue; }
    const aMain = m.steps.some(x => !x.pour || x.pour === "all");
    const aLane = m.steps.some(x => x.pour === "joint" || x.pour === "non");
    let c = col;
    if (m.cote){
      for (const s of m.steps) step(s, m, c++, 0, tails.main);
    } else if (!split){
      if (aMain) c = mains(m, c, tails.main);
      if (aLane){
        const k = add({kind:"si", col:c++, row:1, label:m.si || "Le lead décroche ?"});
        link(tails.main, k);
        tails = {main:[], joint:[{k, label:m.oui || "Oui"}], non:[{k, label:m.non || "Non"}]};
        split = true;
        c = lanes(m, c);
      }
    } else {
      if (aLane) c = lanes(m, c);
      if (aMain){
        c = mains(m, c, [...tails.joint, ...tails.non]);
        tails.joint = []; tails.non = []; split = false;
      }
    }
    segs.push({m, start:col, end:c});
    col = c;
  }
  const rows = nodes.map(n => n.row);
  return {nodes, edges, segs, libres, cols:col, rmin:Math.min(0, ...rows), rmax:Math.max(2, ...rows)};
}

function nodePos(n, L){
  return {x:G.padX + n.col * G.colW, y:G.top + (n.row - L.rmin) * G.rowH};
}

function edgePath(a, b, na, nb, pres){
  const h = G.tile / 2;
  const x1 = a.x + G.colW / 2 + h, y1 = a.y + h;
  const x2 = b.x + G.colW / 2 - h - 4, y2 = b.y + h;
  if (y1 === y2) return {d:`M${x1} ${y1}H${x2}`, lx:(x1 + x2) / 2, ly:y1};
  const span = x2 - x1, bend = Math.min(span, 84), droit = span - bend;
  if (pres){
    /* Plusieurs liens rejoignent la même étape : chacun monte aussitôt, et son étiquette reste près de sa source. */
    return {d:`M${x1} ${y1}C${x1 + bend / 2} ${y1} ${x1 + bend / 2} ${y2} ${x1 + bend} ${y2}H${x2}`, lx:x1 + bend / 2, ly:(y1 + y2) / 2};
  }
  if ((nb.row === 3 || nb.row === -1) && na.kind === "step" && na.row !== 1){
    /* Sortie de branche : on file sur la branche, et l'on descend près de la sortie, pour que deux sorties voisines ne se croisent pas. */
    return {d:`M${x1} ${y1}H${x2 - bend}C${x2 - bend / 2} ${y1} ${x2 - bend / 2} ${y2} ${x2} ${y2}`, lx:x2 - bend / 2, ly:(y1 + y2) / 2};
  }
  if (na.row === 1 || na.kind === "si" || nb.row === 3 || nb.row === -1){
    /* Embranchement : la courbe part de la source, puis file sur la rangée. */
    const g = {d:`M${x1} ${y1}C${x1 + bend / 2} ${y1} ${x1 + bend / 2} ${y2} ${x1 + bend} ${y2}H${x2}`};
    return droit >= 80 ? {...g, lx:x1 + bend + droit / 2, ly:y2} : {...g, lx:x1 + bend / 2, ly:(y1 + y2) / 2};
  }
  /* Retour vers les étapes communes : la courbe arrive près de la cible. */
  const g = {d:`M${x1} ${y1}H${x2 - bend}C${x2 - bend / 2} ${y1} ${x2 - bend / 2} ${y2} ${x2} ${y2}`};
  return droit >= 80 ? {...g, lx:x1 + droit / 2, ly:y1} : {...g, lx:x2 - bend / 2, ly:(y1 + y2) / 2};
}

function badgeOf(s){
  if (s.verdict) return `<span class="vd vd-${s.verdict}" title="${VERDICTS[s.verdict].l}">${VERDICTS[s.verdict].g}</span>`;
  if (s.tag && s.tag !== "same") return `<span class="tg tg-${s.tag}">${TAGS[s.tag]}</span>`;
  return "";
}

function renderNode(n, L){
  const p = nodePos(n, L);
  const st = `left:${p.x}px;top:${p.y}px;width:${G.colW}px`;
  if (n.kind === "step"){
    const s = n.s, ca = CANAUX[s.canal] || CANAUX.crm, nb = msgsOf(s).length;
    const cls = ["node"];
    if (s.ghost) cls.push("ghost");
    if (s.tag === "del") cls.push("del");
    if (s.fin) cls.push("bout");
    const mm = nb ? `<span class="nm">${ico("mail")}${nb > 1 ? `${nb} messages` : "1 message"}</span>` : "";
    return `<button type="button" class="${cls.join(" ")}" data-k="${n.k}" style="${st}" aria-pressed="${state.sel === n.k}" aria-label="${esc(s.titre.replace(/<[^>]+>/g, "") + (s.fin ? ". Fin de la branche : " + s.fin : ""))}">
      <span class="tile">${ico(ca.i)}${badgeOf(s)}</span><span class="nl">${esc(n.label)}</span>${mm}</button>`;
  }
  if (n.kind === "suite"){
    return `<button type="button" class="node suite" data-goto="${n.goto}" style="${st}"><span class="tile">${ico("suite")}</span><span class="nl">${esc(n.label)}</span></button>`;
  }
  return `<div class="node ${n.kind}" style="${st}"><span class="tile">${ico(n.kind)}</span><span class="nl">${esc(n.label)}</span></div>`;
}

function renderFlow(vk){
  const L = layout(vk, state.path);
  const W = G.padX * 2 + L.cols * G.colW, H = G.top + (L.rmax - L.rmin + 1) * G.rowH - 10;
  if (state.zoomAuto){
    const dispo = Math.min(document.documentElement.clientWidth - (innerWidth <= 640 ? 32 : 48), innerWidth < 1440 ? 1132 : 1760) - 2;
    state.zoom = innerWidth <= 640 ? 0.8 : Math.max(0.8, Math.min(1, Math.floor(dispo / W * 100) / 100));
  }
  const byK = Object.fromEntries(L.nodes.map(n => [n.k, n]));
  let paths = "", labels = "";
  for (const e of L.edges){
    const na = byK[e.from], nb = byK[e.to];
    const g = edgePath(nodePos(na, L), nodePos(nb, L), na, nb, e.pres);
    const faible = nb.kind === "step" && (nb.s.ghost || nb.s.tag === "del");
    paths += `<path d="${g.d}" class="${faible ? "faible" : ""}" marker-end="url(#fl)"/>`;
    if (e.label) labels += `<span class="el" style="left:${g.lx}px;top:${g.ly}px">${esc(e.label)}</span>`;
  }
  state.ordre = [...L.nodes.filter(n => n.kind === "step").sort((a, b) => a.col - b.col || a.row - b.row).map(n => n.k), ...L.libres.map((_, i) => "l" + i)];
  state.noeuds = Object.fromEntries([...L.nodes.filter(n => n.kind === "step").map(n => [n.k, n]), ...L.libres.map((l, i) => ["l" + i, {k:"l" + i, s:l.s, m:l.m}])]);
  const libres = L.libres.length ? `<div class="libres"><span class="libres-h">À tout moment</span>${L.libres.map((l, i) => `<button type="button" class="libre" data-k="l${i}" aria-pressed="${state.sel === "l" + i}">${ico((CANAUX[l.s.canal] || CANAUX.crm).i)}<span>${esc(l.s.n)}</span>${badgeOf(l.s)}</button>`).join("")}</div>` : "";
  return `<div class="flow-wrap">
    <div class="flow" id="flow" tabindex="-1" style="--z:${state.zoom}">
      <div class="flow-sizer" style="width:${W * state.zoom}px;height:${H * state.zoom}px">
        <div class="flow-in" style="width:${W}px;height:${H}px;transform:scale(${state.zoom})">
          <svg class="edges" width="${W}" height="${H}" aria-hidden="true"><defs><marker id="fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z"/></marker></defs>${paths}</svg>
          ${labels}
          ${L.nodes.map(n => renderNode(n, L)).join("")}
        </div>
      </div>
    </div>
    <p class="flow-hint">Faites glisser le schéma pour le parcourir. Cliquez sur une étape pour lire son détail et ses messages.</p>
    ${libres}
  </div>`;
}

function toolbar(vk){
  const v = VERSIONS[vk];
  const seg = Object.keys(v.paths).map(k => {
    const p = chemin(vk, k);
    return `<button type="button" data-path="${k}" aria-pressed="${state.path === k}">${p.l}<small>${p.s}</small></button>`;
  }).join("");
  return `<div class="toolbar">
    <div class="seg${Object.keys(v.paths).length > 2 ? " n4" : ""}" role="group" aria-label="Parcours">${seg}</div>
    <div class="zoom" role="group" aria-label="Zoom du schéma">
      <button type="button" data-zoom="-1" aria-label="Dézoomer">−</button><span id="zoom-v">${Math.round(state.zoom * 100)} %</span><button type="button" data-zoom="1" aria-label="Zoomer">+</button><button type="button" data-zoom="fit" class="fit">Vue d'ensemble</button>
    </div>
  </div>`;
}

function renderVersion(vk){
  const v = VERSIONS[vk];
  if (!v.paths[state.path]) state.path = "rdv";
  const head = v.intro ? `<div class="v-head"><h2>${v.titre}</h2><p>${v.intro}</p></div>` : "";
  const schema = renderFlow(vk); /* fixe le zoom avant d'afficher sa valeur */
  const flow = head + toolbar(vk) + schema;
  return flow + textes();
}

/* ------------------------------------------------------------------ */
/* Le panneau de détail                                                 */
/* ------------------------------------------------------------------ */
function panelHtml(n){
  const s = n.s, m = n.m, v = VERSIONS[state.tab], ca = CANAUX[s.canal] || CANAUX.crm;
  const marque = s.verdict ? `<span class="pill vd-l vd-l-${s.verdict}">${VERDICTS[s.verdict].l}</span>` : s.tag ? `<span class="pill tg-l tg-l-${s.tag}">${TAGS[s.tag]}</span>` : "";
  const lane = s.pour && LANES[s.pour] ? `<span class="pill">${LANES[s.pour]}</span>` : "";
  const bout = s.fin ? `<span class="pill pill-bout">Fin de la branche : ${esc(s.fin)}</span>` : "";
  const msgs = msgsOf(s), ts = textesOf(s);
  const notes = [...(s.chips || []), ...(m.note || [])];
  return `<div class="pn-meta"><span class="pn-canal">${ico(ca.i)}${ca.l}</span>${lane}${marque}${bout}</div>
    <h3 id="pn-titre">${s.titre}</h3>
    <p class="pn-qui">${esc(s.qui || "")}</p>
    <p class="pn-court">${s.court}</p>
    ${s.regle ? `<dl class="pn-regle">${s.regle.map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl>` : ""}
    ${notes.length ? `<ul class="pn-notes">${notes.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}
    ${ts.length ? blocsFinals(ts) : msgs.length ? `<section class="pn-s"><h4>${msgs.length > 1 ? `Les ${msgs.length} messages` : msgs[0].type === "script" ? "Le texte" : "Le message"}</h4>${msgs.map(renderMsg).join("")}</section>` : ""}
    ${s.detail ? `<section class="pn-s pn-d"><h4>${v.detailLabel}</h4>${s.detail}</section>` : ""}
    ${s.goto ? `<button type="button" class="pn-goto" data-goto="${s.goto}">Voir la suite : parcours « ${chemin(state.tab, s.goto).l} » →</button>` : ""}`;
}

/* ------------------------------------------------------------------ */
/* Scripts finaux de Roxane (onglet de Tanguy). Enregistrés pour tous   */
/* ceux qui ont le lien, sans compte (Tanguy, 27/10 : « pas besoin de   */
/* protection »), avec l'historique des versions. Un champ par texte :  */
/* l'étape des appels en a six.                                         */
/* ------------------------------------------------------------------ */
const FINAL_API = "https://mhaeeketoyexbbtgotzi.supabase.co/functions/v1/maquette-scripts";
const FINAL_PAGE = "parcours-setting";
const FINAL_LS = "parcours-setting:brouillon:";
const FINALS = {};     /* dernière version enregistrée, par clé */
const BROUILLONS = {}; /* texte tapé, pas encore enregistré */
const ENVOIS = new Set(); /* clés en cours d'enregistrement */
let finalEtat = "chargement";

const quand = iso => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("fr-FR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false, timeZone:"Europe/Paris"})
    .formatToParts(new Date(iso)).map(x => [x.type, x.value]));
  return `le ${p.day}/${p.month} à ${p.hour} h ${p.minute}`;
};
const enregistre = cle => FINALS[cle] ? FINALS[cle].texte : "";
const modifie = cle => BROUILLONS[cle] !== undefined && BROUILLONS[cle] !== enregistre(cle);

function statutFinal(cle){
  if (modifie(cle)) return {c:"mod", t:"Modifié, pas encore enregistré."};
  const f = FINALS[cle];
  if (f) return {c:"", t:`Enregistré ${quand(f.cree_le)}${f.versions > 1 ? ` · ${f.versions} versions gardées` : ""}.`};
  if (finalEtat === "chargement") return {c:"", t:"Chargement des textes enregistrés…"};
  if (finalEtat === "erreur") return {c:"err", t:"Les textes enregistrés n'ont pas pu être chargés. Vous pouvez écrire quand même : le texte reste sur cet appareil jusqu'à ce qu'il soit enregistré."};
  return {c:"", t:"Pas encore de script final."};
}

/* Met à jour la ligne d'état d'un champ ouvert, et la liste des textes. */
function majFinal(cle, st){
  const el = cle && document.getElementById("fs-" + cle);
  if (el){
    const s = st || statutFinal(cle);
    el.textContent = s.t;
    el.className = "final-st" + (s.c ? " " + s.c : "");
  }
  const li = document.getElementById("txt-list");
  if (li) li.innerHTML = textesItems();
}

function brouillon(cle, txt){
  BROUILLONS[cle] = txt;
  try { localStorage.setItem(FINAL_LS + cle, txt); } catch (e) {}
}
function oublier(cle){
  delete BROUILLONS[cle];
  try { localStorage.removeItem(FINAL_LS + cle); } catch (e) {}
}

function chargerFinals(){
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.startsWith(FINAL_LS)) BROUILLONS[k.slice(FINAL_LS.length)] = localStorage.getItem(k);
    }
  } catch (e) {}
  fetch(`${FINAL_API}?page=${FINAL_PAGE}`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { Object.assign(FINALS, d.scripts || {}); finalEtat = "ok"; })
    .catch(() => { finalEtat = "erreur"; })
    .finally(() => {
      for (const cle of Object.keys(BROUILLONS)) if (finalEtat === "ok" && !modifie(cle)) oublier(cle);
      document.querySelectorAll(".final-txt").forEach(ta => {
        if (BROUILLONS[ta.dataset.cle] === undefined) ta.value = enregistre(ta.dataset.cle);
        majFinal(ta.dataset.cle);
      });
      majFinal("");
    });
}

function enregistrer(cle){
  const ta = document.getElementById("ft-" + cle);
  if (!ta || ENVOIS.has(cle)) return;
  const texte = ta.value;
  if (!modifie(cle) && (FINALS[cle] || !texte.trim())){
    majFinal(cle, {c:"", t:FINALS[cle] ? "Rien de nouveau à enregistrer : ce texte est déjà enregistré." : "Écrivez d'abord le texte, ou partez de ma proposition."});
    return;
  }
  ENVOIS.add(cle);
  const bouton = () => document.querySelector(`[data-final="enregistrer"][data-cle="${cle}"]`);
  if (bouton()) bouton().disabled = true;
  majFinal(cle, {c:"", t:"Enregistrement…"});
  fetch(FINAL_API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({page:FINAL_PAGE, cle, texte})})
    .then(r => r.json().catch(() => ({})).then(d => r.ok ? d : Promise.reject(d.erreur || `erreur ${r.status}`)))
    .then(d => {
      FINALS[cle] = {texte:d.texte, cree_le:d.cree_le, versions:FINALS[cle] ? FINALS[cle].versions + 1 : 1};
      if (BROUILLONS[cle] === undefined || BROUILLONS[cle] === d.texte) oublier(cle);
      majFinal(cle);
    })
    .catch(err => majFinal(cle, {c:"err", t:`Pas enregistré (${typeof err === "string" ? err : "réseau indisponible"}). Le texte reste sur cet appareil : réessayez.`}))
    .finally(() => { ENVOIS.delete(cle); if (bouton()) bouton().disabled = false; });
}

/* Texte brut d'un message, pour partir d'une proposition : les passages conditionnels restent signalés. */
const brut = (m, objet) => {
  const c = (m.corps || "").replace(COND, (x, cond, t) => `[Seulement si ${cond} : ${t}]`);
  return objet && m.type === "mail" && m.objet && !m.objet.startsWith("(") ? `Objet : ${m.objet}\n\n${c}` : c;
};
function partir(source, cle){
  const ta = document.getElementById("ft-" + cle), n = state.noeuds && state.noeuds[state.sel];
  const t = n && textesOf(n.s).find(x => x.final === cle);
  if (!ta || !t) return;
  const rox = t.rox || [];
  const m = source === "rox" ? (rox.find(x => x.type === t.msg.type) || rox[0]) : t.msg;
  if (!m) return;
  const txt = brut(m, t.msg.type === "mail");
  if (ta.value.trim() && ta.value !== txt && !confirm("Remplacer le texte en cours ?")) return;
  ta.value = txt;
  brouillon(cle, txt);
  majFinal(cle);
  ta.focus();
}

/* Un champ par texte, bien en vue ; ma proposition et la trame de Roxane, repliées dessous. */
function blocFinal(t, multi){
  const cle = t.final, val = BROUILLONS[cle] !== undefined ? BROUILLONS[cle] : enregistre(cle), st = statutFinal(cle), rox = t.rox || [];
  const moi = toggle("Ma proposition", renderMsg(t.msg));
  const elle = rox.length ? toggle("Ce qu'avait Roxane", (t.roxNote ? `<p class="pn-note">${t.roxNote}</p>` : "") + rox.map(renderMsg).join("")) : null;
  return `<div class="pn-final${multi ? " multi" : ""}" id="fx-${cle}">
    <label class="fx-h" for="ft-${cle}">Script final${multi ? ` · ${t.titre}` : ""}</label>
    <textarea class="final-txt" id="ft-${cle}" data-cle="${cle}" aria-describedby="fs-${cle}" rows="${multi ? 6 : 8}" placeholder="Écrivez ici le texte final, ou partez de ma proposition.">${esc(val)}</textarea>
    <div class="final-act"><button type="button" class="btn-f pri" data-final="enregistrer" data-cle="${cle}">Enregistrer</button><button type="button" class="btn-f" data-final="moi" data-cle="${cle}">Partir de ma proposition</button>${rox.length ? `<button type="button" class="btn-f" data-final="rox" data-cle="${cle}">Partir de la trame de Roxane</button>` : ""}</div>
    <p class="final-st${st.c ? " " + st.c : ""}" id="fs-${cle}" role="status" aria-live="polite">${st.t}</p>
    <div class="sugg">${moi.btn}${elle ? elle.btn : ""}</div>${moi.panel}${elle ? elle.panel : `<p class="pn-note fx-n">${t.roxNote || "Pas d'étape semblable chez Roxane."}</p>`}
  </div>`;
}
function blocsFinals(ts){
  const multi = ts.length > 1;
  return `<section class="pn-s fx-zone"><p class="final-aide">${multi ? `${ts.length} textes à écrire : le discours et le message vocal de chaque appel. ` : ""}Le texte qui partira vraiment s'enregistre pour tous ceux qui ont le lien de cette page, et chaque version est gardée.</p>
    ${ts.map(t => (t.groupe ? `<p class="fx-g">${t.groupe}</p>` : "") + blocFinal(t, multi)).join("")}</section>`;
}

/* La liste des textes, sous le schéma : chacun ouvre son étape, sur son champ. */
function textesListe(){
  const items = new Map();
  for (const [pk, p] of Object.entries(VERSIONS.tanguy.paths))
    for (const m of p.moments) for (const s of m.steps) for (const t of textesOf(s)){
      if (!items.has(t.final)) items.set(t.final, {pk, s, t, cas:[]});
      const it = items.get(t.final);
      if (!it.cas.includes(pk)) it.cas.push(pk);
    }
  return [...items.values()];
}
function textesItems(){
  return textesListe().map(({pk, s, t, cas}) => {
    const st = modifie(t.final) ? ["mod", "Brouillon"] : enregistre(t.final).trim() ? ["ok", "Écrit"] : finalEtat === "chargement" ? ["", "…"] : ["", "À écrire"];
    return `<li><button type="button" class="txt-i" data-texte="${t.final}" data-chemin="${pk}">${ico((CANAUX[s.canal] || CANAUX.crm).i)}<span class="t">${esc(t.nf || s.n)}<small>${esc(cas.map(c => chemin("tanguy", c).l).join(" · "))}</small></span><span class="txt-st ${st[0]}">${st[1]}</span></button></li>`;
  }).join("");
}
function textes(){
  return `<section class="block"><h3>Les textes, un par un</h3><p class="lead">Pour Roxane : chaque SMS, discours et message vocal du parcours. Ouvrez-en un pour écrire le texte final ; ma proposition et sa trame sont juste en dessous, repliées.</p><ul class="txt-list" id="txt-list">${textesItems()}</ul></section>`;
}

function openPanel(k, focus){
  const n = state.noeuds && state.noeuds[k];
  if (!n) return;
  state.sel = k;
  const panel = document.getElementById("panel");
  document.getElementById("pn-eyebrow").textContent = `${n.m.t}${n.m.sub ? " · " + n.m.sub : ""}`;
  document.getElementById("pn-b").innerHTML = panelHtml(n);
  document.getElementById("pn-b").scrollTop = 0;
  const i = state.ordre.indexOf(k);
  document.getElementById("pn-prev").disabled = i <= 0;
  document.getElementById("pn-next").disabled = i >= state.ordre.length - 1;
  panel.hidden = false;
  requestAnimationFrame(() => panel.classList.add("on"));
  document.body.classList.add("pn-ouvert");
  document.querySelectorAll("[data-k]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
  const el = document.querySelector(`.node[data-k="${k}"]`);
  if (el) el.scrollIntoView({behavior: reduit() ? "auto" : "smooth", block:"nearest", inline:"center"});
  if (focus) document.getElementById("pn-x").focus({preventScroll:true});
}

function closePanel(sansFocus){
  const panel = document.getElementById("panel");
  if (panel.hidden) return;
  const k = state.sel;
  state.sel = null;
  panel.classList.remove("on");
  document.body.classList.remove("pn-ouvert");
  setTimeout(() => { if (!state.sel) panel.hidden = true; }, reduit() ? 0 : 220);
  document.querySelectorAll("[data-k]").forEach(b => b.setAttribute("aria-pressed", "false"));
  const el = !sansFocus && document.querySelector(`[data-k="${k}"]`);
  if (el) el.focus({preventScroll:true});
}

/* ------------------------------------------------------------------ */
function render(){
  closePanel(true);
  state.sel = null;
  const main = document.getElementById("vue");
  uid = 0;
  main.innerHTML = renderVersion(state.tab);
  const hash = state.tab + (state.path !== "rdv" ? "-" + state.path : "");
  if (location.hash.slice(1) !== hash) history.replaceState(null, "", "#" + hash);
  panFlow();
}

function setZoom(z){
  const f = document.getElementById("flow");
  if (!f) return;
  const cx = (f.scrollLeft + f.clientWidth / 2) / state.zoom;
  state.zoomAuto = false;
  state.zoom = Math.max(0.35, Math.min(1.3, Math.round(z * 100) / 100));
  const inner = f.querySelector(".flow-in"), sizer = f.querySelector(".flow-sizer");
  inner.style.transform = `scale(${state.zoom})`;
  sizer.style.width = parseFloat(inner.style.width) * state.zoom + "px";
  sizer.style.height = parseFloat(inner.style.height) * state.zoom + "px";
  f.scrollLeft = cx * state.zoom - f.clientWidth / 2;
  document.getElementById("zoom-v").textContent = `${Math.round(state.zoom * 100)} %`;
}

/* Faire glisser le schéma à la souris, comme dans n8n. */
function panFlow(){
  const f = document.getElementById("flow");
  if (!f) return;
  let x0 = null, s0 = 0, y0 = 0, t0 = 0, bouge = false;
  f.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; s0 = f.scrollLeft; t0 = f.scrollTop; bouge = false;
  });
  f.addEventListener("pointermove", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!bouge && Math.abs(dx) + Math.abs(dy) > 5){ bouge = true; f.classList.add("drag"); f.setPointerCapture(e.pointerId); }
    if (bouge){ f.scrollLeft = s0 - dx; f.scrollTop = t0 - dy; }
  });
  const fin = () => { x0 = null; f.classList.remove("drag"); };
  f.addEventListener("pointerup", fin);
  f.addEventListener("pointercancel", fin);
  f.addEventListener("click", e => { if (bouge){ e.stopPropagation(); e.preventDefault(); bouge = false; } }, true);
}

function readHash(){
  /* #tanguy-mql. Un ancien lien vers « Aujourd'hui » (#auj…) ouvre la proposition de Tanguy. */
  state.path = location.hash.slice(1).split("-")[1] || "rdv";
}

function init(){
  readHash();
  render();
  chargerFinals();

  const clic = e => {
    const t = e.target.closest(".tgl");
    if (t){
      const open = t.getAttribute("aria-expanded") !== "true";
      t.setAttribute("aria-expanded", String(open));
      document.getElementById(t.getAttribute("aria-controls")).hidden = !open;
      return true;
    }
    const g = e.target.closest("[data-goto]");
    if (g){
      state.path = g.dataset.goto; render();
      document.querySelector(".toolbar").scrollIntoView({behavior: reduit() ? "auto" : "smooth", block:"start"});
      return true;
    }
    return false;
  };
  document.getElementById("vue").addEventListener("click", e => {
    if (clic(e)) return;
    const tx = e.target.closest("[data-texte]");
    if (tx){
      if (state.path !== tx.dataset.chemin){ state.path = tx.dataset.chemin; render(); }
      const nk = Object.keys(state.noeuds).find(x => textesOf(state.noeuds[x].s).some(t => t.final === tx.dataset.texte));
      if (nk){
        openPanel(nk, true);
        const c = textesOf(state.noeuds[nk].s).length > 1 && document.getElementById("fx-" + tx.dataset.texte);
        if (c) document.getElementById("pn-b").scrollTop = c.offsetTop - 16;
      }
      return;
    }
    const k = e.target.closest("[data-k]");
    if (k){ state.sel === k.dataset.k ? closePanel() : openPanel(k.dataset.k, e.detail === 0); return; }
    const z = e.target.closest("[data-zoom]");
    if (z){
      const f = document.getElementById("flow");
      if (z.dataset.zoom === "fit") setZoom((f.clientWidth - 8) / parseFloat(f.querySelector(".flow-in").style.width));
      else setZoom(state.zoom + Number(z.dataset.zoom) * 0.15);
      return;
    }
    const p = e.target.closest("[data-path]");
    if (p){ state.path = p.dataset.path; render(); }
  });
  document.getElementById("panel").addEventListener("click", e => {
    if (clic(e)) return;
    const f = e.target.closest("[data-final]");
    if (f) f.dataset.final === "enregistrer" ? enregistrer(f.dataset.cle) : partir(f.dataset.final, f.dataset.cle);
  });
  document.getElementById("panel").addEventListener("input", e => {
    if (!e.target.classList.contains("final-txt")) return;
    brouillon(e.target.dataset.cle, e.target.value);
    majFinal(e.target.dataset.cle);
  });
  document.getElementById("pn-x").addEventListener("click", () => closePanel());
  const pas = d => { const i = state.ordre.indexOf(state.sel); const k = state.ordre[i + d]; if (k) openPanel(k); };
  document.getElementById("pn-prev").addEventListener("click", () => pas(-1));
  document.getElementById("pn-next").addEventListener("click", () => pas(1));
  document.addEventListener("keydown", e => {
    if (document.getElementById("panel").hidden) return;
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.classList.contains("final-txt")){ e.preventDefault(); enregistrer(e.target.dataset.cle); return; }
    if (e.key === "Escape") closePanel();
    else if (!e.target.closest("input, textarea") && (e.key === "ArrowRight" || e.key === "ArrowLeft") && e.target.closest("#panel")) pas(e.key === "ArrowRight" ? 1 : -1);
  });
  window.addEventListener("hashchange", () => { readHash(); render(); });
  window.addEventListener("beforeunload", e => {
    if (Object.keys(BROUILLONS).some(modifie)){ e.preventDefault(); e.returnValue = ""; }
  });
}

document.addEventListener("DOMContentLoaded", init);

</script>
