<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace apprenant France IA</title>
<meta name="description" content="Maquette de l’espace apprenant V2 : trois parcours, supports d’atelier en grand, données fictives.">
<!--
  Maquette de l'espace apprenant V2, données fictives.
  Organisation : trois parcours (inscription, formation, facturation) et une page d'accueil « Ma session ».
  Style : maquette de référence de l’espace apprenant (Manrope, DM Sans, Fragment Mono ; fond #f3f9fe ; navy #141d46 ; rose actif).
  Frise des étapes : DELIV'IA 1 (nœuds ronds, seule l'étape en cours se déploie avec son bouton).
  Les « Commandes de démo » en bas de la barre latérale n'existent pas en production.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --blue:#4379f2; --bleu-texte:#1c4eba; --bleu-fond:#eef4fe; --bleu-bord:#d6e3fc;
  --ink:#16161a; --line:#e6e6ee; --cream:#f5f3ec;
  --navy:#141d46; --navy-2:#24305f; --texte:#4c5270; --texte-clair:#6a7186;
  --page:#f3f9fe; --carte:#ffffff; --bord:#e7eef7; --bord-fin:#eef3f9; --survol:#f6f8fc;
  --rose:#fae9e3; --rose-pale:#f9ecea; --rose-1:#fcf6f4; --rose-2:#f8f1f6; --brun:#8a5743;
  --bloc:#f4f6fa; --bloc-txt:#3f4257; --gris-pastille:#f1f4f9;
  --rouge:#c23b3b; --rouge-bg:#fdecea; --vert:#1c7a52; --vert-bg:#e9f6ee;
  --piste:#e6ecf5;
  --mono:'Fragment Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --titre:'Manrope','DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--texte);font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--titre);color:var(--navy);margin:0;letter-spacing:-.01em;font-weight:700}
p{margin:0}
ul,ol{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--bleu-texte)}
img{max-width:100%}
svg{display:block}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.mono,.cpt{font-family:var(--mono)}

/* ══════════ STRUCTURE ══════════ */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh;align-items:start;background:linear-gradient(90deg,#fff 0 299px,var(--bord) 299px 300px,transparent 300px)}
.principal{min-width:0}
.scene{width:100%;max-width:1120px;margin:0 auto;padding:28px 32px 80px}

/* ══════════ BARRE LATÉRALE ══════════ */
.lateral{position:sticky;top:0;height:100vh;overflow:hidden;background:#fff;border-right:1px solid var(--bord);display:flex;flex-direction:column}
.zone-nav{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 14px 12px}
.zone-nav::-webkit-scrollbar{width:8px}
.zone-nav::-webkit-scrollbar-thumb{background:#e4e9f2;border-radius:99px}
.tete-lat{display:flex;align-items:center;justify-content:space-between;padding:0 8px 18px}
.logo{display:block;height:30px;width:auto}
.fermer.fermer-tiroir{display:none}

.arbre,.arbre ul{list-style:none;margin:0;padding:0}
.arbre>li.n1{border-top:1px solid var(--bord-fin);padding:4px 0}
.arbre>li.n1:last-child{border-bottom:1px solid var(--bord-fin)}
.arbre>li.accueil{padding-bottom:10px}

.rang{display:flex;align-items:center;border-radius:10px;padding-left:var(--ind,0px)}
.rang:hover{background:var(--survol)}
.rang.actif,.rang.actif:hover{background:var(--rose)}
.chev{flex-shrink:0;width:24px;height:38px;border:0;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--texte-clair);padding:0}
.chev svg{width:15px;height:15px;transition:transform .15s}
.chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.chev-vide{flex-shrink:0;width:24px}
.lien{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 10px 8px 0;text-decoration:none;color:var(--navy);border-radius:10px}
.lien .t{flex:1;min-width:0;line-height:1.3}
.n1>.rang .lien .t{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.n1>.rang .lien{min-height:46px}
.n2>.rang .lien .t{font-size:14px;font-weight:600}
.rang-jour{display:flex;align-items:center;width:100%;min-height:38px;border:0;background:none;border-radius:10px;padding:6px 10px 6px var(--ind,0px);text-align:left;color:var(--navy-2);gap:0}
.rang-jour:hover{background:var(--survol)}
.rang-jour .chev-i{flex-shrink:0;width:24px;display:flex;justify-content:center;color:var(--texte-clair)}
.rang-jour .chev-i svg{width:14px;height:14px;transition:transform .15s}
.rang-jour[aria-expanded="true"] .chev-i svg{transform:rotate(90deg)}
.rang-jour .t{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3}

.item{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px 6px calc(var(--ind,0px) + 6px);border-radius:10px;text-decoration:none;color:var(--navy);font-size:13.5px;line-height:1.35}
.item:hover{background:var(--survol)}
.item .t{flex:1;min-width:0}
.item.actif,.item.actif:hover{background:var(--rose);color:var(--navy)}
.item.ferme{color:var(--texte-clair)}
.item.actif.ferme{color:var(--navy)}
.pastille{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--gris-pastille);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--titre)}
.pastille svg{width:13px;height:13px}
.item.fait .pastille{background:var(--vert-bg);color:var(--vert)}
.item.ferme .pastille{background:#f4f6fa;color:#7d8499}
.item.actif .pastille{background:var(--brun);color:#fff}
.item.courant .pastille{background:#fff;box-shadow:inset 0 0 0 1.5px var(--brun);color:var(--brun)}
.item.courant .t{font-weight:600}
.rang-jour.courant .t{color:var(--navy);font-weight:700}
.rang-jour.courant .t::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brun);margin-left:8px;vertical-align:1px}
.item.discret{font-size:13px;color:var(--texte-clair);min-height:34px}
.item.discret .pastille{background:none;color:var(--texte-clair)}
.item.discret.actif .pastille{background:var(--brun);color:#fff}

.meta{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;color:var(--texte-clair);white-space:nowrap}
.meta svg{width:12px;height:12px}
.cpt{font-size:12px;font-weight:400;color:var(--texte-clair);letter-spacing:.02em;white-space:nowrap}

.etiq{flex-shrink:0;display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.01em;padding:3px 8px;border-radius:99px;background:var(--rouge-bg);color:var(--rouge);white-space:nowrap;line-height:1.3}
.heure{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:400;letter-spacing:0;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--gris-pastille);color:var(--navy-2);white-space:nowrap;line-height:1.5}
.heure svg{width:11px;height:11px}

.bas-lat{flex-shrink:0;padding:12px 14px 14px;border-top:1px solid var(--bord-fin);background:#fff;display:flex;flex-direction:column;gap:10px}
.bas-lat .demo{max-height:46vh;overflow-y:auto}
.profil{display:flex;align-items:center;gap:10px;padding:4px 8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;font-family:var(--titre)}
.profil .nom{font-size:14px;font-weight:600;color:var(--navy);line-height:1.25}
.btn-question{display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;border:1px solid #d8e0ed;background:#fff;border-radius:10px;font-size:14px;font-weight:600;color:var(--navy)}
.btn-question:hover{background:#fbfcfe}
.btn-question svg{width:17px;height:17px;color:var(--navy-2)}

.demo{background:#f6f8fc;border:1px dashed #cfd8e6;border-radius:12px;padding:0 11px}
.demo>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--texte-clair);cursor:pointer}
.demo>summary::-webkit-details-marker{display:none}
.demo>summary svg{width:13px;height:13px;transition:transform .15s}
.demo[open]>summary svg{transform:rotate(180deg)}
.demo .corps-demo{padding:0 0 12px;display:flex;flex-direction:column;gap:8px}
.demo-l{font-size:11.5px;font-weight:600;color:var(--texte)}
.demo select{width:100%;border:1px solid var(--bord);border-radius:8px;padding:7px 8px;font-size:12.5px;background:#fff;color:var(--navy)}
.bascule{display:flex;background:#e9edf5;border-radius:99px;padding:3px;gap:2px}
.bascule button{flex:1;border:0;background:none;border-radius:99px;padding:6px;font-size:12px;font-weight:600;color:var(--texte)}
.bascule button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(20,29,70,.12)}
.demo-c{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.4;color:var(--texte);cursor:pointer}
.demo-c input{margin:1px 0 0;width:15px;height:15px;accent-color:var(--blue);flex-shrink:0}

/* Rail (mode agrandi) */
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:100%}
.rail-btn{flex-shrink:0;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--navy);background:none;border:0;text-decoration:none}
.rail-btn:hover{background:var(--survol)}
.rail-btn.actif{background:var(--rose);color:var(--brun)}
.rail-btn svg{width:21px;height:21px}
.rail-sep{flex-shrink:0;width:28px;height:1px;background:var(--bord);margin:6px 0}
.rail-prog{display:flex;flex-direction:column;align-items:center;gap:8px}
.rail-prog .j{font-family:var(--mono);font-size:11px;color:var(--texte-clair)}
.rail-prog .j svg{width:16px;height:16px}
.rail-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.rail-liste a{display:block;border-radius:50%;text-decoration:none}
.rail-liste a:hover .pastille{box-shadow:inset 0 0 0 1.5px #cdd6e4}
.rail-liste .fait .pastille{background:var(--vert-bg);color:var(--vert)}
.rail-liste .ferme .pastille{background:#f4f6fa;color:#7d8499}
.rail-liste .courant .pastille{background:#fff;box-shadow:inset 0 0 0 1.5px var(--brun);color:var(--brun)}
.rail-liste .actif .pastille{background:var(--brun);box-shadow:none;color:#fff}
.rail-bas{margin-top:auto;padding-top:10px}

/* ══════════ ÉLÉMENTS COMMUNS ══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600;border:1px solid #d8e0ed;background:#fff;color:var(--navy);text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{background:#fbfcfe}
.btn svg{width:16px;height:16px}
.btn.plein{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.plein:hover{background:#0d1435}
.btn.rouge{background:var(--rouge);border-color:var(--rouge);color:#fff}
.btn.rouge:hover{background:#a93232}
.btn.ok{background:var(--vert-bg);border-color:#bfe3cf;color:var(--vert)}
.btn.grand{min-height:50px;padding:12px 24px;font-size:15.5px}
.lien-texte{display:inline;background:none;border:0;padding:0;color:var(--bleu-texte);font-weight:600;font-size:inherit;text-decoration:none;text-align:left}
.lien-texte:hover{text-decoration:underline}
.piste{display:block;flex:1 1 auto;min-width:60px;height:8px;border-radius:99px;background:var(--piste);overflow:hidden}
.piste i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .3s}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:16px;padding:32px 36px 36px}
.sur-titre{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bleu-texte);margin-bottom:12px}
.titre-page{font-size:36px;font-weight:800;line-height:1.12;letter-spacing:-.025em}
.tete{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 28px;flex-wrap:wrap;margin-bottom:26px}
.tete .titre-page{flex:1 1 auto;min-width:0}
.tete-prog{display:flex;align-items:center;gap:12px;width:220px;padding-bottom:6px}
.filet{height:1px;background:var(--bord-fin);margin:24px 0 26px}
.statut{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;color:var(--vert);margin-bottom:22px}
.statut svg{width:18px;height:18px}
.verrou-page{display:inline-flex;align-items:center;gap:9px;margin-top:18px;padding:9px 14px;border-radius:10px;background:var(--gris-pastille);color:var(--navy-2);font-family:var(--mono);font-size:13.5px}
.verrou-page svg{width:16px;height:16px}
.titre-section{font-size:20px;margin:36px 0 14px}

/* ══════════ ACCUEIL ══════════ */
.bandeau{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 32px 34px;margin-bottom:18px;min-height:156px}
.drapeau{position:absolute;left:0;top:0;display:flex;width:216px;height:5px}
.drapeau i{flex:1}
.drapeau i:nth-child(1){background:var(--blue)}
.drapeau i:nth-child(2){background:#eceef2}
.drapeau i:nth-child(3){background:#f81f1f}
.bandeau .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--bleu-texte);margin-bottom:14px;position:relative}
.bandeau h1{font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.02em;color:var(--ink);position:relative;max-width:640px}
.bandeau h1 em{font-style:normal;color:var(--blue)}
.bandeau .deco{position:absolute;right:-14px;bottom:-6px;width:290px;pointer-events:none}
.bandeau .deco svg{width:100%;height:auto}

.a-faire{display:flex;align-items:center;justify-content:space-between;gap:18px 28px;flex-wrap:wrap;border-radius:16px;padding:26px 28px;background:linear-gradient(100deg,var(--rose-1),var(--rose-2));border:1px solid #f1e3df;margin-bottom:18px}
.af-txt{flex:1 1 360px;min-width:0}
.af-sur{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brun);margin-bottom:8px}
.a-faire h2{font-size:24px;line-height:1.2;letter-spacing:-.015em}
.af-ligne{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-top:10px;font-size:15px;color:var(--navy-2)}
.af-ligne .piste{max-width:260px;background:#efe4e0}


.parcours-grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.parcours-grille.deux{grid-template-columns:repeat(2,minmax(0,1fr))}
.carte-parcours{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:12px;align-items:center;background:#fff;border:1px solid var(--bord);border-radius:14px;padding:18px 18px 16px;text-decoration:none;color:var(--texte);transition:border-color .14s,box-shadow .14s}
.carte-parcours:hover{border-color:#d3ddec;box-shadow:0 8px 22px -16px rgba(20,29,70,.35)}
.cp-tete{display:flex;align-items:center;gap:10px;align-self:start}
.cp-ic{width:32px;height:32px;border-radius:50%;background:var(--rose-pale);color:var(--brun);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cp-ic svg{width:17px;height:17px}
.cp-t{font-family:var(--titre);font-weight:700;font-size:15.5px;color:var(--navy);line-height:1.25}
.cp-prog{display:flex;align-items:center;gap:10px}
.cp-suite{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--texte);min-width:0}
.cp-suite .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-suite.ok{color:var(--vert);font-weight:600}
.cp-suite svg{width:14px;height:14px;flex-shrink:0}

.infos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.case{background:#fff;border:1px solid var(--bord);border-radius:14px;padding:18px 18px 18px}
.case .lab{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--texte-clair);margin-bottom:8px}
.case .val{font-size:15.5px;font-weight:600;color:var(--navy);line-height:1.35}
.case .sec{font-size:14px;color:var(--texte);line-height:1.5;margin-top:2px}
.case .act{margin-top:10px;font-size:14px}
.case .envoye{display:inline-flex;align-items:center;gap:6px;color:var(--vert);font-weight:600}
.case .envoye svg{width:15px;height:15px}
.personne{display:flex;align-items:center;gap:10px}
.personne .avatar{background:var(--rose);color:var(--brun)}

/* ══════════ FRISE (DELIV'IA 1) ══════════ */
.frise{list-style:none;margin:0;padding:0 0 0 32px;position:relative}
.frise::before{content:"";position:absolute;left:10px;top:16px;bottom:16px;width:1px;background:var(--bord)}
.noeud{position:relative;padding:5px 0}
.point{position:absolute;left:-32px;top:12px;width:21px;height:21px;border-radius:50%;background:#fff;border:1.5px solid #cdd6e4;display:flex;align-items:center;justify-content:center;z-index:1;font:700 10.5px/1 var(--titre);color:var(--navy)}
.point svg{width:11px;height:11px}
.noeud.fait .point{background:var(--vert-bg);border-color:var(--vert-bg);color:var(--vert)}
.noeud.ferme .point{background:var(--gris-pastille);border-color:#e1e7f0;color:#7d8499}
.noeud.courant .point{background:var(--brun);border-color:var(--brun);color:#fff;top:22px}
.noeud.courant .point:empty::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.ligne{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;min-height:36px;padding:4px 0}
.ligne .t{flex:1 1 180px;min-width:0;font-size:15.5px;color:var(--navy);text-decoration:none;line-height:1.4}
.ligne .t:hover{text-decoration:underline}
.noeud.fait .ligne .t{color:var(--texte)}
.noeud.ferme .ligne .t{color:var(--texte-clair)}
.carte-courante{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 18px;background:linear-gradient(100deg,var(--rose-1),var(--rose-2));border:1px solid #f1e3df;border-radius:12px;padding:14px 16px 14px 18px;margin:4px 0}
.cc-t{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;min-width:0;flex:1 1 240px}
.cc-titre{font-family:var(--titre);font-weight:700;font-size:16.5px;color:var(--navy);text-decoration:none;line-height:1.3}
.cc-titre:hover{text-decoration:underline}
.groupe-frise+.groupe-frise{margin-top:30px}
.titre-groupe{display:flex;align-items:center;gap:12px;font-size:17px;margin-bottom:10px}
.titre-groupe .t{flex:1}
.discrete{display:flex;align-items:center;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--bord-fin);font-size:14.5px;color:var(--texte)}
.discrete svg{width:17px;height:17px;color:var(--texte-clair)}

/* ══════════ LISTES DE SERVICE ══════════ */
.rangees{border-top:1px solid var(--bord-fin)}
.rangee{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:15px 2px;border-bottom:1px solid var(--bord-fin)}
.rangee .ic{width:20px;height:20px;color:var(--texte-clair);flex-shrink:0}
.rangee .ic svg{width:20px;height:20px}

dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);box-shadow:0 30px 70px -20px rgba(20,29,70,.45);color:var(--texte)}

/* ============================================================

const D = {"jours":[{"id":"j1","ateliers":[{"n":1,"titre":"Personnaliser l’IA","bonus":false,"demi":"matin","blocs":[{"type":"etape","titre":"Prompt pour ChatGPT","texte":"","prompt":"Pose-moi des questions sur mon métier, ma façon de travailler et mes attentes, puis génère 2 prompts courts : un pour les instructions personnalisées et un pour la partie “Plus d’informations sur vous”"},{"type":"variante","compact":true,"ouvert":false,"outils":["claude","gemini","copilot","mistral"],"titre":"Prompt pour les autres IA","texte":"","prompts":["Pose-moi des questions sur mon métier, ma façon de travailler et mes attentes, puis génère-moi un prompt de personnalisation"]},{"type":"titre","texte":"Prompt d’exemple pour ChatGPT"},{"type":"etape","titre":"Instructions personnalisées","texte":"","prompt":"Réponds-moi en français, avec un ton humain, clair et direct. Utilise une syntaxe et une grammaire françaises rigoureuses, sans calque de l’anglais.\n\nN’utilise pas de tiret long pour structurer une phrase : préfère la virgule, le point, les deux-points, ou découpe en deux phrases.\n\nAgis comme mon bras droit : conseiller marketing, rédacteur, assistant opérationnel et contradicteur bienveillant.\n\nNe te contente pas d’exécuter : challenge mes idées, pointe les faiblesses, pose des questions ciblées quand le contexte manque, puis propose une version plus solide.\n\nAdapte le niveau de détail à ma demande. Évite les banalités, le ton corporate, le jargon et les phrases creuses.\n\nSi une information te manque ou si tu n’es pas certain, dis-le clairement. N’invente ni fait ni source."},{"type":"etape","titre":"Plus d’informations sur vous","texte":"","prompt":"Je suis responsable marketing dans une PME de 40 personnes qui fabrique du mobilier de bureau. J’encadre une équipe de trois personnes.\n\nMon temps se répartit ainsi : 40 % de contenus (site, réseaux sociaux, newsletters), 30 % de pilotage des campagnes, 30 % de réunions et de reporting.\n\nMes livrables principaux sont les plans de campagne, les comptes rendus, les posts LinkedIn et les tableaux de suivi. Ce qui me prend le plus de temps : la rédaction et la mise en forme du reporting mensuel.\n\nJ’utilise surtout ChatGPT, Excel et Canva. Mon objectif est de gagner du temps sur la production pour en consacrer davantage à la stratégie."},{"type":"variante","compact":true,"ouvert":false,"outils":["claude","copilot"],"titre":"Prompt de personnalisation pour Claude ou Copilot","texte":"","prompts":["Réponds en français, avec une syntaxe et une grammaire françaises rigoureuses, sans calque de l’anglais. N’utilise pas de tiret long pour structurer une phrase.\n\nTu es mon bras droit professionnel : conseiller marketing, rédacteur et assistant opérationnel. Je suis responsable marketing dans une PME qui fabrique du mobilier de bureau.\n\nNe te contente jamais d’exécuter sans réfléchir. Quand tu vois une faiblesse dans mon idée, dis-le franchement, argumente, puis propose une version plus solide. Si le contexte manque, pose une question ciblée avant de te lancer.\n\nBannis : banalités, ton corporate, anglicismes évitables, jargon inutile, phrases creuses.\n\nQuand tu écris à ma place, imite ma voix : directe, simple, humaine, crédible."]}]},{"n":2,"titre":"ChatGPT Challenge","bonus":false,"demi":"matin","blocs":[{"type":"callout","ic":"📝","titre":"Objectif de cet atelier","texte":"Découvrir plusieurs cas d’usage rapides pour comprendre le champ des possibles : document, image, web, Excel, email, vidéo, notes manuscrites, briefing client, etc."},{"type":"etape","titre":"Extraire des informations d’un document et les convertir en Excel","texte":"Vous disposez d’une liste de participants au format PDF. L’objectif est d’extraire automatiquement les coordonnées (noms, prénoms, numéros, emails) et de les structurer dans un fichier Excel exploitable. Ce fichier exemple est bien sûr un fichier avec des données fictives."},{"type":"fichier","nom":"Contacts participants.pdf","taille":"4,3 Ko","url":""},{"type":"paragraphe","texte":"<b>Étape 1 :</b> téléchargez le fichier ci-dessus."},{"type":"paragraphe","texte":"<b>Étape 2 :</b> saisissez cette requête dans ChatGPT."},{"type":"prompt","texte":"À partir de ce fichier, extrais les noms, prénoms, métier, numéros et adresses e-mail des participants, puis liste-les dans un fichier Excel. Assure-toi de conserver strictement les informations telles qu’elles apparaissent dans le document d’origine et de prendre en compte la présence de deux colonnes dans le PDF"},{"type":"paragraphe","texte":"<b>Étape 3 :</b> une fois le fichier Excel obtenu, enchaînez avec des demandes courtes pour l’enrichir progressivement, directement dans la même conversation."},{"type":"prompt","texte":"Ajoute une colonne avec le pays correspondant à l’indicatif de chaque numéro de téléphone. Assure-toi d’abord de faire une recherche pour être sûr d’avoir une matrice de correspondance entre l’indicatif et le pays"},{"type":"prompt","texte":"Ajoute une colonne avec le lien LinkedIn de chaque personne si tu le trouves. Assure-toi que les liens soient corrects. Si tu n’es pas sûr de ta réponse ou qu’il y a plusieurs personnes avec ce nom et prénom, dis-le-moi"},{"type":"prompt","texte":"Ajoute une colonne avec le site web officiel de chaque entreprise."},{"type":"etape","titre":"Extraire des informations d’un site web","texte":"À partir d’une page web, extraire automatiquement les données structurées pour identifier des éléments qui pourraient nous être utiles lors d’un entretien avec le dirigeant. Saisissez cette requête dans ChatGPT.","prompt":"Analyse ce site https://www.franceia.com/\nDonne-moi en 5 points : à quoi sert cette entreprise, son positionnement, ses clients cibles, ses 3 produits ou services phares, et un angle pour engager la conversation lors d’un entretien avec le dirigeant"},{"type":"etape","titre":"Faire une recherche d’informations","texte":"Utiliser ChatGPT pour effectuer une veille ou une recherche rapide sur un sujet précis, en obtenant une synthèse structurée et fiable plutôt qu’une liste de liens."},{"type":"paragraphe","texte":"<b>Étape 1 :</b> identifiez clairement votre besoin : sujet, angle, niveau de détail souhaité et usage final (présentation, prise de décision, rédaction, etc.). Par exemple une recherche sur l’actualité IA des 2 dernières semaines pour vous permettre de rester à jour dans votre domaine d’activité."},{"type":"paragraphe","texte":"<b>Étape 2 :</b> activez la fonctionnalité de « recherche sur le web » dans ChatGPT et lancez votre requête."},{"type":"etape","titre":"Extraire des informations depuis une image","texte":"Utiliser ChatGPT pour lire et extraire automatiquement des données présentes dans une image ou capture d’écran, sans ressaisie manuelle."},{"type":"paragraphe","texte":"<b>Étape 1 :</b> faites une capture d’écran contenant des données structurées (tableau, facture, fiche produit, email, etc.) et importez-la dans ChatGPT. Ou bien utilisez l’image fournie en séance."},{"type":"paragraphe","texte":"<b>Étape 2 :</b> créez une requête qui vous permette d’atteindre cet objectif."},{"type":"etape","titre":"Résoudre un problème informatique depuis une capture d’écran","texte":"Utiliser ChatGPT comme support technique visuel : lui montrer une capture d’écran d’une erreur (Word, Excel, navigateur, etc.) pour obtenir un diagnostic clair et une marche à suivre, sans avoir à décrire le problème par écrit."},{"type":"paragraphe","texte":"<b>Étape 1 :</b> faites une capture d’écran d’un message d’erreur ou d’un dysfonctionnement rencontré sur votre poste, et importez-la dans ChatGPT."},{"type":"paragraphe","texte":"<b>Étape 2 :</b> créez une requête qui vous permette d’atteindre cet objectif."},{"type":"prompt","texte":"Voici une capture d’écran de mon problème. Explique-moi en français simple ce qui ne va pas, donne-moi la marche à suivre étape par étape pour corriger, et précise comment éviter que ça se reproduise"},{"type":"etape","titre":"Corriger ou traduire un document entier","texte":"Corriger les fautes, améliorer le style ou traduire un document complet tout en respectant le ton et la mise en forme d’origine."},{"type":"paragraphe","texte":"<b>Étape 1 :</b> téléchargez votre document (Word, PDF ou texte brut) et importez-le dans ChatGPT. Voici un document avec des fautes, au besoin :"},{"type":"fichier","nom":"Analyse entreprise catelo à corriger.pdf","taille":"51,4 Ko","url":""},{"type":"paragraphe","texte":"<b>Étape 2 :</b> créez une requête qui vous permette de corriger le document puis, si vous le souhaitez, de le traduire."},{"type":"etape","titre":"Préparer une réunion client avant un premier rendez-vous","texte":"Demander à ChatGPT, avec de la réflexion approfondie et une recherche sur le web, de générer une fiche d’analyse complète sur un nouveau client avant un premier rendez-vous. Cette requête peut sembler impressionnante car elle est longue et très structurée. Pas d’inquiétude : à l’étape 10, vous verrez comment faire rédiger ce type de prompt par l’IA elle-même. C’est ce que l’on appelle du Meta Prompting."},{"type":"paragraphe","texte":"<b>Étape 1 :</b> identifiez le nom de l’entreprise cliente et sa ville et, si possible, son site web ou sa page LinkedIn (ou tout autre document disponible comme une plaquette)."},{"type":"paragraphe","texte":"<b>Étape 2 :</b> ouvrez une nouvelle conversation et choisissez le niveau de réflexion Élevé dans le sélecteur de modèle. La structure Markdown (titres avec #, listes à puces, sections numérotées) permet à ChatGPT de mieux comprendre l’organisation attendue de la réponse."},{"type":"prompt","texte":"# Rôle\nTu es un assistant d’analyse préalable à rendez-vous avec un nouveau client.\n\n# Objectif\nCollecter, analyser et structurer toutes les informations disponibles en ligne afin de comprendre le contexte global d’un client avant un premier rendez-vous.\n\n# Entrée\n- Nom de l’entreprise ou du client : [nom de l’entreprise]\n- Localisation : [ville, pays]\n- Ce que je propose à ce client : [votre offre en une phrase]\n\n# Tâche\nRechercher sur le web, analyser et synthétiser uniquement des informations accessibles publiquement.\n\n# Format de sortie et données à collecter (si disponibles)\n1. **Informations générales** : raison sociale, forme juridique, date de création, siège social, effectif estimé\n2. **Activité et positionnement** : secteur d’activité, offre principale, typologie de clients, zone géographique couverte\n3. **Situation économique visible** : taille estimée, signaux de croissance ou de difficulté, informations financières publiques\n4. **Dirigeants et gouvernance** : dirigeants identifiés, parcours professionnel, présence médiatique ou publique\n5. **Présence en ligne** : site web officiel, réseaux sociaux actifs, fréquence de publication, messages et positionnement clés\n6. **Actualités récentes** : annonces stratégiques, recrutements, levées de fonds, partenariats, difficultés ou événements notables\n7. **Enjeux observables** : signaux de structuration ou de transformation, besoins possibles en lien avec ce que je propose\n\n# Sources\n- Indiquer systématiquement les **sources utilisées** pour chaque information.\n- Mentionner explicitement lorsque l’information n’est pas trouvable en ligne.\n- Se limiter strictement aux données accessibles publiquement.\n- Ne pas formuler d’hypothèses non étayées par une source."},{"type":"citation","texte":"Point d’attention : ouvrez deux ou trois des sources citées pour vérifier qu’elles disent bien ce que la fiche leur attribue, surtout pour les chiffres et les noms de dirigeants."},{"type":"etape","titre":"Trouver des formules Excel","texte":"Utiliser ChatGPT comme assistant Excel pour générer des formules sur mesure, du conditionnel simple aux calculs croisés complexes, sans avoir à mémoriser la syntaxe exacte des fonctions. Saisissez l’une des requêtes suivantes dans ChatGPT, selon votre besoin."},{"type":"paragraphe","texte":"<b>Exemple 1 : Formule conditionnelle simple.</b> Objectif : afficher un statut selon une valeur numérique."},{"type":"prompt","texte":"Crée une formule Excel qui affiche 'Payé' si le montant en C2 est supérieur à 0, sinon 'Impayé'"},{"type":"paragraphe","texte":"<b>Exemple 2 : Calcul d’une remise selon plusieurs paliers.</b> Objectif : appliquer un taux de remise différent selon le montant de la commande."},{"type":"prompt","texte":"Crée une formule Excel qui applique une remise sur le montant en B2 :\n- 0% si le montant est inférieur à 100€\n- 5% entre 100€ et 500€\n- 10% entre 500€ et 1000€\n- 15% au-delà de 1000€\nLe résultat doit afficher le montant final après remise."},{"type":"paragraphe","texte":"<b>Exemple 3 : Recherche d’une valeur dans un autre tableau.</b> Objectif : retrouver automatiquement le prix d’un produit à partir de sa référence."},{"type":"prompt","texte":"J’ai deux feuilles dans mon classeur Excel :\n- \"Commandes\" avec en colonne A la référence produit\n- \"Catalogue\" avec en colonne A la référence et en colonne B le prix unitaire\n\nCrée une formule à mettre dans la cellule B2 de la feuille \"Commandes\" qui va chercher automatiquement le prix correspondant à la référence saisie en A2. Si la référence n’existe pas, affiche \"Référence inconnue\"."},{"type":"paragraphe","texte":"<b>Exemple 4 : Extraire une information d’une chaîne de texte.</b> Objectif : isoler le nom de domaine à partir d’une adresse email."},{"type":"prompt","texte":"Crée une formule Excel qui extrait le nom de domaine d’une adresse email située en cellule A2. Par exemple, pour \"contact@franceia.fr\", la formule doit renvoyer \"franceia.fr\"."},{"type":"paragraphe","texte":"<b>Exemple 5 : Compter selon plusieurs critères.</b> Objectif : compter le nombre de lignes répondant à plusieurs conditions simultanées."},{"type":"prompt","texte":"J’ai un tableau de ventes avec :\n- Colonne A : date de la vente\n- Colonne B : nom du commercial\n- Colonne C : montant\n\nCrée une formule Excel qui compte le nombre de ventes réalisées par \"Marie\" en novembre 2025 pour un montant supérieur à 500€."},{"type":"paragraphe","texte":"<b>Exemple 6 : Calcul de l’ancienneté en années et mois.</b> Objectif : afficher l’ancienneté d’un salarié dans un format lisible."},{"type":"prompt","texte":"La date d’embauche d’un salarié se trouve en cellule B2. Crée une formule Excel qui calcule son ancienneté à la date d’aujourd’hui et l’affiche sous la forme \"X ans et Y mois\"."},{"type":"etape","titre":"Créer un modèle Excel sur mesure","texte":"Utiliser ChatGPT pour générer un fichier Excel structuré et personnalisé (suivi de prospection, planning, budget, etc.) sans le construire manuellement. Ce scénario illustre la puissance du meta-prompting : plutôt que de rédiger directement une requête détaillée, on demande d’abord à ChatGPT de nous aider à concevoir la bonne requête, puis on l’utilise pour obtenir le résultat final."},{"type":"paragraphe","texte":"<b>Étape 1 :</b> ouvrez une conversation avec ChatGPT et expliquez-lui votre besoin de manière simple, sans chercher à être exhaustif."},{"type":"prompt","texte":"Je cherche à créer un fichier Excel pour suivre ma prospection commerciale. Aide-moi à concevoir une requête détaillée que je pourrai ensuite te renvoyer pour que tu génères le fichier. Pose-moi les bonnes questions si besoin pour clarifier mon besoin pour générer cet Excel"},{"type":"paragraphe","texte":"<b>Étape 2 :</b> répondez aux questions de ChatGPT (type de prospects suivis, indicateurs souhaités, niveau de détail attendu, etc.). À l’issue de cet échange, demandez-lui de formaliser une requête complète et structurée."},{"type":"paragraphe","texte":"<b>Étape 3 :</b> ouvrez une nouvelle conversation et collez la requête optimisée obtenue. Voici un exemple de résultat final pour un suivi de prospection commerciale :"},{"type":"prompt","texte":"Crée-moi un fichier Excel de suivi de prospection commerciale avec les spécifications suivantes :\n\nStructure :\n- Une feuille \"Pipeline\" avec le tableau de suivi principal\n- Une feuille \"Tableau de bord\" avec des indicateurs clés\n\nFeuille \"Pipeline\" :\n- Colonnes : Entreprise, Contact, Poste, Email, Téléphone, Source,\n  Date premier contact, Statut, Prochaine action, Date relance,\n  Montant estimé, Probabilité (%), Observations\n- Liste déroulante pour Statut : \"À contacter\", \"En cours\",\n  \"Proposition envoyée\", \"Gagné\", \"Perdu\"\n- Liste déroulante pour Source : \"LinkedIn\", \"Recommandation\",\n  \"Site web\", \"Événement\", \"Autre\"\n- Colonne \"Montant pondéré\" calculée automatiquement\n  (Montant estimé × Probabilité)\n- Mise en forme conditionnelle :\n  - Rouge si date de relance dépassée\n  - Orange si relance dans les 3 jours\n  - Vert pour les prospects \"Gagné\"\n- Alternance de couleurs sur les lignes\n- Filtres automatiques et volets figés sur les en-têtes\n\nFeuille \"Tableau de bord\" :\n- Nombre total de prospects par statut\n- Montant total du pipeline (pondéré et brut)\n- Taux de conversion (Gagné / total)\n- Nombre de relances à faire cette semaine\n\nMise en forme :\n- En-têtes avec fond bleu marine et texte blanc\n- Montants en euros avec séparateurs de milliers\n- Dates au format JJ/MM/AAAA\n- 10 lignes pré-remplies avec des données fictives réalistes"},{"type":"paragraphe","texte":"<b>Étape 4 :</b> téléchargez le fichier Excel généré par ChatGPT, ouvrez-le pour vérifier que tout correspond à vos attentes, et ajustez si besoin en demandant des modifications ciblées (ajout d’une colonne, modification d’une formule, etc.)."},{"type":"etape","titre":"Optimiser un prompt avec le meta-prompting","texte":"Apprendre à transformer une requête initiale trop vague en un prompt structuré et précis, en demandant à ChatGPT lui-même de l’optimiser. Cette technique, appelée meta-prompting, permet d’obtenir des résultats nettement plus pertinents sans avoir à maîtriser les techniques avancées de prompting."},{"type":"paragraphe","texte":"<b>Étape 1 :</b> choisissez un sujet professionnel ou personnel qui vous concerne réellement, et formulez votre demande comme vous l’auriez fait spontanément. Quelques idées de requêtes pour vous inspirer :"},{"type":"numerotee","items":["Je cherche à rédiger un email de relance à un client qui ne me répond plus depuis trois semaines.","Je cherche une trame d’entretien pour préparer mon entretien annuel d’évaluation avec mon manager.","J’aimerais rédiger une fiche de poste pour recruter un alternant en marketing dans mon équipe.","Je dois préparer une présentation de 15 minutes pour mon comité de direction sur l’avancement de mon projet.","Je voudrais écrire un post LinkedIn qui paraisse naturel pour annoncer le lancement de ma nouvelle offre de formation."]},{"type":"paragraphe","texte":"<b>Étape 2 :</b> dans ChatGPT, utilisez la requête suivante en remplaçant la partie entre crochets par votre demande initiale."},{"type":"prompt","texte":"Voici ma requête : \"[INSÉRER ICI VOTRE REQUÊTE SIMPLE]\"\n\nOptimise-la en un prompt clair et structuré. Pose-moi d’abord les questions nécessaires pour bien clarifier mon besoin."},{"type":"paragraphe","texte":"<b>Étape 3 :</b> répondez aux questions de ChatGPT pour préciser votre besoin, puis récupérez le prompt optimisé généré. Ouvrez une nouvelle conversation et collez ce prompt pour obtenir un résultat nettement plus pertinent qu’avec votre requête de départ."},{"type":"etape","titre":"Faire une recherche booléenne Google pour trouver un résultat spécifique","texte":"Une recherche booléenne consiste à combiner des mots-clés avec des opérateurs comme AND, OR et NOT pour obtenir des résultats plus ciblés et précis sur Google."},{"type":"paragraphe","texte":"<b>Appels d’offres et marchés publics</b>"},{"type":"prompt","texte":"Génère une recherche booléenne Google pour trouver des appels d’offres publics en cours pour des missions de conseil ou de formation professionnelle, publiés sur BOAMP ou des plateformes de marchés publics françaises."},{"type":"paragraphe","texte":"<b>Veille concurrentielle</b>"},{"type":"prompt","texte":"Génère une recherche booléenne Google pour trouver les références clients ou projets publiés en ligne par des cabinets de conseil ou organismes de formation concurrents en France."},{"type":"paragraphe","texte":"<b>Recherche de partenaires</b>"},{"type":"prompt","texte":"Génère une recherche booléenne Google pour identifier des consultants ou experts indépendants spécialisés en transformation digitale ou intelligence artificielle, référencés sur des projets en France."},{"type":"paragraphe","texte":"<b>Veille réglementaire</b>"},{"type":"prompt","texte":"Génère une recherche booléenne Google pour trouver des rapports ou guides officiels publiés par des organismes publics français sur l’usage de l’intelligence artificielle en entreprise, publiés après 2023."},{"type":"paragraphe","texte":"<b>Études de cas</b>"},{"type":"prompt","texte":"Génère une recherche booléenne Google pour identifier des études de cas ou retours d’expérience sur le déploiement de l’IA générative en entreprise, publiés par des cabinets ou organismes professionnels français."}]},{"n":3,"titre":"Rédiger et améliorer un document avec ChatGPT","bonus":false,"demi":"matin","blocs":[{"type":"callout","ic":"🔹","titre":"Objectif de cet atelier","texte":"Quand vous demandez un document, ChatGPT peut l’afficher dans un bloc de rédaction : une zone modifiable où vous corrigez le texte vous-même, sélectionnez un passage pour le faire retravailler, ouvrez le document en plein écran et le retrouvez ensuite dans la Bibliothèque. Vous ne repartez plus de zéro à chaque modification. C’est idéal pour produire des documents longs et structurés."},{"type":"etape","titre":"Créer une première version","texte":"Étape 1 : demandez une première version de votre document.","prompt":"Aide-moi à rédiger [type de document] sur [sujet]. Il s’adresse à [public] et doit servir à [objectif concret]. Style [ton souhaité], clair et structuré. Propose une première version complète et présente-la comme un document modifiable."}]},{"n":4,"titre":"La lecture de document","bonus":false,"demi":"aprem","blocs":[{"type":"etape","titre":"Résumer un document","texte":"Importez n’importe quel document depuis votre poste de travail et demandez à ChatGPT d’en produire une synthèse, un résumé ou un executive summary en quelques secondes."}]},{"n":5,"titre":"Créer un espace de travail intelligent avec Gemini Notebook","bonus":false,"demi":"aprem","blocs":[{"type":"callout","ic":"🔹","titre":"Objectif de cet atelier","texte":"Gemini Notebook est un outil de Google qui permet de centraliser des sources sur un sujet précis et d’interagir avec ces informations via une IA. Choisissez l’un des cas d’usages suivants et créez votre propre Notebook pour explorer ses possibilités."},{"type":"etape","titre":"Définir le bon Notebook sur ChatGPT","texte":"Prompt pour vous inspirer.","prompt":"Aide-moi à créer un Notebook utile pour mon activité. Je suis [métier / fonction] et je veux centraliser des connaissances sur [sujet]. Propose-moi le meilleur périmètre pour ce Notebook, les types de documents à y ajouter, les questions que je pourrai lui poser et les livrables que je pourrai générer régulièrement."}]},{"n":6,"titre":"Recherche et Veille avec la Planification","bonus":false,"demi":"aprem","blocs":[{"type":"callout","ic":"🎯","titre":"Objectif","texte":"Comparer recherche ponctuelle et veille structurée, puis configurer une tâche ChatGPT de veille récurrente."},{"type":"etape","titre":"Recherche ponctuelle avec ChatGPT","texte":"","prompt":"Fais une recherche à jour sur [sujet]. Croise plusieurs sources fiables, distingue les faits établis des tendances émergentes, cite les sources importantes et termine par une synthèse opérationnelle pour [mon métier / mon entreprise / mon projet]."}]},{"n":7,"titre":"Recherche approfondie avec ChatGPT","bonus":false,"demi":"aprem","blocs":[{"type":"callout","ic":"🔹","titre":"Objectif de cet atelier","texte":"La fonctionnalité Deep Research de ChatGPT permet de lancer des recherches approfondies sur un sujet précis. Elle n’est disponible que sur la version web de ChatGPT. Contrairement à une recherche classique, elle consulte de nombreuses sources, croise les informations et produit un rapport structuré et détaillé en quelques minutes. Choisissez le profil qui correspond à votre activité et testez les requêtes proposées."},{"type":"etape","titre":"Pour une étude de cas","texte":"","prompt":"Génère une étude de cas complète sur [marché] en [date] dans [pays / région / etc.]. Je veux connaître les acteurs, les éléments et chiffres clés à retenir, les tendances à venir, les opportunités, les risques. Affiche les sources à la fin"}]},{"n":8,"titre":"Excel & Analyse de données avec ChatGPT ou Claude","bonus":false,"demi":"aprem","blocs":[{"type":"callout","ic":"🎯","titre":"Objectif","texte":"Uploader un fichier Excel ou CSV, identifier tendances, incohérences, opportunités, puis générer graphiques et dashboards."},{"type":"etape","titre":"Analyse exploratoire","texte":"","prompt":"Agis comme un data analyst. Analyse ce fichier Excel ou CSV, identifie les tendances, anomalies, incohérences, segments intéressants, corrélations possibles et opportunités d’amélioration. Explique-moi les enseignements dans un langage simple, puis propose les visualisations les plus pertinentes."}]}]},{"id":"j2","ateliers":[{"n":1,"titre":"Générations d’images","bonus":false,"demi":"matin","blocs":[{"type":"callout","ic":"📷","titre":"Objectif de cet atelier","texte":"ChatGPT peut générer une grande variété d’images à partir d’une simple description : des photos réalistes, des illustrations dans différents styles, des infographies claires, des schémas ou cartes mentales, ainsi que des concepts produits ou des visualisations d’espaces et d’architectures. Il peut également modifier une image existante pour l’améliorer, l’adapter ou la transformer selon vos besoins."},{"type":"paragraphe","texte":"Créer des visuels professionnels, retoucher une image, faire du reverse prompting, puis participer à la compétition de la meilleure image IA."},{"type":"etape","titre":"Cas 1 : Retouche photo professionnelle","texte":"","prompt":"Voici une photo de moi. Génère une version photo professionnelle pour mon CV : fond uni gris clair, lumière douce de studio, cadrage portrait américain, tenue business sobre, regard vers l’objectif, expression confiante mais accessible. Garde mes traits, ma coiffure et ma morphologie à l’identique."},{"type":"etape","titre":"Cas 2 : Un portrait style Studio Harcourt","texte":"","prompt":"À partir de cette photo de moi, génère un portrait noir et blanc style Studio Harcourt : éclairage clair-obscur très contrasté façon cinéma classique, fond noir profond, lumière directionnelle qui sculpte le visage, regard légèrement de côté, expression intemporelle. Conserve mes traits exacts. Cadrage portrait serré, ambiance grain argentique."},{"type":"etape","titre":"Cas 3 : Imaginer des travaux chez soi","texte":"","prompt":"Voici une photo de mon salon. Imagine les transformations suivantes en gardant le même cadrage et les mêmes proportions : remplace le sol carrelé par un parquet chêne clair, repeins les murs en blanc cassé, ajoute une grande bibliothèque sur le mur de gauche, et mets un canapé d’angle en lin beige. Garde la luminosité naturelle réaliste."},{"type":"etape","titre":"Cas 4 : Transformer un rapport en infographie","texte":"","prompt":"À partir des résultats de la recherche approfondie ci-joint (chiffres clés, tendances, comparatifs), génère une infographie verticale : titre principal en haut, 4 KPI géants au centre avec icônes, un graphique d’évolution, et 3 takeaways en bas. Style moderne, palette bleue et blanche, typographie épurée, format LinkedIn (1080×1350 px)."},{"type":"etape","titre":"Cas 5 : Transformer une idée en schéma visuel","texte":"","prompt":"Transforme cette explication en mind map visuelle : le concept central au milieu (« [votre sujet] »), 5 branches principales qui rayonnent, et 2-3 sous-branches par axe. Style infographique moderne, icônes simples sur chaque nœud, palette bleue et blanche, typographie lisible. Format paysage."},{"type":"etape","titre":"Cas 6 : Mettre un produit en valeur","texte":"","prompt":"Modifie l’image du mannequin en lui faisant porter la veste bleu. Je veux pouvoir mettre la photo sur Vinted pour vendre ma veste, donc mets à bien en valeur sur l’image"},{"type":"etape","titre":"Cas 7 : Remplir des documents PDF","texte":"","prompt":"Complète ce document en remplaçant les éléments suivants : [...] avec une écriture manuscrite, avec un stylo à encre bleu. Génère une image de ce document avec les modifications"},{"type":"etape","titre":"Cas 8 : Soyez créatif","texte":"","prompt":"Génère une photo de moi avec un astronaute sur la Lune, façon photo souvenir. Génère un selfie de nous deux, puis change l’angle de la photo."},{"type":"etape","titre":"Bonus : Reverse Prompting","texte":"","prompt":"Quel prompt a été utilisé pour générer cette image ?"},{"type":"titre","texte":"Autres inspirations"},{"type":"paragraphe","texte":"<b>Menu de café</b> : Créer un menu professionnel pour un établissement avec une identité visuelle soignée."},{"type":"prompt","texte":"Crée un menu pour un café indépendant situé à Paris, près de Bonne Nouvelle. Format A4 portrait. Le menu présente une sélection de cafés : espresso, ristretto, americano, cappuccino, latte, flat white, café filtre du jour, cold brew, mocha. Pour chaque boisson, un nom, une courte description et un prix en euros. Style sobre et épuré, ambiance parisienne contemporaine. Typographie élégante mêlant un serif fin pour les titres et un sans-serif pour les descriptions. Palette restreinte : ivoire, noir profond, accent terracotta discret. Une fine illustration au trait d’une tasse ou d’un grain de café en haut de page. Hiérarchie claire, beaucoup d’espace blanc, aucun élément superflu. Rendu professionnel prêt à imprimer."},{"type":"paragraphe","texte":"<b>Schéma fonctionnel d’un processus</b> : Créer un schéma visuel explicatif d’un processus en flat design minimaliste."},{"type":"prompt","texte":"Crée un schéma visuel expliquant les 5 étapes d’un processus de validation budgétaire : collecte des données, analyse des écarts, rédaction du rapport, présentation en comité, décision finale. Style flat design minimaliste : formes géométriques simples, palette limitée à 3 couleurs (blanc, gris, bleu désaturé), typographie sans-serif fine, beaucoup d’espace vide, aucun dégradé ni ombre portée."},{"type":"paragraphe","texte":"<b>Création de logo professionnel</b> : Générer un logo stylisé pour votre entreprise ou projet."},{"type":"prompt","texte":"Crée un logo pour une agence de conseil en transformation digitale nommée \"Nexus Strategy\". Style minimaliste et géométrique. Palette couleur limitée à 3 couleurs : bleu profond, blanc et gris clair. Formes simples et épurées, évolutif à tous les formats, adapté pour site web et papeterie. Pas de texte ou texte minimal. Logo mémorable et professionnel."},{"type":"paragraphe","texte":"<b>Cartographie visuelle</b> : Générer une cartographie organisée d’usages, de concepts ou d’acteurs autour d’un thème central."},{"type":"prompt","texte":"Crée une cartographie visuelle des usages de l’IA générative dans une entreprise. Format paysage. Au centre, une icône représentant l’IA. Autour, 6 catégories principales (Marketing, RH, Finance, Juridique, Opérations, IT) sous forme de bulles colorées, chacune entourée de 3 ou 4 cas d’usage spécifiques reliés par des lignes fines. Style flat design moderne et organisé. Palette : bleu nuit, turquoise, blanc et gris clair. Typographie sans-serif lisible. Hiérarchie visuelle claire, espace respiré, aucun effet 3D."},{"type":"paragraphe","texte":"<b>Infographie de chiffres clés</b> : Présenter des données structurées et chiffrées sous forme visuelle hiérarchisée."},{"type":"prompt","texte":"Crée une infographie verticale présentant les chiffres clés de l’adoption de l’IA en entreprise en 2026. Format portrait A4. Structure en 4 sections distinctes : taux d’adoption global, secteurs les plus avancés, gains de productivité moyens, freins à l’adoption. Chaque section combine un chiffre fort en grand format, une courte explication et une icône simple. Style flat design éditorial. Palette restreinte : bleu profond, orange corail, blanc, gris clair. Typographie hiérarchisée, beaucoup d’espace blanc. Aucun graphique 3D ni effet visuel superflu."},{"type":"paragraphe","texte":"<b>Vignette de couverture (LinkedIn, article, newsletter)</b> : Créer une image de couverture pour un contenu éditorial."},{"type":"prompt","texte":"Crée une image de couverture horizontale (format 1584x396) pour un article LinkedIn intitulé \"Repenser le management à l’ère de l’IA\". Composition épurée, illustration vectorielle stylisée évoquant la collaboration humain-machine. Palette sobre : bleu nuit, beige sable, touches d’orange. Typographie minimaliste. Aucun visage humain photoréaliste, aucun cliché type \"robot qui serre la main d’un humain\"."},{"type":"paragraphe","texte":"<b>Slide d’ouverture de présentation</b> : Générer une slide de couverture professionnelle pour un pitch ou une formation."},{"type":"prompt","texte":"Crée une slide de couverture pour une présentation intitulée \"Transformer son organisation avec l’IA générative\". Format 16:9. Composition asymétrique : titre à gauche en typographie large et moderne, élément graphique abstrait à droite (formes géométriques fluides en dégradé). Palette : noir profond, blanc cassé, accent turquoise. Style éditorial premium, sobre et confiant. Aucun stock photo ni illustration générique d’IA."},{"type":"paragraphe","texte":"<b>Persona ou fiche d’identité visuelle</b> : Créer une fiche persona structurée pour le marketing, la formation ou l’UX."},{"type":"prompt","texte":"Crée une fiche persona au format A4 portrait pour \"Marc, directeur commercial, 45 ans, secteur industriel\". Mise en page structurée en 4 blocs : portrait stylisé en haut à gauche, identité (âge, poste, secteur) à droite, objectifs et frustrations au centre, outils utilisés en bas. Style flat design éditorial, palette bleu et gris, typographie claire et hiérarchisée. Icônes simples pour illustrer chaque bloc."},{"type":"paragraphe","texte":"<b>Frise chronologique</b> : Représenter une évolution, une histoire ou une roadmap sous forme de timeline."},{"type":"prompt","texte":"Crée une frise chronologique horizontale présentant l’évolution de l’IA générative de 2000 à 2026. 6 étapes clés réparties sur la ligne, chacune avec une date, un titre court et un pictogramme. Style flat design minimaliste, ligne centrale fine, alternance des étapes en haut et en bas. Palette : blanc, bleu nuit, accent jaune. Typographie sans-serif moderne, lisibilité optimale."},{"type":"callout","ic":"📷","titre":"À retenir","texte":"La seule limite est votre imagination."}]},{"n":2,"titre":"Génération de diapositives avec ChatGPT ou Claude","bonus":false,"demi":"matin","blocs":[{"type":"etape","titre":"Générer une présentation","texte":"","prompt":"Crée une présentation PowerPoint de X slides sur [sujet], destinée à [public]. L’objectif est de [objectif de la présentation]. Le style doit être clair, moderne, professionnel et directement exploitable. Génère un fichier PPTX."}]},{"n":3,"titre":"L’IA comme partenaire de réflexion","bonus":false,"demi":"matin","blocs":[{"type":"etape","titre":"Trouver 30 cas d’usage IA pour mon métier","texte":"","prompt":"Je suis [métier / fonction] chez [entreprise]. Trouve-moi 30 idées\nde cas d’usage où ChatGPT peut m’assister et me faire gagner du\ntemps au quotidien. Sois créatif, varie les domaines : rédaction,\nanalyse, communication, organisation, prise de décision."}]},{"n":4,"titre":"Créer un site internet en quelques minutes","bonus":false,"demi":"matin","blocs":[{"type":"callout","ic":"👩‍💻","titre":"Objectif de cet atelier","texte":"Lovable est un outil de Vibe Coding. En bref, vous décrivez votre projet en langage naturel, Lovable génère le site web ou l’application complète : interface, logique, données, hébergement. Vous itérez en parlant à l’IA, comme avec ChatGPT."},{"type":"etape","titre":"Générer le prompt sur ChatGPT","texte":"Vous demandez à ChatGPT de jouer un expert dev sur Lovable. Il vous pose les bonnes questions, puis génère le brief technique parfait à coller dans Lovable.","prompt":"Tu es expert dev sur Lovable. Je cherche à construire\n[décrivez votre produit / site web / application en 2-3 phrases : à quoi il sert, pour qui].\nAvant de générer le prompt à coller dans Lovable, pose-moi toutes les questions nécessaires pour que tu aies suffisamment de contexte : fonctionnalités attendues, parcours utilisateur, design, données à manipuler, contraintes techniques.\nUne fois que tu as toutes les réponses, génère le prompt final, structuré et prêt à coller dans Lovable"}]},{"n":5,"titre":"Connecter ChatGPT et Claude à vos outils","bonus":false,"demi":"aprem","blocs":[{"type":"callout","ic":"🔌","titre":"Objectif de cet atelier","texte":"Jusqu’ici, c’est vous qui apportiez les informations à l’IA. Avec les connecteurs, elle va les chercher elle-même dans vos outils : vos e-mails, votre agenda, vos documents. ChatGPT les appelle des applications (on les installe depuis Plugins), Claude les appelle des connecteurs. Le principe est le même."},{"type":"etape","titre":"Créer son premier agent pour trier ses emails","texte":"","prompt":"@Gmail Analyse mes emails reçus depuis hier. Classe-les par urgence et par type d’action, puis rédige ici, dans la conversation, un projet de réponse pour ceux qui demandent une action de ma part aujourd’hui. N’envoie rien et ne crée rien dans ma boîte."}]},{"n":6,"titre":"Créer son assistant dans un Projet ChatGPT","bonus":false,"demi":"aprem","blocs":[{"type":"callout","ic":"🔹","titre":"Objectif de cet atelier","texte":"Un Projet ChatGPT est un espace de travail dédié à une tâche précise : il a ses propres instructions, ses propres fichiers et ses propres conversations, isolés du reste de votre ChatGPT. Une fois configuré, il se comporte comme un assistant qui connaît votre contexte et vos règles, sans que vous ayez à tout réexpliquer. La même démarche existe dans Claude, avec ses Projets. Choisissez une tâche que vous faites souvent et construisez l’assistant qui la fera avec vous."},{"type":"etape","titre":"Laisser ChatGPT vous interviewer","texte":"Ouvrez une conversation dans ce projet et laissez ChatGPT cadrer votre besoin.","prompt":"Je veux créer un assistant dans un Projet ChatGPT pour [décrivez votre besoin en une phrase]. Avant de me proposer quoi que ce soit, pose-moi les questions nécessaires pour bien cerner : le contexte dans lequel cet assistant va m’aider, ce que je lui fournirai à chaque fois, le format de sortie que j’attends, le ton à adopter et ce qu’il doit refuser de faire. Pose une question à la fois."}]},{"n":7,"titre":"ChatGPT Work : votre agent réalise une mission complète","bonus":false,"demi":"aprem","blocs":[{"type":"callout","ic":"🔌","titre":"Objectif de cet atelier","texte":"Avec ChatGPT Work, vous lui confiez une mission entière : il consulte vos fichiers et vos outils, enchaîne les étapes et prépare un résultat prêt à l’emploi. Vous suivez son avancement et c’est vous qui validez les actions importantes."},{"type":"etape","titre":"Transformer une réunion en plan d’action","texte":"Joignez les notes ou le compte rendu d’une réunion sans données sensibles.","prompt":"Tu es mon assistant de suivi opérationnel.\n\nÀ partir des notes de réunion jointes, prépare un plan d’action. Utilise uniquement ces notes.\n\nCommence par me présenter ton plan de travail en quelques étapes. Ensuite, présente :\n1. un résumé de cinq lignes ;\n2. les décisions confirmées ;\n3. un tableau des actions : action, responsable, échéance, priorité. Écris « à confirmer » si le responsable ou l’échéance ne figurent pas dans les notes ;\n4. les questions encore ouvertes ;\n5. un brouillon d’e-mail de compte rendu pour les participants.\n\nNe crée rien et n’envoie rien : attends ma validation."}]},{"n":8,"titre":"Feuille de route personnelle 30 jours","bonus":false,"demi":"aprem","blocs":[{"type":"etape","titre":"Construire mon plan d’action 30 jours","texte":"","prompt":"Aide-moi à construire ma feuille de route IA pour les 30 prochains jours. Mon métier est [métier], mes outils principaux sont [outils], et les cas d’usage que je veux prioriser sont [cas d’usage]. Propose un plan semaine par semaine avec des objectifs concrets, des actions simples, des indicateurs de réussite et les risques à éviter."}]},{"n":9,"titre":"Créer son coach IA","bonus":true,"demi":"aprem","blocs":[{"type":"etape","titre":"Créer la tâche","texte":"Dans ChatGPT, ouvrez l’onglet Tâches dans la barre latérale, puis cliquez sur Créer une tâche."}]}]}],"compl":[{"id":"c1","titre":"Lexique et jargons dans le domaine de l’IA","blocs":[{"type":"liste","items":["<b>Prompt</b> : ce que vous tapez pour demander quelque chose à l’IA. C’est votre « instruction » ou votre « question ».","<b>Token</b> : la façon dont l’IA découpe le texte pour le traiter. En pratique, 1 token ≈ 1 mot. C’est ce qui détermine le coût et les limites d’utilisation.","<b>Fenêtre contextuelle</b> : la « mémoire de travail » de l’IA dans une conversation. Au-delà d’une certaine quantité de texte échangé, elle commence à oublier ce qui a été dit au début.","<b>Inférence</b> : le moment où l’IA génère sa réponse à partir de votre prompt. C’est la phase de calcul invisible entre votre question et la réponse."]}]},{"id":"c2","titre":"Les hallucinations de l’IA","blocs":[{"type":"paragraphe","texte":"Une hallucination survient quand l’IA génère une information fausse, inventée ou déformée, présentée avec la même assurance qu’une information vraie. Elle ne sait pas qu’elle se trompe, et c’est précisément ce qui la rend dangereuse."},{"type":"sous-titre","texte":"Pourquoi ça arrive ?"},{"type":"paragraphe","texte":"L’IA ne cherche pas la vérité. Elle cherche la suite de mots la plus probable statistiquement. Si aucune donnée fiable n’existe dans son entraînement sur un sujet, elle comble les trous avec ce qui lui semble plausible, sans jamais le signaler."},{"type":"sous-titre","texte":"Les formes les plus courantes"},{"type":"liste","items":["Fausses citations : attribuer des propos à quelqu’un qui ne les a jamais tenus","Fausses sources : inventer des articles, études ou livres avec des titres crédibles","Faux chiffres : donner des statistiques précises mais erronées","Fausse chronologie : mélanger les dates d’événements réels","Faux profils : inventer des détails biographiques sur une personne réelle"]},{"type":"sous-titre","texte":"Dans quels cas le risque est-il plus élevé ?"},{"type":"liste","items":["Sujets très récents, après la date de coupure du modèle, sans recherche web activée","Sujets très spécialisés ou techniques","Questions sur des personnes peu connues","Demandes de chiffres précis ou de sources peu connues"]},{"type":"sous-titre","texte":"Comment s’en protéger ?"},{"type":"liste","items":["Activer la recherche sur le web dès que la requête est factuelle","Partir d’un site ou d’un document en entrée, et demander à l’IA de s’y tenir strictement","Utiliser plusieurs LLM pour la même requête et comparer les résultats","Toujours vérifier les informations factuelles dans une source externe avant de les utiliser","Préférer Perplexity à ChatGPT pour les recherches factuelles : les sources sont citées et vérifiables","Ne jamais publier ou transmettre un contenu IA sans relecture critique"]},{"type":"callout","ic":"⚠️","titre":"À retenir","texte":"L’IA est un outil de génération, pas un moteur de vérité. Plus l’enjeu de l’information est important, plus votre vérification doit être rigoureuse."}]},{"id":"c3","titre":"Évaluer la qualité d’une réponse IA","blocs":[{"type":"paragraphe","texte":"L’IA produit des réponses fluides, bien structurées et confiantes, même quand elles sont fausses ou médiocres. Savoir évaluer un résultat est aussi important que savoir le générer."},{"type":"sous-titre","texte":"La grille d’évaluation en 6 critères"},{"type":"liste","items":["<b>Exactitude</b> : les faits et chiffres sont-ils vérifiables ? Signal d’alerte : chiffres précis sans source, affirmations absolues.","<b>Pertinence</b> : la réponse répond-elle vraiment à ma question ? Signal d’alerte : réponse générique applicable à n’importe quel contexte.","<b>Complétude</b> : manque-t-il des éléments importants ? Signal d’alerte : réponse courte sur un sujet complexe.","<b>Ton et style</b> : est-ce adapté à mon audience et à mon usage ? Signal d’alerte : trop formel, trop familier, jargon inadapté.","<b>Structure</b> : le format est-il exploitable tel quel ? Signal d’alerte : bullet points génériques, structure passe-partout.","<b>Originalité</b> : est-ce spécifique à ma situation ? Signal d’alerte : conseils valables pour tout le monde, aucun contexte pris en compte."]},{"type":"sous-titre","texte":"Les signaux d’alerte à repérer"},{"type":"liste","items":["Réponse longue qui tourne en rond sans apporter de substance","Formulations passe-partout : « il est important de noter que… », « il convient de… »","Chiffres précis sans aucune source mentionnée","Absence totale de nuance ou de mise en garde","Répétition des mots de votre question sans vraiment y répondre","Listes de 5 ou 10 points parfaitement équilibrés, qui ressemblent à un article de blog générique"]},{"type":"sous-titre","texte":"La technique du contre-prompt"},{"type":"paragraphe","texte":"Après une réponse, challengez l’IA :"},{"type":"liste","items":["« Quelles sont les limites de ce que tu viens de me proposer ? »","« Quel argument contraire pourrait-on opposer à cette analyse ? »","« Si tu devais critiquer ta propre réponse, que dirais-tu ? »"]},{"type":"callout","ic":"⏱️","titre":"Le test en 3 secondes","texte":"Avant d’utiliser ou de transmettre un résultat IA : « Est-ce que je pourrais défendre ce contenu si quelqu’un me posait des questions dessus ? » Si la réponse est non, relisez, vérifiez, reformulez. Une réponse IA n’est jamais un livrable final : la signature, c’est vous."}]},{"id":"c4","titre":"Sécurité et confidentialité avec l’IA","blocs":[{"type":"paragraphe","texte":"Quand vous écrivez quelque chose dans ChatGPT, ces données transitent sur les serveurs d’OpenAI, aux États-Unis. Par défaut, elles peuvent être utilisées pour améliorer les modèles. Ce que vous écrivez n’est pas confidentiel au sens juridique du terme."}]},{"id":"c5","titre":"Les modèles de raisonnement","blocs":[{"type":"sous-titre","texte":"La distinction fondamentale"},{"type":"liste","items":["<b>Réflexion légère</b> : répond immédiatement, rapide, bon pour la rédaction, la reformulation et les tâches courantes. L’extraverti qui répond d’instinct.","<b>Réflexion approfondie</b> : réfléchit en interne avant de répondre, plus lent (quelques secondes à plusieurs minutes), bon pour les problèmes complexes, la logique et le multi-étapes. L’introverti qui prend le temps de réfléchir."]}]},{"id":"c6","titre":"Le format Markdown et son intérêt en prompting","blocs":[{"type":"paragraphe","texte":"Le Markdown est un langage de balisage léger qui permet de structurer du texte avec des symboles simples : un dièse pour un titre, deux astérisques autour d’un mot pour le gras, un tiret devant une ligne pour une puce."}]},{"id":"c7","titre":"La méthode RTCF","blocs":[{"type":"liste","items":["<b>Rôle</b> : qui doit répondre ? « Tu es un consultant en cybersécurité spécialisé dans les PME industrielles »","<b>Tâche</b> : que doit-il faire ? Utilisez un verbe d’action précis.","<b>Contexte</b> : pourquoi cette demande, pour qui, dans quel cadre ? « Je prépare une note pour mon comité de direction qui n’est pas technique »","<b>Format</b> : sous quelle forme la réponse doit-elle arriver ? « Une note d’une page maximum, structurée en trois parties, avec un tableau de synthèse en conclusion »"]}]}]};
