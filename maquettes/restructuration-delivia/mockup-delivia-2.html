<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELIV'IA 2.0 · Plateforme France IA (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc; --surface:#fff; --ink-900:#0f172a; --ink-800:#1e293b; --ink-700:#334155;
  --ink-500:#64748b; --ink-400:#94a3b8; --ink-300:#cbd5e1;
  --line:#f1f5f9; --line-2:#e2e8f0;
  --primary:#4f46e5; --primary-dark:#4338ca; --primary-50:#eef2ff;
  --ok:#059669; --ok-50:#ecfdf5; --warn:#d97706; --warn-50:#fffbeb;
  --err:#e11d48; --err-50:#fff1f2; --info:#2563eb; --info-50:#eff6ff;
  --sh-carte:0 1px 3px 0 rgb(0 0 0/.04),0 1px 2px -1px rgb(0 0 0/.04);
  --sh-hover:0 4px 6px -1px rgb(0 0 0/.06),0 2px 4px -2px rgb(0 0 0/.04);
  --app-delivia:#4f46e5; --app-apprenant:#0284c7; --app-treso:#059669; --app-dash:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink-800);font-size:14px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{display:flex;min-height:100vh}
/* ── Sidebar plateforme ─────────────────────────── */
#sidebar{width:248px;flex-shrink:0;background:#fff;box-shadow:1px 0 0 0 var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
#appzone{margin:4px 10px 2px;padding:7px 6px 6px;background:#e2e8f0;border-radius:14px}
.brand{padding:18px 20px 10px}
.brand .word{font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--ink-900)}
.brand .word em{font-style:italic;font-weight:700}
.brand .tri{display:flex;height:3px;width:64px;margin-top:5px;border-radius:2px;overflow:hidden}
.brand .tri i{flex:1}.brand .tri i:nth-child(1){background:#4379f2}.brand .tri i:nth-child(2){background:#eef0f4}.brand .tri i:nth-child(3){background:#f21b1b}
.brand .plt{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400);margin-top:7px;font-weight:500}
.nav-label{padding:4px 12px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-900)}
.apptab{display:flex;align-items:center;gap:10px;width:100%;margin:1px 0;padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink-700);text-align:left;transition:background .12s,color .12s,box-shadow .12s}
.apptab:hover{background:rgba(255,255,255,.55);color:var(--ink-900)}
.apptab .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.apptab.active{background:#fff;color:var(--ink-900);font-weight:600;box-shadow:var(--sh-carte)}
.apptab .lock{margin-left:auto;font-size:10px;color:var(--ink-400)}
#subnav{padding-bottom:8px;padding-top:6px}
#subnav .appctx{padding:10px 20px 2px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
#subnav .appctx .dot{width:7px;height:7px;border-radius:50%}
.subgrp{padding:12px 20px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400)}
.subtab{display:flex;align-items:center;gap:8px;width:calc(100% - 28px);margin:1px 8px 1px 20px;padding:6px 11px;border-radius:7px;font-size:13px;color:var(--ink-500);text-align:left}
.subtab:hover{background:var(--bg);color:var(--ink-700)}
.subtab.active{background:var(--bg);color:var(--ink-900);font-weight:600}
.subtab.active::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent,#4f46e5);margin-left:-8px;margin-right:5px}
.side-note{margin-top:auto;padding:14px 20px;font-size:11px;color:var(--ink-400);border-top:1px solid var(--line);line-height:1.5}
/* ── Topbar ─────────────────────────────────────── */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:52px;background:#fff;box-shadow:0 1px 0 0 var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:30}
#crumb{font-size:14px;font-weight:600;color:var(--ink-900)}
#crumb .sep{color:var(--ink-300);font-weight:400;margin:0 6px}
#roleWrap{margin-left:auto;display:flex;align-items:center;gap:8px}
#roleWrap .lbl{font-size:11px;color:var(--ink-400)}
.rolesel{display:flex;gap:2px;background:#f1f5f9;padding:3px;border-radius:8px}
.rolesel button{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink-500)}
.rolesel button.active{background:#fff;color:var(--ink-900);font-weight:600;box-shadow:var(--sh-carte)}
#content{flex:1;padding:20px 24px 60px}
.pagehead{margin-bottom:14px}
.pagehead h1{font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--ink-900)}
.pagehead p{font-size:13px;color:var(--ink-500);margin-top:3px;max-width:760px}
/* filtres */
.chips{display:inline-flex;align-items:center;gap:4px;background:#f1f5f9;padding:5px;border-radius:9px;margin:2px 10px 14px 0;flex-wrap:wrap}
.chips .grp{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-400);font-weight:600;padding:0 6px}
.chips button{padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-500)}
.chips button.active{background:#fff;color:var(--ink-900);font-weight:600;box-shadow:var(--sh-carte)}
/* ── Kanban ─────────────────────────────────────── */
.kb-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-900);margin:18px 0 10px}
.kb-title .who{font-size:11px;font-weight:500;color:var(--ink-400)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{width:272px;flex-shrink:0;background:rgba(248,250,252,.9);border:1px solid var(--line);border-radius:12px;padding:10px}
.col-h{display:flex;align-items:center;gap:7px;padding:2px 4px 8px}
.col-h .pill{width:8px;height:8px;border-radius:50%;background:var(--ink-400);flex-shrink:0}
.col-h h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-500)}
.col-h .n{margin-left:auto;font-size:11px;color:var(--ink-400);font-variant-numeric:tabular-nums}
.col-open{font-size:10.5px;color:var(--info);background:var(--info-50);border-radius:6px;padding:4px 8px;margin:0 2px 8px;display:block;line-height:1.45}
.col-open a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.col.locked{background:repeating-linear-gradient(-45deg,#f8fafc 0 10px,#f4f6f9 10px 11px);border-style:dashed;border-color:var(--line-2)}
.col.locked .col-h h3{color:var(--ink-400)}
.col.locked .card{opacity:.55;filter:grayscale(.5)}
.col.locked .card:hover{opacity:.8}
.lockbar{font-size:10.5px;color:var(--ink-500);background:#eef1f5;border-radius:6px;padding:5px 8px;margin:0 2px 8px;display:flex;align-items:center;gap:6px;line-height:1.35}
.lockbar button{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--primary);white-space:nowrap}
.lockbar button:hover{text-decoration:underline;text-underline-offset:2px}
.card.waitlock{background:#fbfcfd}
.card.waitlock .t{color:var(--ink-500)}
.lockstrip{margin:-11px -12px 10px;padding:6px 12px;background:#f1f5f9;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-500);line-height:1.35}
.lockstrip b{color:var(--ink-700);font-weight:600}
.lockstrip .dim{color:var(--ink-400)}
.lockstrip a{margin-left:auto;color:var(--primary);font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.lockstrip a:hover{text-decoration:underline;text-underline-offset:2px}
.card.haslock .finbar{top:36px}
.card.haslock > *:not(.lockstrip){opacity:.72}
.card.haslock > .finbar{opacity:.72}
.openline{margin-top:9px;font-size:11px;color:var(--ink-500);background:#eef1f5;border-radius:6px;padding:5px 8px;display:flex;gap:6px;align-items:center;line-height:1.4}
.openline b{color:var(--ink-700);font-weight:600}
.openline a{color:var(--primary);font-weight:600;cursor:pointer;margin-left:auto;font-size:10.5px;white-space:nowrap}
.openline a:hover{text-decoration:underline;text-underline-offset:2px}
.card{background:#fff;border-radius:10px;box-shadow:var(--sh-carte);padding:11px 12px;margin-bottom:9px;position:relative;transition:box-shadow .15s,opacity .3s,transform .3s}
.card:hover{box-shadow:var(--sh-hover)}
.card.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.card .t{font-size:13.5px;font-weight:600;color:var(--ink-900)}
.card .s{font-size:11px;color:var(--ink-400);margin-top:2px}
.finbar{position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1.5px 8px;font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums}
.b-cpf{background:var(--info-50);color:var(--info)} .bar-cpf{background:#3b82f6}
.b-opco{background:#fff7ed;color:#ea580c} .bar-opco{background:#f97316}
.b-vir{background:var(--ok-50);color:var(--ok)} .bar-vir{background:#10b981}
.b-mandat{background:#faf5ff;color:#9333ea} .bar-mandat{background:#a855f7}
.b-wait{background:var(--warn-50);color:var(--warn)}
.b-neutral{background:#f1f5f9;color:var(--ink-500)}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tasks{margin-top:9px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.tgrp{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);margin:5px 0 2px}
.tor{display:flex;align-items:center;gap:8px;color:var(--ink-300);font-size:10px;font-weight:600;margin:4px 0}
.tor::before,.tor::after{content:"";flex:1;height:1px;background:var(--line-2)}
.task{display:flex;align-items:flex-start;gap:7px;padding:3px 2px;border-radius:6px;font-size:12px;line-height:1.4;color:var(--ink-700);cursor:pointer}
.task:hover{background:var(--bg)}
.task .box{width:14px;height:14px;border:1.5px solid var(--ink-300);border-radius:4px;flex-shrink:0;margin-top:1.5px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.task.done .box{background:var(--primary);border-color:var(--primary)}
.task.done .box::after{content:"";width:8px;height:4.5px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;transform:rotate(-45deg) translate(0.5px,-1px)}
.task.done .lbl{color:var(--ink-400);text-decoration:line-through}
.task.other{color:var(--ink-400)}
.task.other .box{border-color:var(--line-2);background:var(--bg)}
.task.other.done .box{background:var(--ink-300);border-color:var(--ink-300)}
.task .who{color:var(--ink-400);font-size:11px}
.task .tag{font-size:10px;color:#92400e;background:var(--warn-50);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.task .tag:hover{border-color:#fcd34d;text-decoration:underline;text-underline-offset:2px}
/* popup template */
#tplmodal{position:fixed;inset:0;background:rgba(15,23,42,.3);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
#tplmodal .mbox{max-width:430px}
.tpl-canal{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:600;background:var(--ok-50);color:var(--ok)}
.tpl-body{background:#f8fafc;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.65;color:var(--ink-700);white-space:pre-line}
.tpl-body .var{background:var(--primary-50);color:var(--primary-dark);border-radius:4px;padding:0 4px;font-size:12px;font-weight:500}
.tpl-note{font-size:11px;color:var(--ink-400);margin-top:10px;line-height:1.5}
/* fiches apprenant & client */
.backbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-500);margin-bottom:12px;cursor:pointer;border-radius:6px;padding:4px 8px}
.backbtn:hover{background:#f1f5f9;color:var(--ink-700)}
.fichehead{background:#fff;border-radius:12px;box-shadow:var(--sh-carte);padding:20px 22px;margin-bottom:14px;max-width:880px}
.fh-top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.avat{width:40px;height:40px;border-radius:10px;background:var(--primary-50);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.avat svg{width:19px;height:19px}
.fichehead h1{font-size:19px;font-weight:600;letter-spacing:-.015em;color:var(--ink-900);line-height:1.25}
.fh-contact{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--ink-500)}
.fh-contact span{display:inline-flex;align-items:center;gap:5px}
.fh-contact svg{color:var(--ink-400)}
.fh-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fh-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fh-link{font-size:12px;font-weight:600;color:var(--primary);cursor:pointer;white-space:nowrap}
.fh-link:hover{text-decoration:underline;text-underline-offset:2px}
.apercu{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.apercu .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600}
.apercu .v{font-size:13px;font-weight:600;color:var(--ink-900);margin-top:4px;line-height:1.4}
.apercu .v .sm{font-weight:400;color:var(--ink-500);font-size:12px}
.idchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;border-top:1px solid var(--line);padding-top:12px;align-items:center}
.idchips .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600;margin-right:2px}
.idchip{display:inline-flex;align-items:center;border-radius:6px;background:#f8fafc;border:1px solid var(--line);padding:2px 8px;font-size:10.5px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.perschip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#f8fafc;border:1px solid var(--line);padding:3px 10px 3px 4px;font-size:12px;font-weight:500;color:var(--ink-700);cursor:pointer;margin:0 6px 4px 0}
.perschip:hover{border-color:#c7d2fe;color:var(--primary-dark)}
.perschip .avat{width:22px;height:22px;font-size:9px;border-radius:999px}
.fsec{background:#fff;border-radius:12px;box-shadow:var(--sh-carte);padding:16px 20px;margin-bottom:12px;max-width:880px}
.sect-h{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;color:var(--ink-900)}
.sect-h svg{color:var(--ink-400);flex-shrink:0;margin-top:1px}
.sect-h .n2{font-weight:400;color:var(--ink-400);font-size:11.5px}
.sect-h .right{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--ink-400);text-align:right;line-height:1.5}
.fsec>h2{font-size:13px;font-weight:600;color:var(--ink-900);display:flex;align-items:center;gap:7px}
.fsec>h2 .n2{font-weight:400;color:var(--ink-400);font-size:11px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-700)}
.subh+.lrow{border-top:none}
.lrow .chip{margin-left:auto;flex-shrink:0}
.subh{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600;margin:14px 0 4px}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-700);flex-wrap:wrap}
.frow:nth-of-type(1){border-top:none}
.frow .tt{font-weight:500;color:var(--ink-900)}
.frow .sm{font-size:11.5px;color:var(--ink-400)}
.frow .go{margin-left:auto;color:var(--primary);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.frow .go:hover{text-decoration:underline;text-underline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1.5px 9px;font-size:10.5px;font-weight:500;background:#f1f5f9;color:var(--ink-500)}
.chip.ok{background:var(--ok-50);color:var(--ok)}
.chip.warn{background:var(--warn-50);color:var(--warn)}
.mlinks{display:flex;gap:12px;margin-top:8px}
.mlinks a{font-size:11.5px;font-weight:600;color:var(--primary);cursor:pointer}
.mlinks a:hover{text-decoration:underline;text-underline-offset:2px}
/* historique des to_do */
.hist{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.hist summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-500);list-style:none;display:flex;align-items:center;gap:6px}
.hist summary::before{content:"▸";font-size:10px;color:var(--ink-400);transition:transform .15s}
.hist[open] summary::before{transform:rotate(90deg)}
.hist summary:hover{color:var(--ink-700)}
.hist summary .n2{font-weight:400;color:var(--ink-400);font-size:11px}
.hrow{display:flex;gap:9px;font-size:11.5px;padding:3.5px 0;color:var(--ink-600,#475569);line-height:1.4;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.hrow .d{flex-shrink:0;width:118px;color:var(--ink-400);font-variant-numeric:tabular-nums}
.hrow .ck{color:var(--ok);flex-shrink:0}
.hrow .e{color:var(--ink-300);margin:0 2px}
.hrow .w{color:var(--ink-400)}
.task .fx{font-size:10px;color:#9d174d;background:#fdf2f8;border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.task .note{display:block;font-size:10.5px;color:var(--ink-400);margin-top:1px}
.sub{margin:2px 0 2px 21px;display:flex;flex-direction:column;gap:1px}
.waiting{margin-top:8px;font-size:11px;color:var(--warn);background:var(--warn-50);border-radius:6px;padding:5px 8px;line-height:1.4}
/* carte compacte */
.card.pointer{border:1.5px dashed var(--line-2);box-shadow:none;background:#fbfcfd}
.card.pointer:hover{border-color:#c7d2fe;background:#fff}
.card.pointer .t{color:var(--ink-700)}
.card.clickable{cursor:pointer}
.card.clickable:hover .t{color:var(--primary)}
.prog{height:4px;background:#f1f5f9;border-radius:999px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:#818cf8;transition:width .3s}
.prog i.full{background:#34d399}
.cnt{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.cnt b{font-weight:600;color:var(--ink-700)}
.nextt{display:flex;gap:6px;margin-top:5px;font-size:11.5px;color:var(--ink-700);line-height:1.35}
.nextt .k{flex-shrink:0;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);margin-top:1px}
.nextt .v{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nextt .who2{color:var(--ink-400)}
.opendetail{margin-top:8px;font-size:10.5px;color:var(--ink-400)}
.card.clickable:hover .opendetail{color:var(--primary)}
/* modal détail de carte */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px}
.mbox{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgb(0 0 0/.2);width:100%;max-width:520px;max-height:86vh;overflow-y:auto}
.mhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 20px 12px;border-radius:14px 14px 0 0}
.mhead .row{display:flex;align-items:flex-start;gap:10px}
.mhead .t{font-size:16px;font-weight:600;color:var(--ink-900);letter-spacing:-.01em}
.mhead .s{font-size:12px;color:var(--ink-400);margin-top:2px}

.lines .ln{display:flex;justify-content:space-between;font-size:11.5px;padding:2.5px 2px;color:var(--ink-700)}

.lines .ln .k{color:var(--ink-400)}

.toast{background:var(--ink-900);color:#f1f5f9;font-size:12.5px;line-height:1.5;padding:10px 14px;border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0/.22);animation:tin .25s ease}
.toast b{color:#fff}
.toast.pink{border-left:3px solid #ec4899}

#auth{position:fixed;inset:0;background:rgba(248,250,252,.92);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center}
#auth .box{background:#fff;border-radius:14px;box-shadow:0 14px 40px rgb(0 0 0/.12);padding:30px 42px;text-align:center}
#auth .sp{width:26px;height:26px;border:3px solid var(--line-2);border-top-color:var(--accent2,#4f46e5);border-radius:50%;margin:0 auto 12px;animation:spin .7s linear infinite}

function tasksFor(card, colId){
  const def=KB[card.kb].tasks[colId]||[];
  return def.filter(tk=>!tk.fin || tk.fin.includes(card.fin));
}
function key(card,colId,i){return card.id+"::"+colId+"::"+i}
function allDone(card){
  const tks=tasksFor(card,card.col);
  if(!tks.length) return false;
  return tks.every((tk,i)=>{
    if(tk.sub && card.ech) return card.ech.every(e=>e[1]);
    return S.checks[key(card,card.col,i)];
  });
}
function nextCol(card){
  const cols=KB[card.kb].cols;
  let ix=cols.findIndex(c=>c.id===card.col);
  for(let j=ix+1;j<cols.length;j++){ if(!cols[j].skip) return cols[j]; }
  return null;
}
function colUnlocked(kb,col){ if(typeof col==="string") col=KB[kb].cols.find(c=>c.id===col); return !col.open || S.unlocked[kb+"::"+col.id]; }
function tryAdvance(card){
  if(!allDone(card)) return;
  const nc=nextCol(card);
  if(!nc) return;
  if(!colUnlocked(card.kb,nc)){ card.waiting=nc.id; render(); return; }
  card.waiting=null; card.col=nc.id; card.justMoved=true;
  toast(`Carte avancée : <b>${card.title}</b> → ${nc.label}`);
  render();
}
function runFx(card, tk, k){
  if(!tk.fx || S.fxDone[k]) return;
  S.fxDone[k]=true;
  if(tk.fx==="carte_client"){
    let kb,col;
    if(card.fin==="cpf"){kb="fact_cpf";col="sortie"}
    else if(card.fin==="opco"){kb="fact_opco";col="raf"}
    else if(card.fin==="fp_ent_vir"){kb="fact_fp";col="raf"}
    else {kb="fact_fp";col="attente"}
    const nid="dyn"+Math.floor(performance.now());
    CARDS.push({id:nid,kb,title:card.title,sub:"Vente "+(FIN[card.fin]?.lbl||"")+" · carte née du kanban Inscription",fin:card.fin,col,fresh:1,
      ech:(card.fin==="fp_part"||card.fin==="fp_ent_man")?[["Échéance 1/1 · montant total · J+14 de la vente",0]]:null});
    toast(`Création de la carte facturation : <b>${card.title}</b> (${FIN[card.fin]?.lbl||""})`,1);
  }
  if(tk.fx==="carte_formateur"){
    const nid="dynf"+Math.floor(performance.now());
    CARDS.push({id:nid,kb:"fact_frm",title:"Facture formateur · "+card.title,sub:"Née au dépôt de la facture",col:"valider",fresh:1});
    toast(`Création de la carte <b>Facturation formateur</b> : ${card.title}`,1);
  }
  if(tk.fx==="ligne_closer"){
    const m=CARDS.find(c=>c.id==="m1");
    m.lines.push(["Close · "+card.title.split("·")[0].trim(),"165 €"]);
    m.newLine=true;
    toast(`Ligne de commission ajoutée à la <b>facture mensuelle du closeur</b> : ${card.title}`,1);
  }
}
function clickTask(cardId,colId,i){
  const card=CARDS.find(c=>c.id===cardId);
  const tk=tasksFor(card,colId)[i];
  const k=key(card,colId,i);
  const owned = tk.p===ROLE_OWNS[S.role];
  S.checks[k]=!S.checks[k];
  if(S.checks[k]) S.when[k]=new Date(); else delete S.when[k];
  if(S.checks[k] && !owned && !S.simWarned){
    S.simWarned=true;
    toast(`Simulation : tâche cochée à la place de « ${WHO[tk.p]} ». Dans DELIV'IA, seule cette personne (ou l'automate) pourra la cocher.`);
  }
  if(S.checks[k]) runFx(card,tk,k);
  if(colId===card.col) tryAdvance(card);
  render();
}
function clickEch(cardId,j){
  const card=CARDS.find(c=>c.id===cardId);
  card.ech[j][1]=card.ech[j][1]?0:1;
  if(card.ech.every(e=>e[1])) toast(`Toutes les échéances encaissées : <b>${card.title}</b>`);
  tryAdvance(card);
  render();
}
function unlockCol(kb,colId){
  S.unlocked[kb+"::"+colId]=true;
  toast(`Étape ouverte en avance : les cartes prêtes peuvent maintenant y entrer.`);
  CARDS.filter(c=>c.kb===kb&&c.waiting===colId).forEach(c=>{c.waiting=null;tryAdvance(c)});
  render();
}

function badge(fin){ if(!fin) return ""; const f=FIN[fin]; return `<span class="badge b-${f.cls}">${f.lbl}</span>` }
function taskHtml(card,colId,i,tk,ghost){
  const k=key(card,colId,i);
  const done=tk.sub&&card.ech ? card.ech.every(e=>e[1]) : !!S.checks[k];
  const owned=tk.p===ROLE_OWNS[S.role];
  const who=owned?"":` <span class="who">(${WHO[tk.p]})</span>`;
  let h="";
  if(tk.grp) h+=`<div class="tgrp">${tk.grp}</div>`;
  h+=`<div class="task ${done?"done":""} ${owned?"":"other"}" data-c="${card.id}" data-col="${colId}" data-i="${i}" ${ghost?'style="pointer-events:none"':""}>
    <span class="box"></span>
    <span><span class="lbl">${tk.t}</span>${who}${tk.tpl?`<span class="tag" data-tpl="${encodeURIComponent(tk.t)}" title="Voir le template">→ template</span>`:""}${tk.fx==="carte_client"||tk.fx==="carte_formateur"?'<span class="fx">→ crée la carte facturation</span>':""}${tk.fx==="ligne_closer"?'<span class="fx">→ ligne facture closeur</span>':""}${tk.note?`<span class="note">${tk.note}</span>`:""}</span>
  </div>`;
  if(tk.sub&&card.ech){
    h+=`<div class="sub">`+card.ech.map((e,j)=>`<div class="task other ${e[1]?"done":""}" data-ech="${card.id}" data-j="${j}"><span class="box"></span><span class="lbl" style="font-size:11px">${e[0]}</span></div>`).join("")+`</div>`;
  }
  return h;
}
function openDateStr(card,col){
  if(!col||!col.rule) return null;
  const d=card.dt||{}; let base=null,off=0;
  if(col.rule==="j-14"){base=d.j1;off=-14}
  else if(col.rule==="j2"){base=d.j2}
  else if(col.rule==="j2+1"){base=d.j2;off=1}
  else if(col.rule==="prevue"){base=d.prevue}
  else if(col.rule==="echeance"){base=d.echeance}
  else if(col.rule==="fin_mois"){base="2026-08-31"}
  if(!base) return "date à confirmer";
  const dt=new Date(base+"T12:00:00"); dt.setDate(dt.getDate()+off);
  return "le "+dt.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
}
function taskState(card,colId,i,tk){
  if(tk.sub&&card.ech) return card.ech.every(e=>e[1]);
  return !!S.checks[key(card,colId,i)];
}
function cardHtml(card, colDef, opts={}){
  const isGhost = opts.ghostCols && colDef.ghost;
  const tks=tasksFor(card,colDef.id);
  const factLink = isGhost ? findFactCard(card) : null;
  const done=tks.filter((tk,i)=>taskState(card,colDef.id,i,tk)).length;
  const remaining=tks.length-done;
  const nextTk=tks.find((tk,i)=>!taskState(card,colDef.id,i,tk));
  const lockInfo = opts.lockedCol ? {c:colDef,pref:false} : (card.waiting ? {c:KB[card.kb].cols.find(x=>x.id===card.waiting),pref:true} : null);
  let h=`<div class="card ${card.fresh?"pop":""} ${card.waiting?"waitlock":""} ${lockInfo?"haslock":""} ${isGhost?"ghost":"clickable"}" id="card-${card.id}" ${isGhost?"":`data-open="${card.id}"`}>`;
  if(lockInfo){
    const lc=lockInfo.c;
    h+=`<div class="lockstrip">🔒 <span>${lockInfo.pref?`<b>${lc.label}</b> · `:""}Ouverture ${openDateStr(card,lc)} <span class="dim">(${lc.open})</span></span><a data-unlock="${card.kb}::${lc.id}">Ouvrir en avance</a></div>`;
  }
  if(card.fin) h+=`<div class="finbar bar-${FIN[card.fin].cls}"></div>`;
  h+=`<div class="t">${card.title}</div><div class="s">${card.sub||""}</div>`;
  h+=`<div class="meta">${badge(card.fin)}</div>`;
  if(card.lines){
    const tot=card.lines.reduce((a,l)=>a+parseInt(l[1].replace(/\D/g,"")||0),0);
    h+=`<div class="cnt"><b>${card.lines.length} ligne${card.lines.length>1?"s":""}</b> · total ${tot.toLocaleString("fr-FR")} €</div>`;
  }
  if(isGhost){
    h+=`<div class="ghost-hint">🔒 Lecture seule · survoler pour le détail</div>
      <div class="popover">« Inscription confirmée, veuillez revenir le lendemain du J2 pour vous assurer que votre client a bien participé à sa formation et poursuivre le processus sur la carte facturation du client. Le cas échéant, cette carte se déplacera à l'étape Absent. »
      ${factLink?`<a data-goto="${factLink.id}">Voir la carte facturation →</a>`:""}</div>`;
  } else if(tks.length){
    h+=`<div class="prog"><i class="${remaining===0?"full":""}" style="width:${tks.length?Math.round(done/tks.length*100):0}%"></i></div>`;
    h+=`<div class="cnt"><b>${remaining===0?"Étape complète":remaining+" tâche"+(remaining>1?"s":"")+" restante"+(remaining>1?"s":"")}</b> · ${done}/${tks.length}</div>`;
    if(nextTk) h+=`<div class="nextt"><span class="k">Next :</span><span class="v">${nextTk.t}${nextTk.p===ROLE_OWNS[S.role]?"":` <span class="who2">(${WHO[nextTk.p]})</span>`}</span></div>`;
  }
  h+=`</div>`;
  return h;
}
function fmtWhen(d){
  const today=new Date();
  const sameDay=d.toDateString()===today.toDateString();
  const dd=d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  const hh=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return (sameDay?"aujourd'hui":dd)+" · "+hh;
}
function historyFor(card){
  const cols=KB[card.kb].cols;
  const curIx=cols.findIndex(c=>c.id===card.col);
  const past=cols.slice(0,curIx).filter(c=>!c.skip);
  const rows=[];
  past.forEach((col,j)=>{
    const base=new Date(); base.setDate(base.getDate()-(past.length-j)*4);
    tasksFor(card,col.id).forEach((tk,i)=>{
      const k=key(card,col.id,i);
      const d=S.when[k]?new Date(S.when[k]):(()=>{const x=new Date(base);x.setHours(9+((i*2)%8),(i*17)%60,0,0);return x})();
      rows.push({d,t:tk.t,p:tk.p,e:col.label});
    });
  });
  tasksFor(card,card.col).forEach((tk,i)=>{
    if(taskState(card,card.col,i,tk)){
      const k=key(card,card.col,i);
      rows.push({d:S.when[k]?new Date(S.when[k]):new Date(),t:tk.t,p:tk.p,e:cols[curIx].label});
    }
  });
  rows.sort((a,b)=>a.d-b.d);
  return rows;
}

function findFactCard(insc){
  const kb = insc.fin==="cpf"?"fact_cpf":insc.fin==="opco"?"fact_opco":"fact_fp";
  return CARDS.find(c=>c.kb===kb && c.title.includes(insc.title.split("·")[0].trim()));
}
function boardHtml(kbId, cards, opts={}){
  const kb=KB[kbId];
  let h=`<div class="board">`;
  for(const col of kb.cols){
    const inCol=cards.filter(c=>c.col===col.id);
    const locked=col.open && !colUnlocked(kbId,col.id);
    h+=`<div class="col ${locked?"locked":""}"><div class="col-h"><span class="pill" ${locked?'style="background:#cbd5e1"':""}></span><h3>${locked?"🔒 ":""}${col.label}</h3><span class="n">${inCol.length}</span></div>`;
    if(col.note) h+=`<div class="col-open">${col.note}</div>`;
    if(col.open && !locked){
      h+=`<div class="lockbar" style="background:var(--ok-50);color:var(--ok)">Étape ouverte (${col.open})</div>`;
    }
    if(opts.aPrendre && col.id==="shotgun") h+=pointerCard();
    else h+=inCol.map(c=>cardHtml(c,col,Object.assign({},opts,{lockedCol:locked}))).join("");
    h+=`</div>`;
  }
  return h+`</div>`;
}
function chips(list, active, onKey, groups){
  let h=`<div class="chips">`;
  for(const [grp,items] of list){
    if(grp) h+=`<span class="grp">${grp}</span>`;
    h+=items.map(([id,lbl])=>`<button class="${active===id?"active":""}" data-chip="${onKey}::${id}">${lbl}</button>`).join("");
  }
  return h+`</div>`;
}

      <div class="kpi"><div class="l">Taux de close</div><div class="v">31 %</div><div class="d up">↑ 2 pts</div></div>
      <div class="kpi"><div class="l">No-show</div><div class="v">18 %</div><div class="d down">↓ 3 pts</div></div>
    </div>
    <div class="dd-sec"><h3>👥 Closers · août</h3>
      <table class="dd-tbl"><tr><th>Closer</th><th>RDV tenus</th><th>Closes</th><th>CA</th><th>Taux</th></tr>
      <tr><td>Alex R.</td><td>64</td><td>22</td><td>36 300 €</td><td>34 %</td></tr>
      <tr><td>Chloé M.</td><td>58</td><td>19</td><td>31 350 €</td><td>33 %</td></tr>
      <tr><td>Yanis B.</td><td>61</td><td>17</td><td>28 050 €</td><td>28 %</td></tr></table>
    </div>
  </div></div>`;
}

/* ── rendu global ── */
function render(){
  /* app tabs */
  const apps=ROLE_APPS[S.role];
  $("#appTabs").innerHTML=apps.map(a=>`<button class="apptab ${S.app===a?"active":""}" data-app="${a}"><span class="dot" style="background:${APPS[a].color}"></span>${APPS[a].name}${S.app===a?"":'<span class="lock">SSO</span>'}</button>`).join("");
  /* subnav */
  const groups = S.app==="delivia" ? DELIVIA_TABS[S.role] : (APP_TABS[S.app]||[]);
  document.documentElement.style.setProperty("--accent", APPS[S.app].accent);
  $("#subnav").innerHTML = `<div class="appctx" style="color:${APPS[S.app].accent}"><span class="dot" style="background:${APPS[S.app].accent}"></span>${APPS[S.app].name}</div>`
    + groups.map(([g,items])=>`<div class="subgrp">${g}</div>`+items.map(([id,lbl])=>`<button class="subtab ${S.tab===id?"active":""}" data-tab="${id}" style="--accent:${APPS[S.app].accent}">${lbl}</button>`).join("")).join("");
  /* crumb + role */
  const crumbEnd = S.fiche
    ? (S.fiche.t==="apprenant" ? "Fiche apprenant · "+(APPRENANTS.find(a=>a.id===S.fiche.id)||{}).nom : "Fiche client · "+(CLIENTS.find(c=>c.id===S.fiche.id)||{}).nom)
    : ((groups.flatMap(g=>g[1]).find(t=>t[0]===S.tab)||["",""])[1]||"");
  $("#crumb").innerHTML=`${APPS[S.app].name}<span class="sep">/</span><span style="color:var(--ink-500);font-weight:500">${crumbEnd}</span>`;
  $("#roleSel").innerHTML=Object.entries(ROLES).map(([id,lbl])=>`<button class="${S.role===id?"active":""}" data-role="${id}">${lbl}</button>`).join("");
  /* content */
  let h="";
  if(S.app==="apprenant") h=pageApprenant();
  else if(S.app==="treso") h=pageTreso();
  else if(S.app==="dash") h=pageDash();
  else if(S.fiche){
    h = S.fiche.t==="apprenant" ? ficheApprenantHtml(S.fiche.id) : ficheClientHtml(S.fiche.id);
  }
  else {
    if(S.tab==="sessions") h=pageSessions();
    else if(S.tab==="inscription") h=pageInscription();
    else if(S.tab==="facturation") h=pageFacturation();
    else if(S.tab==="services") h=pageServices();
    else if(S.tab==="aprendre") h=pageAPrendre();
    else if(S.tab==="utilisateurs") h=pageAnnuaire();
    else h=pageStub(S.tab);
  }
  $("#content").innerHTML=h;
  document.getElementById("modal")?.remove();
  document.getElementById("tplmodal")?.remove();
  if(S.modal){
    const mc=CARDS.find(c=>c.id===S.modal);
    if(mc) document.body.insertAdjacentHTML("beforeend", modalHtml());
    else S.modal=null;
  }
  if(S.tpl) document.body.insertAdjacentHTML("beforeend", tplModalHtml());
  CARDS.forEach(c=>{c.fresh=0;c.newLine=0});
  if(S.highlight){
    const elc=document.getElementById("card-"+S.highlight);
    if(elc){elc.scrollIntoView({block:"center",behavior:"smooth"});elc.style.boxShadow="0 0 0 2px var(--primary)";setTimeout(()=>{elc.style.boxShadow=""},2200)}
    S.highlight=null;
  }
}
/* ── interactions ── */
document.addEventListener("click",e=>{
  if(e.target.id==="tplmodal"||e.target.closest("[data-closetpl]")){S.tpl=null;document.getElementById("tplmodal")?.remove();return}
  const tplBtn=e.target.closest("[data-tpl]");
  if(tplBtn){e.stopPropagation();S.tpl=tplBtn.dataset.tpl;document.getElementById("tplmodal")?.remove();document.body.insertAdjacentHTML("beforeend", tplModalHtml());return}
  if(e.target.closest(".hist summary")){S.histOpen=!S.histOpen}
  if(e.target.id==="modal"||e.target.closest("[data-close]")){S.modal=null;document.getElementById("modal")?.remove();return}
  const t=e.target.closest("[data-app],[data-tab],[data-role],[data-chip],[data-unlock],.task,[data-goto],[data-resa],[data-open],[data-fiche],[data-ficheback],[data-gotoinsc],[data-demande]");
  if(!t) return;
  if(t.dataset.fiche){const [ty,fid]=t.dataset.fiche.split("::");S.modal=null;S.fiche={t:ty,id:fid};S.app="delivia";render();return}
  if(t.dataset.ficheback){S.fiche=null;render();return}
  if(t.dataset.gotoinsc){const c=CARDS.find(x=>x.id===t.dataset.gotoinsc);S.fiche=null;S.modal=null;S.app="delivia";S.tab="inscription";S.fInsc=inscFilterFor(c);S.highlight=c.id;render();return}
  if(t.dataset.app){
    if(t.dataset.app===S.app) return;
    const a=t.dataset.app;
    document.documentElement.style.setProperty("--accent2", APPS[a].accent);
    $("#authT1").textContent="Connexion à "+APPS[a].name;
    $("#auth").style.display="flex";
    setTimeout(()=>{ $("#auth").style.display="none";
      S.app=a; S.fiche=null;
      S.tab = a==="delivia" ? (DELIVIA_TABS[S.role][0][1][0][0]) : (APP_TABS[a]?APP_TABS[a][0][1][0][0]:"");
      render();
    },750);
    return;
  }
  if(t.dataset.tab){S.tab=t.dataset.tab;S.fiche=null;render();return}
  if(t.dataset.role){
    S.role=t.dataset.role; S.app="delivia"; S.fiche=null;
    S.tab=DELIVIA_TABS[S.role][0][1][0][0];
    if(S.role==="setter"||S.role==="agence") S.tab="facturation";
    S.fFact = S.role==="closer"?"fp_ent":"cpf";
    render();return}
  if(t.dataset.chip){const [k,v]=t.dataset.chip.split("::");S[k]=v;render();return}
  if(t.dataset.unlock){const [kb,col]=t.dataset.unlock.split("::");unlockCol(kb,col);return}
  if(t.dataset.goto){S.app="delivia";S.tab="facturation";S.fiche=null;S.modal=null;
    const c=CARDS.find(x=>x.id===t.dataset.goto);
    S.fFact = c.kb==="fact_cpf"?"cpf":c.kb==="fact_opco"?"opco":(c.fin==="fp_part"?"fp_part":"fp_ent");
    S.highlight=c.id;render();return}
  if(t.dataset.resa){toast(`Place réservée pour votre client : elle est bloquée <b>48 h</b>. L'inscription ARD doit être soumise avant expiration.`);return}
  if(t.dataset.demande){toast(`Demande envoyée pour <b>${t.dataset.demande}</b> : France IA doit la valider. Vous serez notifié.`);return}
  if(t.dataset.ech!==undefined&&t.dataset.ech!==""){clickEch(t.dataset.ech,parseInt(t.dataset.j));return}
  if(t.classList.contains("task")&&t.dataset.c){clickTask(t.dataset.c,t.dataset.col,parseInt(t.dataset.i));return}
  if(t.dataset.open){S.modal=t.dataset.open;render();return}
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;
  if(S.tpl){S.tpl=null;document.getElementById("tplmodal")?.remove();return}
  if(S.modal){S.modal=null;document.getElementById("modal")?.remove()}});
render();
toast("Bienvenue dans le mockup <b>DELIV'IA 2.0</b>. Changez de vision en haut à droite, cochez les tâches pour voir les cartes avancer et les cartes facturation naître.");
</script>
</body>
</html>
