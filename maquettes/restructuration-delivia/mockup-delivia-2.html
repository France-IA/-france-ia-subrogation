        <div class="fld"><div class="k">Places maximum affichées (plafond fictif)</div><div class="v swrow">${!ard?`<span>${c.plafond||sc.cap}</span>`:edp?`<input class="edin" id="plafondIn" type="number" value="${c.plafond||sc.cap}" style="width:90px;margin:0"><button class="btn btn-p" data-plafondsave="${c.id}">Enregistrer</button><button class="btn btn-s" data-plafondcancel="1">Annuler</button>`:`<span>${c.plafond||sc.cap}</span><a class="ilink" data-plafondedit="${c.id}">Modifier</a>`}</div></div>

  const cmp=(get)=>(a,b)=>{const x=get(a),y=get(b);return (x>y?1:x<y?-1:0)*sd};
  h+=`<div class="fsec">`;
  if(f==="clients"){
    const list=CLIENTS.filter(c=>q.every(w=>sansAcc([c.nom,c.type,c.resp&&c.resp.n,c.resp&&c.resp.e,(c.apprenants||[]).map(id=>(APPRENANTS.find(a=>a.id===id)||{}).nom).join(" ")].filter(Boolean).join(" ")).includes(w)));
    const get=c=>sk==="cree"?c.cree:sk==="type"?c.type:c.nom.toLowerCase();
    h+=`<div class="tblwrap"><table class="tbl"><thead><tr>${th("nom","Client")}<th>Apprenants</th>${th("type","Type")}${th("cree","Date de création")}<th>Fiche</th></tr></thead><tbody>`
      +[...list].sort(cmp(get)).map(c=>`<tr><td><b>${c.nom}</b></td><td>${(c.apprenants||[]).length}</td><td>${c.type}</td><td>${fmtJour(c.cree)}</td><td><a class="ilink" data-fiche="client::${c.id}">Fiche client</a></td></tr>`).join("")
      +`</tbody></table></div>`;
  } else {
    const nomCl=a=>{const cl=CLIENTS.find(c=>c.id===a.client);return cl?cl.nom:""};
    const list=APPRENANTS.filter(a=>q.every(w=>sansAcc([a.nom,a.email||"",nomCl(a),a.type||""].join(" ")).includes(w)));
    const get=a=>sk==="cree"?a.cree:sk==="type"?String(a.type||""):sk==="client"?nomCl(a).toLowerCase():a.nom.toLowerCase();
    h+=`<div class="tblwrap"><table class="tbl"><thead><tr>${th("nom","Apprenant")}${th("client","Client")}${th("type","Type")}${th("cree","Date de création")}<th>Fiches</th></tr></thead><tbody>`
      +[...list].sort(cmp(get)).map(a=>{const cl=CLIENTS.find(c=>c.id===a.client);
        const type=String(a.type||"").startsWith("Salarié")?"Salarié":"Particulier";
        return `<tr><td><b>${a.nom}</b></td><td>${cl?cl.nom:'<span class="muted">aucun</span>'}</td><td>${type}</td><td>${fmtJour(a.cree)}</td><td class="acts"><a class="ilink" data-fiche="apprenant::${a.id}">Fiche apprenant</a>${cl?`<a class="ilink" data-fiche="client::${cl.id}">Fiche client</a>`:""}</td></tr>`}).join("")
      +`</tbody></table></div>`;
  }
  return h+`</div>`;
}

function sessStage(sess){
  const s=CARDS.find(c=>c.kb==="session_fia"&&c.sess===sess); if(!s) return 0;
  return {brouillon:0,prete:0,demarree:1,enformation:2,preuves:3,terminee:3}[s.col]??0;
}
function preuveState(item, insc, stage){
  if(insc){ if(item.cpf&&insc.fin!=="cpf") return "na"; if(item.noncpf&&insc.fin==="cpf") return "na"; if(insc.col==="absent"&&item.at>=2) return "ko"; }
  return stage>=item.at ? "ok" : "later";
}
const PSTATE={ok:["✓","ok","disponible"],later:["○","later","à venir"],na:["–","na","non applicable"],ko:["✕","ko","absent"]};
function intraStage(c){ return {demande:0,engage:0,convention:1,preparer:1,enformation:2,termine:3,lost:0}[c.col]??0; }
function preuvesSessionHtml(ref){
  const c=typeof ref==="string" ? CARDS.find(x=>x.kb==="session_fia"&&x.sess===ref) : ref;
  if(!c) return "";
  const isIntra=c.kb==="intra";
  const stage=isIntra?intraStage(c):sessStage(c.sess);
  const q=(S.fPreuvesQ||"").toLowerCase();
  let aps;
  if(isIntra){
    const {cl,aps:list}=peopleFor(c);
    aps=list.map(a=>({insc:c,ap:a,cl}));
  } else {
    const inscs=CARDS.filter(i=>i.kb==="insc"&&i.sess===c.sess&&i.col!=="lost"&&!i.reserved);
    aps=inscs.map(i=>{const {cl,aps:a}=peopleFor(i);return {insc:i,ap:a[0],cl}}).filter(x=>x.ap);
  }
  aps=aps.filter(x=>!q||[x.ap.nom,x.cl&&x.cl.nom,c.title,c.lieu,c.frm].join(" ").toLowerCase().includes(q));
  if(q&&!aps.length&&![c.title,c.lieu,c.frm].join(" ").toLowerCase().includes(q)) return null;
  const items=PREUVES.apprenant.flatMap(g=>g.items);
  let tot=0,ok=0;
  aps.forEach(x=>items.forEach(it=>{const st=preuveState(it,x.insc,stage);if(st!=="na"){tot++;if(st==="ok")ok++;}}));
  PREUVES.session.flatMap(g=>g.items).forEach(it=>{tot++;if(preuveState(it,null,stage)==="ok")ok++;});
  const pct=tot?Math.round(ok/tot*100):0;
  const k="pv-"+c.id;
  let h=`<details class="acc pvs" data-acc="${k}" ${accKey(k)?"open":""}><summary><span class="chev">▶</span><span class="tt">${fmtDates(c)||c.title} · ${c.frm||"formateur à confirmer"}</span><span class="sm">${c.lieu}</span><span class="end"><span class="sm">${aps.length} apprenant${aps.length>1?"s":""}</span><span class="pvpct">${pct} %</span></span></summary><div class="inner" style="padding-left:2px">`;
  const nc=aps.length||1;
  h+=`<div style="overflow-x:auto"><table class="pmat"><thead>`
   +`<tr><th class="pl">Client</th>`+aps.map(x=>`<th>${x.cl?`<a class="ilink" data-fiche="client::${x.cl.id}">${x.cl.nom}</a>`:"—"}</th>`).join("")+`</tr>`
   +`<tr><th class="pl">Apprenant</th>`+aps.map(x=>`<th><a class="ilink" data-fiche="apprenant::${x.ap.id}">${x.ap.nom}</a></th>`).join("")+`</tr>`
   +`<tr><th class="pl">Mode de paiement</th>`+aps.map(x=>`<th><span class="fintxt">${FIN[x.insc.fin]?FIN[x.insc.fin].lbl:""}</span></th>`).join("")+`</tr>`
   +`</thead><tbody>`;
  /* 1 · preuves individuelles, groupées par endroit comme sur la fiche apprenant */
  h+=`<tr class="pmsec"><td colspan="${nc+1}">Preuves individuelles</td></tr>`;
  PREUVES.apprenant.forEach(g=>{
    h+=`<tr class="pmgrp"><td colspan="${nc+1}">${g.lieu}</td></tr>`;
    g.items.forEach(it=>{
      if(aps.length&&aps.every(x=>preuveState(it,x.insc,stage)==="na")) return;
      h+=`<tr><td class="pl"><div class="pn">${it.n}${it.cpf?' <span class="badge b-cpf">CPF</span>':""}</div></td>`;
      h+=aps.map(x=>{const st=preuveState(it,x.insc,stage);const pp=PSTATE[st];return `<td><i class="pst ${pp[1]}" title="${x.ap.nom} · ${pp[2]}">${pp[0]}</i></td>`}).join("")||`<td>—</td>`;
      h+=`</tr>`;
    });
  });
  /* 2 · preuves de la session : un seul état pour tout le monde, avec le lien de l'endroit où elles vivent */
  h+=`<tr class="pmsec sep"><td colspan="${nc+1}">Preuves de la session</td></tr>`;
  PREUVES.session.forEach(g=>g.items.forEach(it=>{const st=preuveState(it,null,stage);const pp=PSTATE[st];
    const lien = it.n.startsWith("CV")||it.n.startsWith("Contrat") ? `<a class="ilink" data-frmfiche="${c.frm||""}">fiche formateur</a>`
      : it.n.startsWith("Conversation") ? `<a class="ilink" data-wa="${c.id}">ouvrir l'export</a>` : "";

  h+=`</tbody></table></div></div></details>`;
  return {h,ok,tot,pct,n:aps.length};
}

function lieuLink(lieu,ap,cl){

/* ── page de ressource : un document DELIV'IA, éditable par blocs ── */
function resPageHtml(slug){
  const p=resPage(slug), ed=S.resPageEdit===slug;
  const adm=S.role==="admin";
  let h=`<button class="backbtn" data-respageback="1">← Retour aux ressources</button>`;
  h+=`<div class="docpage">
    <div class="dp-head">
      <div>${ed?`<input class="dp-title-in" id="dpTitle" value="${p.t.replace(/"/g,"&quot;")}">`:`<h1>${p.t}</h1>`}
      <div class="dp-meta">Page DELIV'IA · mise à jour le ${p.maj}</div></div>
      <div class="dp-act">${!adm?"":ed
        ? `<button class="btn btn-p" data-respagesave="${slug}">Enregistrer</button><button class="btn btn-s" data-respagecancel="1">Annuler</button>`
        : `<button class="btn btn-s" data-respageedit="${slug}">Modifier</button>`}</div>
    </div>`;
  h+=`<div class="dp-body ${ed?"editing":""}">`;
  h+=p.blocs.map((b,i)=>{
    const del=ed?`<button class="dp-del" data-resblocdel="${slug}::${i}" title="Supprimer ce bloc">✕</button>`:"";
    const at=ed?` contenteditable="true" data-bl="${i}"`:"";
    if(b.t==="h2")     return `<div class="dp-bloc"><h2 class="dp-h2"${at}>${b.x}</h2>${del}</div>`;
    if(b.t==="li")     return `<div class="dp-bloc"><div class="dp-li"><span class="dp-pt">•</span><span class="dp-tx"${at}>${b.x}</span></div>${del}</div>`;
    if(b.t==="todo")   return `<div class="dp-bloc"><div class="dp-li"><span class="dp-box"></span><span class="dp-tx"${at}>${b.x}</span></div>${del}</div>`;
    if(b.t==="callout")return `<div class="dp-bloc"><div class="dp-callout"><span class="dp-ico">${ICO.file}</span><span class="dp-tx"${at}>${b.x}</span></div>${del}</div>`;
    if(b.t==="video")  return `<div class="dp-bloc"><div class="dp-video"><span class="dp-play">▶</span></div><div class="dp-cap"${at}>${b.x}</div>${del}</div>`;
    if(b.t==="embed")  return `<div class="dp-bloc"><div class="dp-embed">Contenu intégré</div><div class="dp-cap"${at}>${b.x}</div>${del}</div>`;
    return `<div class="dp-bloc"><p class="dp-p"${at}>${b.x}</p>${del}</div>`;
  }).join("");
  h+=`</div>`;
  if(ed) h+=`<div class="dp-add"><span class="k">Ajouter un bloc</span>`
    +[["p","Texte"],["h2","Titre"],["li","Puce"],["todo","Case à cocher"],["video","Vidéo"],["callout","Rappel"],["embed","Intégration"]]
      .map(([t,l])=>`<button class="btn btn-s" data-resblocadd="${slug}::${t}">+ ${l}</button>`).join("")+`</div>`;
  h+=`<div class="dp-foot">Éditeur par blocs embarqué dans DELIV'IA (brique open source BlockNote, celle des ateliers de l'espace apprenant) : on écrit, on colle une vidéo, on réordonne. Le contenu vit dans DELIV'IA, plus sur un Notion externe.</div>`;
  return h+`</div>`;
}

function render(){
  /* sélecteur d'application : un seul bouton, qui porte le nom de l'application ouverte */

    : `<button class="appsw" style="cursor:default"><span class="dot" style="background:${appCur.color}"></span><span class="nm">${appCur.name}</span></button>`);
  /* subnav */
  const groups = S.app==="delivia" ? DELIVIA_TABS[S.role] : (APP_TABS[S.app]||[]);

        }

  /* crumb + role */
  const crumbEnd = S.fiche
    ? (S.fiche.t==="apprenant" ? "Fiche apprenant · "+(APPRENANTS.find(a=>a.id===S.fiche.id)||{}).nom : "Fiche client · "+(CLIENTS.find(c=>c.id===S.fiche.id)||{}).nom)
    : ((groups.flatMap(g=>g[1]).find(t=>t[0]===S.tab&&t[0]!=="#sub")||["",""])[1]||"");
  const crumbEnd2 = S.fiche&&S.fiche.t==="session" ? "Fiche session · "+(CARDS.find(c=>c.id===S.fiche.id)||{}).title : S.fiche&&S.fiche.t==="compte" ? "Annuaire · "+(COMPTES.find(c=>c.id===S.fiche.id)||{}).nom : S.fiche&&S.fiche.t==="formateur" ? "Fiche formateur · "+((FRM[S.fiche.id]||{}).nom||"") : crumbEnd;
  $("#crumb").innerHTML=`${APPS[S.app].name}<span class="sep">/</span><span style="color:var(--ink-500);font-weight:500">${crumbEnd2}</span>`;
  $("#roleSel").innerHTML=Object.entries(ROLES).map(([id,lbl])=>`<button class="${S.role===id?"active":""}" data-role="${id}">${lbl}</button>`).join("");
  /* bouton Voir comme (réel : réservé aux admins), bannière de vision, menu utilisateur */

    +`<button data-voircomme="${role}">Vue par défaut</button>`
    +gens.map(g=>`<button data-voircomme="${role}::${g}">${g}</button>`).join("")+`</div>`;
  $("#topright").innerHTML = realAdmin && !S.voirComme ? `<div class="vcbtn" data-vcopen="1">${ICO.eye}Voir comme<span class="chev">▼</span><div class="vcmenu" id="vcmenu">`
    +vcGroupe("closer","Closeurs",COMPTES.filter(u=>u.role==="closer").map(u=>u.nom))
    +vcGroupe("setter","Setteurs",COMPTES.filter(u=>u.role==="setter").map(u=>u.nom))
    +vcGroupe("formateur","Formateurs",FORMATEURS.map(k=>FRM[k].nom))
    +`</div></div>` : "";
  $("#visionbanner").innerHTML = S.voirComme ? `${ICO.eye}<span>Vision <b>${ROLES[S.voirComme]}${S.voirQui?" · "+S.voirQui:""}</b> : tu vois DELIV'IA exactement comme ce rôle (navigation, pages, droits).</span><button data-vcback="1">Revenir en admin</button>` : "";
  const U=USERS[S.realRole];
  $("#usermenu").innerHTML=`<span class="avat">${initiales(U.n)}</span><div><div class="un">${U.n}</div><div class="ue">${U.e}</div></div><button class="out" data-logout="1" title="Déconnexion">${ICO.out}</button>`;
  /* content */
  let h="";

  else if(S.fiche){
    h = S.fiche.t==="apprenant" ? ficheApprenantHtml(S.fiche.id) : S.fiche.t==="session" ? ficheSessionHtml(S.fiche.id) : S.fiche.t==="compte" ? ficheCompteHtml(S.fiche.id) : S.fiche.t==="formateur" ? ficheFormateurHtml(S.fiche.id) : ficheClientHtml(S.fiche.id);

  else if(S.resPage) h=resPageHtml(S.resPage);

  else {
    if(S.tab==="sessions") h=pageSessions();
    else if(S.tab==="inscription") h=pageInscription();
    else if(S.tab==="facturation") h=pageFacturation();
    else if(S.tab==="services") h=pageServices();

    else if(S.tab==="clients") h=pageClients();
    else if(S.tab==="equipe") h=pageEquipe();
    else if(S.tab==="anomalies") h=pageAnomalies();

    else if(S.tab==="lieux") h=pageLieuxSalles();

  }
  $("#content").innerHTML=h;
  document.getElementById("modal")?.remove();
  document.getElementById("modal2")?.remove();
  document.getElementById("tplmodal")?.remove();
  if(S.newSess) document.body.insertAdjacentHTML("beforeend", newSessionModalHtml());
  if(S.demandesFor) document.body.insertAdjacentHTML("beforeend", demandesModalHtml());
  if(S.switchFor) document.body.insertAdjacentHTML("beforeend", switchModalHtml());
  if(S.bibbyFor) document.body.insertAdjacentHTML("beforeend", bibbyModalHtml());
  if(S.lieuModal) document.body.insertAdjacentHTML("beforeend", lieuModalHtml());
  if(S.faqModal) document.body.insertAdjacentHTML("beforeend", faqModalHtml());
  if(S.tkEdit) document.body.insertAdjacentHTML("beforeend", tacheModalHtml());
  if(S.tplNew) document.body.insertAdjacentHTML("beforeend", tplNewModalHtml());
  if(S.resNew) document.body.insertAdjacentHTML("beforeend", resModalHtml());
  document.getElementById("modal3")?.remove();
  if(S.photos) document.body.insertAdjacentHTML("beforeend", photosModalHtml());
  if(S.idLink) document.body.insertAdjacentHTML("beforeend", idLinkModalHtml());
  if(S.qard) document.body.insertAdjacentHTML("beforeend", qArdModalHtml());
  if(S.wa) document.body.insertAdjacentHTML("beforeend", waModalHtml());
  if(S.reserveFor) document.body.insertAdjacentHTML("beforeend", reserveModalHtml());
  if(S.remNew) document.body.insertAdjacentHTML("beforeend", remModalHtml());
  if(S.lostFor) document.body.insertAdjacentHTML("beforeend", lostModalHtml());
  if(S.modal){
    const mc=CARDS.find(c=>c.id===S.modal);

    else S.modal=null;
  }
  if(S.tpl) document.body.insertAdjacentHTML("beforeend", tplModalHtml());
  fitBoard();

  CARDS.forEach(c=>{c.fresh=0;c.newLine=0});

    const elc=document.getElementById("card-"+S.highlight);
    if(elc){elc.scrollIntoView({block:"center",behavior:"smooth"});elc.style.boxShadow="0 0 0 2px var(--primary)";setTimeout(()=>{elc.style.boxShadow=""},2200)}
    S.highlight=null;
  }
}
/* le kanban occupe la hauteur restante : chaque colonne défile pour elle-même */
function fitBoard(){
  /* la bande de maquette occupe le haut : l'application prend exactement ce qui reste */
  const app=document.getElementById("app");
  if(app){ const top=app.getBoundingClientRect().top+window.scrollY; app.style.minHeight=Math.max(400, window.innerHeight-top)+"px"; }
  document.querySelectorAll(".board").forEach(bd=>{
    const t=bd.getBoundingClientRect().top+window.scrollY;
    bd.style.height=Math.max(320, window.innerHeight-t+window.scrollY-18)+"px";
  });
}
window.addEventListener("resize",fitBoard);
/* un menu déroulant natif se dimensionne sur son option la plus longue : le chevron se retrouve
   loin du texte. On le ramène à la largeur de l'option réellement choisie. */
function fitSelects(){
  let mes=document.getElementById("selmes");
  if(!mes){mes=document.createElement("span");mes.id="selmes";mes.style.cssText="position:absolute;top:-999px;left:-999px;visibility:hidden;white-space:pre";document.body.appendChild(mes);}
  document.querySelectorAll("select.fsel").forEach(s=>{
    const o=s.options[s.selectedIndex]; if(!o) return;
    const cs=getComputedStyle(s);
    mes.style.font=cs.fontStyle+" "+cs.fontWeight+" "+cs.fontSize+"/"+cs.lineHeight+" "+cs.fontFamily;
    mes.textContent=o.text;
    s.style.width=Math.ceil(mes.getBoundingClientRect().width)+46+"px";
  });
}

    const ta=document.getElementById("tplta"); const lbl=decodeURIComponent(S.tpl); const mode=saveBtn.dataset.tplsave;
    if(ta&&mode==="all"){ TPL_OVERRIDE[lbl]=ta.value; S.tplOnce=null; }
    if(ta&&mode==="one"){ S.tplOnce=ta.value; }
    S.tplEdit=0;document.getElementById("tplmodal")?.remove();document.body.insertAdjacentHTML("beforeend", tplModalHtml());
    toast(mode==="all"?"Template enregistré : il servira à tous les prochains envois."
      :"Message modifié pour cet envoi seulement : le template reste inchangé.");return}
  const tplBtn=e.target.closest("[data-tpl]");
  if(tplBtn){e.stopPropagation();S.tpl=tplBtn.dataset.tpl;S.tplEdit=0;S.tplOnce=null;
    S.tplFrom=tplBtn.closest("#modal")||tplBtn.classList.contains("tag")?"task":"page";
    document.getElementById("tplmodal")?.remove();document.body.insertAdjacentHTML("beforeend", tplModalHtml());return}
  const bk=e.target.closest("[data-bulk]");
  if(bk){e.stopPropagation();const [kind,n]=bk.dataset.bulk.split("::");
    if(kind==="bibby") toast(`<b>Envoi groupé à Bibby</b> : ${n} dossier(s) complets, facture + émargements signés + export EDOF.`);
    else if(kind==="edof") toast(`<b>Import des exports EDOF</b> : dépôt du fichier exporté depuis EDOF, les dossiers sont rapprochés automatiquement.`);

  if(tb){e.stopPropagation();const [c,col,i]=tb.dataset.tbtn.split("::");const cd=CARDS.find(x=>x.id===c);const tk=tasksFor(cd,col)[parseInt(i)];
    if(tk.kind2==="demandes"){S.demandesFor=c;S.demandesTask=[c,col,parseInt(i)];render();return}
    if(tk.kind2==="bibby"){S.bibbyFor=c;S.bibbyTask=[c,col,parseInt(i)];render();return}
    if(!taskState(cd,col,parseInt(i),tk)){toast(`<b>${tk.btn}</b> : ${cd.title}`);clickTask(c,col,parseInt(i));}return}
  const nf=e.target.closest(".navfold>summary");
  if(nf){const d=nf.parentElement;S.navFold[d.dataset.navfold]=!d.open}
  const ms=e.target.closest(".msec2>summary");
  if(ms){const d=ms.parentElement;const k=d.dataset.k;if(k==="hist")S.histOpen=!d.open;else if(k==="cur")S.curOpen=!d.open;else S.futOpen=!d.open}
  if(e.target.id==="modal3"||e.target.closest("[data-close3]")){S.swFull=null;S.photos=null;render();return}
  if(e.target.id==="modal2"||e.target.closest("[data-close2]")){S.demandesFor=null;S.switchFor=null;S.lostFor=null;S.reserveFor=null;S.bibbyFor=null;S.idLink=null;S.qard=null;S.wa=null;S.lieuModal=null;S.faqModal=null;S.espEdit=null;S.photos=null;S.photosEdit=null;S.tkEdit=null;S.tplNew=null;S.resNew=null;S.swFull=null;document.getElementById("modal2")?.remove();document.getElementById("modal3")?.remove();return}
  const anoS=e.target.closest(".ano>summary");
  if(anoS){const d=anoS.parentElement;S.anoOpen=S.anoOpen||{};S.anoOpen[d.dataset.ano]=!d.open}
  const rapS=e.target.closest(".payrap>summary");
  if(rapS){S.rapOpen=!rapS.parentElement.open}
  if(e.target.id==="modal"||e.target.closest("[data-close]")){S.modal=null;S.newSess=null;document.getElementById("modal")?.remove();return}
  const acc=e.target.closest("details.acc>summary, details.pvmonth>summary");

  if(t.dataset.faqnew!==undefined){S.faqModal=1;render();return}

  if(t.dataset.lieuedit){S.lieuModal={kind:"lieu",lieu:t.dataset.lieuedit};render();return}
  if(t.dataset.sallenew){S.lieuModal={kind:"salle",lieu:t.dataset.sallenew};render();return}
  if(t.dataset.salleedit){const [lid,ix]=t.dataset.salleedit.split("::");S.lieuModal={kind:"salle",lieu:lid,salle:parseInt(ix)};render();return}
  if(t.dataset.lieusave){S.lieuModal=null;render();toast(decodeURIComponent(t.dataset.lieusave)+".");return}
  if(t.dataset.copy2){toast(`Identifiant <b>${t.dataset.copy2}</b> copié.`);return}
  if(t.dataset.lieuback){S.lieuFiche=null;render();return}
  if(t.dataset.autolaunch){toast(`<b>${decodeURIComponent(t.dataset.autolaunch)}</b> : lancée à la main, le résultat apparaît dans l'historique et dans les logs.`);return}
  if(t.dataset.anogo){S.tab="anomalies";S.fAno="autre";S.autoFiche=null;render();return}
  if(t.dataset.tpledit){toast(`Éditeur du support <b>${decodeURIComponent(t.dataset.tpledit)}</b> : une version par session, partagée au formateur.`);return}

  if(t.dataset.gen){toast(`<b>${decodeURIComponent(t.dataset.gen)}</b> : le formulaire s'ouvrirait ici, prérempli avec le client choisi.`);return}
  if(t.dataset.rap){e.stopPropagation();

    toast(`Virement de <b>${eur(tx.m)}</b> rapproché${card.fac?" à la facture "+card.fac.num:""} : l'information part dans Qonto, qui tamponne la facture acquittée.`);

  if(t.dataset.rejeu){e.stopPropagation();
    const [cid,j]=t.dataset.rejeu.split("::");

    toast(`Prélèvement de l'échéance <b>${card.ech[parseInt(j)].n}</b> rejoué : réponse de la banque sous 3 jours ouvrés.`);
    return}
  if(t.dataset.bibbydepot){e.stopPropagation();S.bibbyEdof=1;toast(`Export EDOF déposé : le dossier Bibby est complet.`);render();return}
  if(t.dataset.bibbysend){e.stopPropagation();
    const [c,col,i]=S.bibbyTask; S.bibbyFor=null;
    toast(`Dossier envoyé à Bibby : <b>${CARDS.find(x=>x.id===c).title}</b>. Réponse attendue sous 48 h.`);
    clickTask(c,col,i);return}
  if(t.dataset.switch){S.switchFor=t.dataset.switch;S.swFull=null;render();return}
  if(t.dataset.swfull){S.swFull=t.dataset.swfull;render();return}
  if(t.dataset.swcancel!==undefined){S.swFull=null;render();return}
  if(t.dataset.swpast!==undefined){S.swPast=!S.swPast;render();return}
  if(t.dataset.swsort){S.swSort=S.swSort==="desc"?"asc":"desc";render();return}
  if(t.dataset.switchto){const [iid,k]=t.dataset.switchto.split("::");const i=CARDS.find(x=>x.id===iid);i.movedFrom=i.sess;i.sess=k;i.dt=SESS[k].dt;i.lieu=SESS[k].lieu;S.switchFor=null;S.swFull=null;toast(`<b>${i.title}</b> déplacée vers ${SESS[k].lbl}.`);render();return}
  if(t.dataset.lost){S.lostFor=t.dataset.lost;render();return}
  if(t.dataset.lostconfirm){const i=CARDS.find(x=>x.id===t.dataset.lostconfirm);i.col="lost";S.lostFor=null;toast(`<b>${i.title}</b> passée en Lost ; pensez à l'opportunité GHL.`);render();return}
  if(t.dataset.sort){if(S.sortSess===t.dataset.sort)S.sortSessDir=-(S.sortSessDir||1);else{S.sortSess=t.dataset.sort;S.sortSessDir=1;}render();return}
  if(t.dataset.reserve){S.reserveFor=t.dataset.reserve;render();return}
  if(t.dataset.remnew!==undefined){S.remNew={t:"question"};render();return}
  if(t.dataset.remtype){S.remNew={t:t.dataset.remtype};render();return}
  if(t.dataset.remsend){
    const ty=t.dataset.remsend, titre=($("#remTitre")&&$("#remTitre").value.trim())||({question:"Nouvelle question",bug:"Nouveau bug signalé",idee:"Nouvelle idée"})[ty];
    REMONTEES.unshift({t:ty,titre,qui:abrege(USERS[S.role].n),role:ROLES[S.role],v:1,st:"a_traiter",c:0,d:"2026-08-26"});
    S.remNew=null;render();toast(`Votre ${REM_T[ty][0].toLowerCase()} est partie à France IA : elle apparaît dans <b>À traiter</b>.`);return}
  if(t.dataset.reserveconfirm){const c=CARDS.find(x=>x.id===t.dataset.reserveconfirm);const p=(document.getElementById("resPrenom")||{}).value||"Nouveau";const n=(document.getElementById("resNom")||{}).value||"Client";const note=(document.getElementById("resNote")||{}).value||"";
    CARDS.push({id:"r"+Math.floor(performance.now()),kb:"insc",offre:c.offre,sess:c.sess,dt:c.dt,title:p+" "+n,closer:"Alex R.",setter:"Sam T.",ard:null,fin:null,col:"recue",reserved:1,expires:"2026-08-25T10:00",resNote:note});
    S.reserveFor=null;toast(`Place bloquée 48 h pour <b>${p} ${n}</b>.`);render();return}
  if(t.dataset.prolong){const i=CARDS.find(x=>x.id===t.dataset.prolong);i.expires="2026-08-26T16:30";toast("Réservation prolongée de 48 h.");render();return}
  if(t.dataset.cancelres){const i=CARDS.find(x=>x.id===t.dataset.cancelres);const reason=prompt("Raison de l'annulation (obligatoire) :");if(!reason)return;CARDS.splice(CARDS.indexOf(i),1);toast("Réservation annulée, place libérée.");render();return}
  if(t.dataset.plafondedit){S.editPlafond=t.dataset.plafondedit;render();return}
  if(t.dataset.plafondcancel){S.editPlafond=null;render();return}
  if(t.dataset.plafondsave){const c=CARDS.find(x=>x.id===t.dataset.plafondsave);c.plafond=parseInt(document.getElementById("plafondIn").value)||c.cap;S.editPlafond=null;toast("Plafond ARD enregistré : "+c.plafond+" places affichées.");render();return}
  if(t.dataset.ardtoggle){const c=CARDS.find(x=>x.id===t.dataset.ardtoggle);c.ardVisible=c.ardVisible===false;toast(c.ardVisible?"Session visible sur ARD.":"Session masquée sur ARD.");render();return}
  if(t.dataset.espace){toast("Ouverture de l'espace client / apprenant dans un nouvel onglet.");return}
  if(t.dataset.delsession){if(confirm("Supprimer cette session ? Les inscriptions payées bloqueront la suppression dans la vraie application.")){const c=CARDS.find(x=>x.id===t.dataset.delsession);CARDS.splice(CARDS.indexOf(c),1);S.fiche=null;toast("Session supprimée.");render();}return}
  if(t.dataset.copy){toast("Lien copié dans le presse-papier.");return}
  if(t.dataset.acctoggle){const [uid,pid]=t.dataset.acctoggle.split("::");const u=COMPTES.find(x=>x.id===uid);u.acces=u.acces||[];const ix=u.acces.indexOf(pid);if(ix>=0)u.acces.splice(ix,1);else u.acces.push(pid);toast(`Accès <b>${PAGES_ACCES.find(p=>p[0]===pid)[1]}</b> ${ix>=0?"retiré":"accordé"} à ${u.nom}.`);render();return}
  if(t.dataset.apptoggle){const [uid,aid]=t.dataset.apptoggle.split("::");const u=COMPTES.find(x=>x.id===uid);u.apps=u.apps||[];const ix=u.apps.indexOf(aid);if(ix>=0)u.apps.splice(ix,1);else u.apps.push(aid);render();return}
  if(t.dataset.syncdrive){toast("Synchronisation avec le Drive lancée : les preuves déposées hors DELIV'IA seront reconnues dans quelques minutes.");return}
  if(t.dataset.vcback){S.voirComme=null; S.voirQui=null; S.role=S.realRole; S.app="delivia"; S.fiche=null; S.modal=null; S.tab=DELIVIA_TABS[S.role][0][1][0][0]; S.fFact="cpf"; render(); return}
  if(t.dataset.logout){toast("Déconnexion : retour à l'écran de connexion SSO France IA."); return}
  if(t.dataset.gs){const [ty,id]=t.dataset.gs.split("::"); closeSearch();
    if(ty==="apprenant"||ty==="client"){S.modal=null;S.fiche={t:ty,id};S.app="delivia";render();}
    else if(ty==="session"){S.app="delivia";S.tab="sessions";S.modal=null;S.fiche={t:"session",id};render();}
    return}

    S.role=t.dataset.role; S.realRole=t.dataset.role; S.voirComme=null; S.app="delivia"; S.fiche=null; S.modal=null;

    if(S.role==="setter") S.tab="facturation";
    S.fFact = S.role==="closer"?"virement":S.role==="setter"?"setteur":"cpf";
    S.fFactOffre="all"; S.fInscMode="all";
    if(!["n1","n2"].includes(S.fSession)) S.fSession="n1";
    render();return}
  if(t.dataset.chip){const [k,v]=t.dataset.chip.split("::");
    if(k==="railOffre"&&S.rail){S.rail={...S.rail,offre:v};S.railCas=null;render();return}
    /* filtres sans option « tout » : recliquer sur le filtre actif l'enlève */
    if(["fRemT","fRemS"].includes(k)&&S[k]===v){S[k]="tout";render();return}
    S[k]=v;render();return}
  if(t.dataset.goto){S.app="delivia";S.tab="facturation";S.fiche=null;S.modal=null;
    const c=CARDS.find(x=>x.id===t.dataset.goto);
    S.fFact=factFilterFor(c); S.fFactOffre="all";
    S.highlight=c.id;render();return}
  if(t.dataset.resa){S.reserveFor=t.dataset.resa;render();return}
  if(t.dataset.demande){toast(`Demande envoyée pour <b>${t.dataset.demande}</b> : France IA doit la valider. Vous serez notifié.`);return}

  if(t.dataset.open){
    S.futOpen=false; S.histOpen=false; S.curOpen=true;S.modal=t.dataset.open;render();return}

document.addEventListener("input",e=>{const ta=e.target.closest("[data-note]");if(!ta)return;const o=CLIENTS.find(c=>c.id===ta.dataset.note)||APPRENANTS.find(a=>a.id===ta.dataset.note)||CARDS.find(c=>c.id===ta.dataset.note);if(o)o.note=ta.value;});
/* recherche globale */
function openSearch(){$("#smodal").style.display="block";const i=$("#gsearchIn");i.value="";$("#gsearchRes").innerHTML="";setTimeout(()=>i.focus(),10);}
function closeSearch(){$("#smodal").style.display="none";}
function gsearch(q){
  q=q.trim().toLowerCase(); const box=$("#gsearchRes");
  if(q.length<2){box.innerHTML="";return}
  const norm=x=>(x||"").toLowerCase();
  const aps=APPRENANTS.filter(a=>norm(a.nom).includes(q)||norm(a.email).includes(q)).slice(0,5);
  const cls=CLIENTS.filter(c=>norm(c.nom).includes(q)||norm(c.siret).includes(q)).slice(0,5);
  const sess=CARDS.filter(c=>c.kb==="session_fia"&&(norm(c.title).includes(q)||norm(c.lieu).includes(q)||norm(c.frm).includes(q))).slice(0,5);
  let h="";
  if(aps.length) h+=`<div class="grp">Apprenants</div>`+aps.map(a=>`<div class="it" data-gs="apprenant::${a.id}"><span class="avat" style="width:22px;height:22px;font-size:9px;border-radius:999px">${initiales(a.nom)}</span>${a.nom}<span class="sm">${a.email}</span></div>`).join("");
  if(cls.length) h+=`<div class="grp">Clients</div>`+cls.map(c=>`<div class="it" data-gs="client::${c.id}"><span class="avat" style="width:22px;height:22px;font-size:9px;border-radius:999px">${c.type.startsWith("Particulier")?initiales(c.nom):"🏢"}</span>${c.nom}<span class="sm">${c.type}</span></div>`).join("");
  if(sess.length) h+=`<div class="grp">Sessions</div>`+sess.map(c=>`<div class="it" data-gs="session::${c.id}">📅 ${c.title}<span class="sm">${c.lieu}</span></div>`).join("");
  box.innerHTML=h||`<div class="none">Aucun résultat</div>`;
}
document.getElementById("gsearchIn").addEventListener("input",e=>gsearch(e.target.value));
document.addEventListener("change",e=>{const sel=e.target.closest("[data-fsel]");if(sel){S[sel.dataset.fsel]=sel.value;render();}});
let fqTimer=null;
document.addEventListener("input",e=>{const inp=e.target.closest("[data-fq]");if(!inp)return;const k=inp.dataset.fq;const v=inp.value;clearTimeout(fqTimer);fqTimer=setTimeout(()=>{S[k]=v;render();const again=document.querySelector(`[data-fq="${k}"]`);if(again){again.focus();again.setSelectionRange(v.length,v.length);}},250);});

document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch();return}
  if(e.key!=="Escape")return;
  if($("#smodal").style.display==="block"){closeSearch();return}
  if(S.tpl){S.tpl=null;document.getElementById("tplmodal")?.remove();return}
  if(S.modal){S.modal=null;document.getElementById("modal")?.remove()}});
render();
</script>
