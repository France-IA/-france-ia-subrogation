<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELIV'IA 2.0 · Plateforme France IA (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc; --surface:#fff; --ink-900:#0f172a; --ink-800:#1e293b; --ink-700:#334155;
  --ink-500:#64748b; --ink-400:#94a3b8; --ink-300:#cbd5e1;
  --line:#f1f5f9; --line-2:#e2e8f0;
  --primary:#4f46e5; --primary-dark:#4338ca; --primary-50:#eef2ff;
  --ok:#059669; --ok-50:#ecfdf5; --warn:#d97706; --warn-50:#fffbeb;
  --err:#e11d48; --err-50:#fff1f2; --info:#2563eb; --info-50:#eff6ff;
  --sh-carte:0 1px 3px 0 rgb(0 0 0/.04),0 1px 2px -1px rgb(0 0 0/.04);
  --sh-hover:0 4px 6px -1px rgb(0 0 0/.06),0 2px 4px -2px rgb(0 0 0/.04);
  --app-delivia:#4f46e5; --app-apprenant:#0284c7; --app-treso:#059669; --app-dash:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink-800);font-size:14px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{display:flex;min-height:100vh}
/* ── Sidebar plateforme ─────────────────────────── */
#sidebar{width:248px;flex-shrink:0;background:#fff;box-shadow:1px 0 0 0 var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
#appzone{margin:4px 10px 2px;padding:7px 6px 6px;background:#e2e8f0;border-radius:14px}
.brand{padding:18px 20px 10px}
.brand .word{font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--ink-900)}
.brand .word em{font-style:italic;font-weight:700}
.brand .tri{display:flex;height:3px;width:64px;margin-top:5px;border-radius:2px;overflow:hidden}
.brand .tri i{flex:1}.brand .tri i:nth-child(1){background:#4379f2}.brand .tri i:nth-child(2){background:#eef0f4}.brand .tri i:nth-child(3){background:#f21b1b}
.brand .plt{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400);margin-top:7px;font-weight:500}
.nav-label{padding:4px 12px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-900)}
.apptab{display:flex;align-items:center;gap:10px;width:100%;margin:1px 0;padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink-700);text-align:left;transition:background .12s,color .12s,box-shadow .12s}
.apptab:hover{background:rgba(255,255,255,.55);color:var(--ink-900)}
.apptab .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.apptab.active{background:#fff;color:var(--ink-900);font-weight:600;box-shadow:var(--sh-carte)}
.apptab .lock{margin-left:auto;font-size:10px;color:var(--ink-400)}
#subnav{padding-bottom:8px;padding-top:6px}
#subnav .appctx{padding:10px 20px 2px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
#subnav .appctx .dot{width:7px;height:7px;border-radius:50%}
.subgrp{padding:12px 20px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400)}
.subtab{display:flex;align-items:center;gap:8px;width:calc(100% - 28px);margin:1px 8px 1px 20px;padding:6px 11px;border-radius:7px;font-size:13px;color:var(--ink-500);text-align:left}
.subtab:hover{background:var(--bg);color:var(--ink-700)}
.subtab.active{background:var(--bg);color:var(--ink-900);font-weight:600}
.subtab.active::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent,#4f46e5);margin-left:-8px;margin-right:5px}
.side-note{margin-top:auto;padding:14px 20px;font-size:11px;color:var(--ink-400);border-top:1px solid var(--line);line-height:1.5}
/* ── Topbar ─────────────────────────────────────── */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:52px;background:#fff;box-shadow:0 1px 0 0 var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:30}
#crumb{font-size:14px;font-weight:600;color:var(--ink-900)}
#crumb .sep{color:var(--ink-300);font-weight:400;margin:0 6px}
#roleWrap{margin-left:auto;display:flex;align-items:center;gap:8px}
#roleWrap .lbl{font-size:11px;color:var(--ink-400)}
.rolesel{display:flex;gap:2px;background:#f1f5f9;padding:3px;border-radius:8px}
.rolesel button{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink-500)}
.rolesel button.active{background:#fff;color:var(--ink-900);font-weight:600;box-shadow:var(--sh-carte)}
#content{flex:1;padding:20px 24px 60px}
.pagehead{margin-bottom:14px}
.pagehead h1{font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--ink-900)}
.pagehead p{font-size:13px;color:var(--ink-500);margin-top:3px;max-width:760px}
/* filtres */
.chips{display:inline-flex;align-items:center;gap:4px;background:#f1f5f9;padding:5px;border-radius:9px;margin:2px 10px 14px 0;flex-wrap:wrap}
.chips .grp{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-400);font-weight:600;padding:0 6px}
.chips button{padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-500)}
.chips button.active{background:#fff;color:var(--ink-900);font-weight:600;box-shadow:var(--sh-carte)}
/* ── Kanban ─────────────────────────────────────── */
.kb-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-900);margin:18px 0 10px}
.kb-title .who{font-size:11px;font-weight:500;color:var(--ink-400)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{width:272px;flex-shrink:0;background:rgba(248,250,252,.9);border:1px solid var(--line);border-radius:12px;padding:10px}
.col-h{display:flex;align-items:center;gap:7px;padding:2px 4px 8px}
.col-h .pill{width:8px;height:8px;border-radius:50%;background:var(--ink-400);flex-shrink:0}
.col-h h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-500)}
.col-h .n{margin-left:auto;font-size:11px;color:var(--ink-400);font-variant-numeric:tabular-nums}
.col-open{font-size:10.5px;color:var(--info);background:var(--info-50);border-radius:6px;padding:4px 8px;margin:0 2px 8px;display:block;line-height:1.45}
.col-open a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.col.locked{background:repeating-linear-gradient(-45deg,#f8fafc 0 10px,#f4f6f9 10px 11px);border-style:dashed;border-color:var(--line-2)}
.col.locked .col-h h3{color:var(--ink-400)}
.col.locked .card{opacity:.55;filter:grayscale(.5)}
.col.locked .card:hover{opacity:.8}
.lockbar{font-size:10.5px;color:var(--ink-500);background:#eef1f5;border-radius:6px;padding:5px 8px;margin:0 2px 8px;display:flex;align-items:center;gap:6px;line-height:1.35}
.lockbar button{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--primary);white-space:nowrap}
.lockbar button:hover{text-decoration:underline;text-underline-offset:2px}
.card.waitlock{background:#fbfcfd}
.card.waitlock .t{color:var(--ink-500)}
.lockstrip{margin:-9px -11px 9px;padding:6px 12px;background:#f1f5f9;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-500);line-height:1.35}
.lockstrip b{color:var(--ink-700);font-weight:600}
.lockstrip .dim{color:var(--ink-400)}
.lockstrip a{margin-left:auto;color:var(--primary);font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.lockstrip a:hover{text-decoration:underline;text-underline-offset:2px}
.card.haslock > *:not(.lockstrip){opacity:.72}
.openline{margin-top:9px;font-size:11px;color:var(--ink-500);background:#eef1f5;border-radius:6px;padding:5px 8px;display:flex;gap:6px;align-items:center;line-height:1.4}
.openline b{color:var(--ink-700);font-weight:600}
.openline a{color:var(--primary);font-weight:600;cursor:pointer;margin-left:auto;font-size:10.5px;white-space:nowrap}
.openline a:hover{text-decoration:underline;text-underline-offset:2px}
.card{background:#fff;border-radius:10px;box-shadow:var(--sh-carte);padding:9px 11px;margin-bottom:9px;position:relative;transition:box-shadow .15s,opacity .3s,transform .3s}
.card:hover{box-shadow:var(--sh-hover)}
.card.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.card .t{font-size:13.5px;font-weight:600;color:var(--ink-900)}
.card .s{font-size:11px;color:var(--ink-400);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1.5px 8px;font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums}
.b-cpf{background:var(--info-50);color:var(--info)} .bar-cpf{background:#3b82f6}
.b-opco{background:#fff7ed;color:#ea580c} .bar-opco{background:#f97316}
.b-vir{background:var(--ok-50);color:var(--ok)} .bar-vir{background:#10b981}
.b-mandat{background:#faf5ff;color:#9333ea} .bar-mandat{background:#a855f7}
.b-wait{background:var(--warn-50);color:var(--warn)}
.b-neutral{background:#f1f5f9;color:var(--ink-500)}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tasks{margin-top:9px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.tgrp{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);margin:5px 0 2px}
.tor{display:flex;align-items:center;gap:8px;color:var(--ink-300);font-size:10px;font-weight:600;margin:4px 0}
.tor::before,.tor::after{content:"";flex:1;height:1px;background:var(--line-2)}
.task{display:flex;align-items:flex-start;gap:7px;padding:3px 2px;border-radius:6px;font-size:12px;line-height:1.4;color:var(--ink-700);cursor:pointer}
.task:hover{background:var(--bg)}
.task .box{width:14px;height:14px;border:1.5px solid var(--ink-300);border-radius:4px;flex-shrink:0;margin-top:1.5px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.task.done .box{background:var(--primary);border-color:var(--primary)}
.task.done .box::after{content:"";width:8px;height:4.5px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;transform:rotate(-45deg) translate(0.5px,-1px)}
.task.done .lbl{color:var(--ink-400);text-decoration:line-through}
.task.other{color:var(--ink-400)}
.task.other .box{border-color:var(--line-2);background:var(--bg)}
.task.other.done .box{background:var(--ink-300);border-color:var(--ink-300)}
.task .tag{font-size:10px;color:#92400e;background:var(--warn-50);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.task .tag:hover{border-color:#fcd34d;text-decoration:underline;text-underline-offset:2px}
/* popup template */
#tplmodal{position:fixed;inset:0;background:rgba(15,23,42,.3);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
#tplmodal .mbox{max-width:430px}
.tpl-canal{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:600;background:var(--ok-50);color:var(--ok)}
.tpl-body{background:#f8fafc;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.65;color:var(--ink-700);white-space:pre-line}
.tpl-body .var{background:var(--primary-50);color:var(--primary-dark);border-radius:4px;padding:0 4px;font-size:12px;font-weight:500}
.tpl-note{font-size:11px;color:var(--ink-400);margin-top:10px;line-height:1.5}
/* fiches apprenant & client */
.backbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-500);margin-bottom:12px;cursor:pointer;border-radius:6px;padding:4px 8px}
.backbtn:hover{background:#f1f5f9;color:var(--ink-700)}
.fichehead{background:#fff;border-radius:12px;box-shadow:var(--sh-carte);padding:20px 22px;margin-bottom:14px}
.fh-top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.avat{width:40px;height:40px;border-radius:10px;background:var(--primary-50);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.avat svg{width:19px;height:19px}
.fichehead h1{font-size:19px;font-weight:600;letter-spacing:-.015em;color:var(--ink-900);line-height:1.25}
.fh-contact{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--ink-500)}
.fh-contact span{display:inline-flex;align-items:center;gap:5px}
.fh-contact svg{color:var(--ink-400)}
.fh-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fh-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fh-link{font-size:12px;font-weight:600;color:var(--primary);cursor:pointer;white-space:nowrap}
.fh-link:hover{text-decoration:underline;text-underline-offset:2px}
.apercu{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.apercu .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600}
.apercu .v{font-size:13px;font-weight:600;color:var(--ink-900);margin-top:4px;line-height:1.4}
.apercu .v .sm{font-weight:400;color:var(--ink-500);font-size:12px}
.idchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;border-top:1px solid var(--line);padding-top:12px;align-items:center}
.idchips .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600;margin-right:2px}
.idchip{display:inline-flex;align-items:center;border-radius:6px;background:#f8fafc;border:1px solid var(--line);padding:2px 8px;font-size:10.5px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.perschip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#f8fafc;border:1px solid var(--line);padding:3px 10px 3px 4px;font-size:12px;font-weight:500;color:var(--ink-700);cursor:pointer;margin:0 6px 4px 0}
.perschip:hover{border-color:#c7d2fe;color:var(--primary-dark)}
.perschip .avat{width:22px;height:22px;font-size:9px;border-radius:999px}
.fsec{background:#fff;border-radius:12px;box-shadow:var(--sh-carte);padding:16px 20px;margin-bottom:12px}
.sect-h{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;color:var(--ink-900)}
.sect-h svg{color:var(--ink-400);flex-shrink:0;margin-top:1px}
.sect-h .n2{font-weight:400;color:var(--ink-400);font-size:11.5px}
.sect-h .right{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--ink-400);text-align:right;line-height:1.5}
.fsec>h2{font-size:13px;font-weight:600;color:var(--ink-900);display:flex;align-items:center;gap:7px}
.fsec>h2 .n2{font-weight:400;color:var(--ink-400);font-size:11px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-700)}
.subh+.lrow{border-top:none}
.lrow .chip{margin-left:auto;flex-shrink:0}
.subh{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600;margin:14px 0 4px}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-700);flex-wrap:wrap}
.frow:nth-of-type(1){border-top:none}
.frow .tt{font-weight:500;color:var(--ink-900)}
.frow .sm{font-size:11.5px;color:var(--ink-400)}
.frow .go{margin-left:auto;color:var(--primary);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.frow .go:hover{text-decoration:underline;text-underline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1.5px 9px;font-size:10.5px;font-weight:500;background:#f1f5f9;color:var(--ink-500)}
.chip.ok{background:var(--ok-50);color:var(--ok)}
.chip.warn{background:var(--warn-50);color:var(--warn)}
.mlinks{display:flex;gap:12px;margin-top:8px}
.mlinks a{font-size:11.5px;font-weight:600;color:var(--primary);cursor:pointer}
.mlinks a:hover{text-decoration:underline;text-underline-offset:2px}
/* fiches v4 : grille de champs, accordéons, édition */
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 18px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.fld .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600}
.fld .v{font-size:13px;color:var(--ink-800);margin-top:3px;line-height:1.4;font-variant-numeric:tabular-nums;min-height:18px}
.fld .v .muted{color:var(--ink-300)}
.edin{width:100%;font:inherit;font-size:13px;color:var(--ink-900);border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;margin-top:2px;background:#fff;outline:none}
.edin:focus{border-color:transparent;box-shadow:0 0 0 2px var(--primary)}
.notes-ta{width:100%;font:inherit;font-size:13px;color:var(--ink-700);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:10px;background:#fbfcfd;outline:none;resize:vertical;min-height:60px;line-height:1.5}
.notes-ta:focus{background:#fff;border-color:transparent;box-shadow:0 0 0 2px var(--primary)}
.acc{border-top:1px solid var(--line)}
.acc:first-of-type{border-top:none}
.acc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer;border-radius:8px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--bg)}
.acc summary .chev{color:var(--ink-400);font-size:11px;transition:transform .15s;flex-shrink:0}
.acc[open] summary .chev{transform:rotate(90deg)}
.acc summary .tt{font-size:13.5px;font-weight:600;color:var(--ink-900)}
.acc summary .sm{font-size:11.5px;color:var(--ink-400)}
.acc summary .end{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}
.acc .inner{padding:2px 2px 16px 23px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 18px;margin:6px 0 2px}
/* historique des to_do */
.hist{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.hist summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-500);list-style:none;display:flex;align-items:center;gap:6px}
.hist summary::before{content:"▸";font-size:10px;color:var(--ink-400);transition:transform .15s}
.hist[open] summary::before{transform:rotate(90deg)}
.hist summary:hover{color:var(--ink-700)}
.hist summary .n2{font-weight:400;color:var(--ink-400);font-size:11px}
.hrow{display:flex;gap:9px;font-size:11.5px;padding:3.5px 0;color:var(--ink-600,#475569);line-height:1.4;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.hrow .d{flex-shrink:0;width:118px;color:var(--ink-400);font-variant-numeric:tabular-nums}
.hrow .ck{color:var(--ok);flex-shrink:0}
.hrow .e{color:var(--ink-300);margin:0 2px}
.hrow .w{color:var(--ink-400)}
.task .fx{font-size:10px;color:var(--ok);background:var(--ok-50);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.task .note{display:block;font-size:10.5px;color:var(--ink-400);margin-top:1px}
.sub{margin:2px 0 2px 21px;display:flex;flex-direction:column;gap:1px}
.waiting{margin-top:8px;font-size:11px;color:var(--warn);background:var(--warn-50);border-radius:6px;padding:5px 8px;line-height:1.4}
/* carte compacte */
.card.pointer{border:1.5px dashed var(--line-2);box-shadow:none;background:#fbfcfd}
.card.pointer:hover{border-color:#c7d2fe;background:#fff}
.card.pointer .t{color:var(--ink-700)}
.card.clickable{cursor:pointer}
.card.clickable:hover .t{color:var(--primary)}
.prog{height:4px;background:#f1f5f9;border-radius:999px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:#818cf8;transition:width .3s}
.prog i.full{background:#34d399}
.cnt{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.cnt b{font-weight:600;color:var(--ink-700)}
.nextt{display:flex;gap:6px;margin-top:5px;font-size:11.5px;color:var(--ink-700);line-height:1.35}
.nextt .k{flex-shrink:0;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);margin-top:1px}
.nextt .v{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nextt .who2{color:var(--ink-400)}
.opendetail{margin-top:8px;font-size:10.5px;color:var(--ink-400)}
.card.clickable:hover .opendetail{color:var(--primary)}
/* modal détail de carte */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px}
.mbox{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgb(0 0 0/.2);width:100%;max-width:520px;max-height:86vh;overflow-y:auto}
.mhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line-2);padding:16px 20px 12px;border-radius:14px 14px 0 0}
.mhead .row{display:flex;align-items:flex-start;gap:10px}
.mhead .t{font-size:16px;font-weight:600;color:var(--ink-900);letter-spacing:-.01em}
.mhead .s{font-size:12px;color:var(--ink-400);margin-top:2px}
.mclose{margin-left:auto;width:28px;height:28px;border-radius:7px;color:var(--ink-400);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.mclose:hover{background:var(--bg);color:var(--ink-700)}
.mstep{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-500)}
.mstep .pill{width:8px;height:8px;border-radius:50%;background:#818cf8}
.mbody{padding:14px 16px 16px;background:#f8fafc;border-radius:0 0 14px 14px}
.msec{font-size:12px;font-weight:600;color:var(--ink-900);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.msec .n2{font-weight:400;color:var(--ink-400);font-size:11px}
/* carte grisée */
.card.ghost{opacity:.62;background:#f8fafc}
.card.ghost .t,.card.ghost .s{color:var(--ink-400)}
.ghost-hint{margin-top:8px;font-size:11px;color:var(--ink-400);display:flex;align-items:center;gap:5px}
.popover{display:none;position:absolute;z-index:40;left:8px;right:8px;top:calc(100% - 6px);background:var(--ink-900);color:#e2e8f0;font-size:11.5px;line-height:1.55;padding:10px 12px;border-radius:9px;box-shadow:0 8px 24px rgb(0 0 0/.18)}
.card.ghost:hover .popover{display:block}
.popover a{color:#a5b4fc;font-weight:600;text-decoration:none;display:inline-block;margin-top:5px;cursor:pointer}
/* lignes facture mensuelle */
.lines{margin-top:8px;border-top:1px solid var(--line);padding-top:7px}
.lines .ln{display:flex;justify-content:space-between;font-size:11.5px;padding:2.5px 2px;color:var(--ink-700)}
.lines .ln.new{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--ok-50)}100%{background:transparent}}
.lines .ln .k{color:var(--ink-400)}
.lines .tot{display:flex;justify-content:space-between;font-size:12px;font-weight:600;border-top:1px solid var(--line-2);margin-top:4px;padding-top:5px;color:var(--ink-900)}
/* liste sessions closer */
.slist{display:flex;flex-direction:column;gap:10px;max-width:680px}
.srow{background:#fff;border-radius:10px;box-shadow:var(--sh-carte);padding:13px 16px;display:flex;align-items:center;gap:14px}
.srow .d{font-size:13.5px;font-weight:600;color:var(--ink-900)}
.srow .v{font-size:12px;color:var(--ink-500)}
.srow .pl{margin-left:auto;font-size:12px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:500;transition:background .12s}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-dark)}
.btn-s{border:1px solid var(--line-2);color:var(--ink-700);background:#fff}.btn-s:hover{background:var(--bg)}
/* stubs */
.stub{background:#fff;border-radius:12px;box-shadow:var(--sh-carte);padding:22px;max-width:680px}
.stub h2{font-size:14px;font-weight:600;color:var(--ink-900);margin-bottom:6px}
.stub p{font-size:13px;color:var(--ink-500);line-height:1.6}
.stub ul{margin:10px 0 0 18px;font-size:13px;color:var(--ink-700);line-height:1.9}
.simnote{display:inline-flex;align-items:center;gap:6px;background:var(--warn-50);color:#92400e;font-size:11px;border-radius:999px;padding:3px 10px;margin-bottom:14px}
/* ── Apps simulées ──────────────────────────────── */
.appframe{border-radius:12px;overflow:hidden;box-shadow:var(--sh-carte);background:#fff;max-width:1060px}
/* apprenant */
.ap-head{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--line-2);background:rgba(255,255,255,.95)}
.ap-body{background:#f8fafc;padding:26px 22px;display:flex;flex-direction:column;gap:18px;align-items:center}
.ap-card{background:#fff;border-radius:12px;box-shadow:var(--sh-carte);width:100%;max-width:760px}
.ap-card .h{display:flex;justify-content:space-between;align-items:center;padding:14px 22px}
.ap-card .h h2{font-size:17px;font-weight:600;color:#0f172a}
.ap-card .b{border-top:1px solid #f1f5f9;padding:16px 22px}
.ap-tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:#f1f5f9;padding:2px 10px;font-size:12px;font-weight:500;color:#334155;font-variant-numeric:tabular-nums;margin:0 6px 6px 0}
.ap-chip{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500}
.ap-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #f1f5f9;font-size:14px;color:#0f172a}
.ap-row:first-child{border-top:none}
.ap-row .chev{margin-left:auto;color:#94a3b8}
.ap-avatar{width:34px;height:34px;border-radius:50%;background:#4f46e5;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:760px}
.kpi{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:12px 14px;box-shadow:var(--sh-carte)}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#737373;font-weight:500}
.kpi .v{font-size:21px;font-weight:700;margin-top:3px;color:#111827;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11px;margin-top:2px;font-weight:500}
.up{color:#059669}.down{color:#dc2626}.blue{color:#2563eb}
/* dash */
.dd-main{padding:22px;background:#fff}
.dd-sec{border:1px solid rgba(196,181,253,.6);background:linear-gradient(90deg,rgba(245,243,255,.6),rgba(250,245,255,.6));border-radius:12px;padding:16px;margin-top:14px;max-width:860px}
.dd-sec h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#5b21b6;display:flex;gap:7px;align-items:center;margin-bottom:10px}
.dd-tbl{width:100%;font-size:12.5px;border-collapse:collapse;background:rgba(255,255,255,.6);border-radius:8px;overflow:hidden}
.dd-tbl th{text-align:left;padding:7px 10px;background:rgba(237,233,254,.4);border-bottom:1px solid rgba(196,181,253,.6);color:#4c1d95;font-weight:600}
.dd-tbl td{padding:7px 10px;border-bottom:1px solid rgba(237,233,254,.6);font-variant-numeric:tabular-nums;color:#334155}
/* toasts / overlay */
#toasts{position:fixed;right:18px;top:64px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--ink-900);color:#f1f5f9;font-size:12.5px;line-height:1.5;padding:10px 14px;border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0/.22);animation:tin .25s ease}
.toast b{color:#fff}
.toast.pink{border-left:3px solid #10b981}
@keyframes tin{0%{transform:translateY(-8px);opacity:0}100%{transform:translateY(0);opacity:1}}
#auth{position:fixed;inset:0;background:rgba(248,250,252,.92);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center}
#auth .box{background:#fff;border-radius:14px;box-shadow:0 14px 40px rgb(0 0 0/.12);padding:30px 42px;text-align:center}
#auth .sp{width:26px;height:26px;border:3px solid var(--line-2);border-top-color:var(--accent2,#4f46e5);border-radius:50%;margin:0 auto 12px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#auth .t1{font-size:14px;font-weight:600;color:var(--ink-900)}
#auth .t2{font-size:12px;color:var(--ink-400);margin-top:3px}
/* ── v20 : cartes épurées, popup process, sections de colonne ── */
.ct{display:flex;align-items:flex-start;gap:8px}
.ct .t{flex:1;min-width:0;line-height:1.3}
.ct .badge{flex-shrink:0;margin-top:1px}
.b-offre{background:var(--primary-50);color:var(--primary-dark)}
.cnt{align-items:flex-start;margin-top:6px}
.cnt .nx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-600,#475569);line-height:1.35}
.cnt .nx .k{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);margin-right:5px}
.cnt .nx.ok{color:var(--ok)}
.prog{margin-top:8px}
.colsec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-500);margin:10px 2px 6px;padding-top:8px;border-top:1px dashed var(--line-2)}
.colsec span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-400);margin-left:4px}
.colempty{font-size:11px;color:var(--ink-300);padding:2px 4px 6px}
.mhead .row{align-items:center}
.mhead .row .badge{margin-left:4px}
.igrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 16px}
.ifld .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600}
.ifld .v{font-size:12.5px;color:var(--ink-800);margin-top:2px;line-height:1.4}
.ifld .v .muted{color:var(--ink-300)}
.ilink{color:var(--primary);font-weight:600;cursor:pointer}
.ilink:hover{text-decoration:underline;text-underline-offset:2px}
.stepline{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-500);margin:0 0 8px}
.stepline .pill{width:8px;height:8px;border-radius:50%;background:#818cf8}
.stepline b{color:var(--ink-900);font-weight:600}
.hist{margin-top:0;border-top:none;padding-top:0;margin-bottom:8px}
.hrow{color:var(--ink-400)}
.hrow.ev{color:var(--ok);font-weight:600}
.hrow .dot{width:7px;height:7px;border-radius:50%;background:#10b981;flex-shrink:0;margin-top:5px}
.cur{background:var(--primary-50);border:1px solid #e0e7ff;border-radius:10px;padding:10px 12px}
.curh{font-size:12px;font-weight:600;color:var(--primary-dark);display:flex;gap:6px;align-items:center}
.curh .n2{font-weight:500;color:var(--primary);font-size:11px}
.cur .tasks{margin-top:6px;border-top:none;padding-top:0}
.cur .task:hover{background:#fff}
.cur .empty{font-size:12px;color:var(--ink-400);margin-top:4px}
.evrow{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--ok);margin:3px 0 4px 21px}
.evrow .dot{width:7px;height:7px;border-radius:50%;background:#10b981;flex-shrink:0}
.evrow.later{color:var(--ok);font-weight:600}.evrow.later .dot{background:#10b981}
.evrow.done{opacity:.75}
.fut{margin-top:10px}
.fut summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-500);list-style:none;display:flex;align-items:center;gap:6px}
.fut summary::-webkit-details-marker{display:none}
.fut summary::before{content:"▸";font-size:10px;color:var(--ink-400);transition:transform .15s}
.fut[open] summary::before{transform:rotate(90deg)}
.fut summary .n2{font-weight:400;color:var(--ink-400);font-size:11px}
.futcol{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);margin:10px 0 3px}
.futcol .pill{width:7px;height:7px;border-radius:50%;background:var(--ink-300)}
.futcol .n2{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-400);font-size:10.5px}
.ftask{display:flex;align-items:flex-start;gap:7px;padding:3px 2px;font-size:12px;line-height:1.4;color:var(--ink-400)}
.ftask .box{width:14px;height:14px;border:1.5px solid var(--line-2);border-radius:4px;flex-shrink:0;margin-top:1.5px;background:var(--bg)}
.ftask .tag{font-size:10px;color:#b45309;background:var(--warn-50);border-radius:4px;padding:0 5px;margin-left:4px;opacity:.7}
.ftask.none{color:var(--ink-300);font-style:italic}
.frow2 .tgrp{margin-left:2px}

/* ── preuves ── */
.plegend{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--ink-500);margin:-4px 0 12px}
.plegend span{display:inline-flex;align-items:center;gap:5px}
.pst{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;font-style:normal;flex-shrink:0}
.pst.ok{background:var(--ok-50);color:var(--ok)}.pst.later{background:#f1f5f9;color:var(--ink-300)}.pst.na{background:transparent;color:var(--ink-300)}.pst.ko{background:var(--err-50);color:var(--err)}
.prow{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:13px}
.subh+.prow{border-top:none}
.prow>div{flex:1}
.prow .chip{flex-shrink:0}
.pn{font-weight:500;color:var(--ink-900);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pn .chip,.pn .badge{font-weight:500}
.pd{font-size:11.5px;color:var(--ink-400);margin-top:2px;line-height:1.45}
.pmat{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.pmat th{text-align:center;padding:6px 6px 8px;vertical-align:top;font-weight:500}
.pmat th.pl,.pmat td.pl{text-align:left;min-width:320px}
.pmat td{padding:7px 6px;border-top:1px solid var(--line);text-align:center;vertical-align:top}
.pmat .pgrp td{background:#f8fafc;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-500);padding:7px 8px;border-top:none}
.pav{width:30px;height:30px;font-size:11px;border-radius:9px;margin:0 auto;cursor:pointer}
.pname{font-size:11px;color:var(--ink-700);margin:4px 0 3px}
.tbtn{display:inline-flex;align-items:center;border-radius:6px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--primary);color:#fff;margin-left:6px;vertical-align:middle}
.tbtn:hover{background:var(--primary-dark)}
.task.done .tbtn{display:none}

/* popup v22 : trois sections alignées, sans bloc coloré */
.msep{border-top:1px solid var(--line);margin:16px 0 6px}
.msec2{border-top:1px solid var(--line)}
.msec2:first-of-type{border-top:none}
.msec2>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;padding:10px 0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-700)}
.msec2>summary::-webkit-details-marker{display:none}
.msec2>summary .chev{color:var(--ink-400);font-size:10px;transition:transform .15s}
.msec2[open]>summary .chev{transform:rotate(90deg)}
.msec2>summary .n2{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-400);font-size:11px}
.msec2>summary:hover{color:var(--ink-900)}
.minner{padding:0 0 12px}
.minner .tasks{margin-top:0;border-top:none;padding-top:0}
.minner .empty{font-size:12px;color:var(--ink-400)}
.minner .futcol:first-child{margin-top:2px}

.mpanel{background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;margin-top:12px}
.mpanel:first-child{margin-top:0}
.mtasks{padding-top:2px;padding-bottom:2px}
.mtasks .msec2:first-of-type{border-top:none}
.mnote .k{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-700)}
.mnote .k svg{color:var(--ink-500)}
.mnote .notes-ta{margin-top:8px;min-height:54px}
.mnote .notes-ta:focus{background:#fff}
.ifld.wide{grid-column:1/-1}
.apslist{display:flex;flex-wrap:wrap;gap:0;margin-top:4px}
.apslist .perschip{margin:0 6px 6px 0}
/* ── popup v32 : style épuré ── */
#modal{background:rgba(15,23,42,.28);backdrop-filter:blur(2px);padding:5vh 16px}
#modal .mbox{max-width:580px;border-radius:18px;box-shadow:0 24px 64px rgb(15 23 42/.18),0 0 0 1px rgb(15 23 42/.04);animation:mpop .18s ease-out}
@keyframes mpop{0%{transform:translateY(6px) scale(.985);opacity:0}100%{transform:none;opacity:1}}
#modal .mhead{border-bottom:none;padding:22px 26px 6px;border-radius:18px 18px 0 0}
#modal .mhead .t{font-size:18px;font-weight:600;letter-spacing:-.015em}
#modal .mhead .row .badge{margin-left:6px}
#modal .mclose{width:30px;height:30px;border-radius:50%;background:#f1f5f9;color:var(--ink-500);font-size:14px}
#modal .mclose:hover{background:#e2e8f0;color:var(--ink-900)}
#modal .mbody{padding:0 26px 22px;background:#fff;border-radius:0 0 18px 18px}
#modal .mpanel{background:transparent;border:none;border-radius:0;padding:16px 0 14px;margin:0;border-top:1px solid var(--line-2)}
#modal .mpanel:first-child{border-top:none;padding-top:10px}
#modal .igrid{gap:13px 22px}
#modal .ifld .k{font-size:11px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-400)}
#modal .ifld .v{font-size:13.5px;color:var(--ink-900);margin-top:2px}
#modal .ilink{font-weight:600}
#modal .msec{font-size:13px;margin-bottom:8px}
#modal .mtasks{padding:4px 0 6px}
#modal .msec2{border-top:1px solid var(--line)}
#modal .msec2:first-of-type{border-top:none}
#modal .msec2>summary{padding:15px 0;font-size:14.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink-900);gap:11px}
#modal .msec2>summary .chev{width:24px;height:24px;border-radius:50%;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-500)}
#modal .msec2>summary .n2{font-size:12px;font-weight:600;color:var(--ink-500);background:#f1f5f9;border-radius:999px;padding:2px 9px}
#modal .minner{padding:0 0 12px 35px}
#modal .task{padding:5px 2px;font-size:12.5px}
#modal .task .box{border-radius:5px;width:15px;height:15px}
#modal .task.other .box{background:#f8fafc}
#modal .futcol{text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-700);margin:12px 0 4px}
#modal .futcol .pill{width:6px;height:6px}
#modal .hrow{font-size:12px;padding:4px 0;border-bottom:none}
#modal .hrow .d{width:112px}
#modal .mnote .k{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink-900)}
#modal .mnote .k svg{display:none}
#modal .mnote .notes-ta{border:none;background:#f8fafc;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px}
#modal .mnote .notes-ta:focus{background:#f1f5f9;box-shadow:none}
#modal .lines .ln{font-size:12.5px;padding:4px 2px}
#modal .openline{border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){#sidebar{width:200px}.rolesel button{padding:4px 7px}}
</style>
</head>

const $ = s=>document.querySelector(s);
const el=(h)=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};
function toast(html,pink){const t=el(`<div class="toast${pink?" pink":""}">${html}</div>`);$("#toasts").append(t);setTimeout(()=>t.remove(),5200)}

/* ════════════════════ MOTEUR ════════════════════ */
function tasksFor(card, colId){
  const def=KB[card.kb].tasks[colId]||[];
  return def.filter(tk=>(!tk.fin || tk.fin.includes(card.fin)) && (!tk.kind || tk.kind.includes(card.kind)));
}
function colsFor(card){ return KB[card.kb].cols.filter(c=>!c.fin || c.fin.includes(card.fin)); }
function key(card,colId,i){return card.id+"::"+colId+"::"+i}
function allDone(card){
  const tks=tasksFor(card,card.col);
  if(!tks.length) return false;
  return tks.every((tk,i)=>{
    if(tk.sub && card.ech) return card.ech.every(e=>e[1]);
    return S.checks[key(card,card.col,i)];
  });
}
function nextCol(card){
  const cols=colsFor(card);
  let ix=cols.findIndex(c=>c.id===card.col);
  for(let j=ix+1;j<cols.length;j++){ if(!cols[j].skip) return cols[j]; }
  return null;
}
function colUnlocked(kb,col){ if(typeof col==="string") col=KB[kb].cols.find(c=>c.id===col); return !col.open || S.unlocked[kb+"::"+col.id]; }
function tryAdvance(card){
  if(!allDone(card)) return;
  const nc=nextCol(card);
  if(!nc) return;
  if(!colUnlocked(card.kb,nc)){ card.waiting=nc.id; render(); return; }
  card.waiting=null; card.col=nc.id; card.justMoved=true;
  toast(`Carte avancée : <b>${card.title}</b> → ${nc.label}`);
  render();
}
function runFx(card, tk, k){
  if(!tk.fx || S.fxDone[k]) return;
  if(tk.fxfin && !tk.fxfin.includes(card.fin)) return;
  S.fxDone[k]=true;
  if(tk.fx==="carte_client"){
    let kb,col;
    if(card.fin==="cpf"){kb="fact_cpf";col="sortie"}
    else if(card.fin==="opco"){kb="fact_opco";col="raf"}
    else if(card.fin==="fp_ent_vir"){kb="fact_fp";col="raf"}
    else {kb="fact_fp";col="attente"}
    const nid="dyn"+Math.floor(performance.now());
    const m = card.kb==="coaching"?"1 200 €":card.kb==="intra"?"7 900 €":"1 650 €";
    CARDS.push({id:nid,kb,offre:card.offre,sess:card.sess,dt:card.dt,lieu:card.lieu,title:card.title,fin:card.fin,m,src:card.id,col,fresh:1,
      ech:(card.fin==="fp_part"||card.fin==="fp_ent_man")?[["Échéance 1/1 · montant total · J+14 de la vente",0]]:null});
    toast(`${EV.carte_client} : <b>${card.title}</b> (${FIN[card.fin]?.lbl||""})`,1);
  }
  if(tk.fx==="carte_formateur"){
    const nid="dynf"+Math.floor(performance.now());
    const frm=card.frm||"Sarah K.";
    CARDS.push({id:nid,kb:"fact_frm",offre:card.offre,sess:card.sess,dt:card.dt,lieu:card.lieu,title:frm,frm,m:card.kb.startsWith("coaching")?"400 €":"1 400 €",srcTitle:card.title,col:"valider",fresh:1});
    toast(`${EV.carte_formateur} : <b>${frm}</b> · ${card.title}`,1);
  }
  if(tk.fx==="ligne_closer"){
    const m=CARDS.find(c=>c.id==="m1");
    m.lines.push(["Close · "+card.title,"165 €"]);
    m.newLine=true;
    toast(`${EV.ligne_closer} : <b>${card.title}</b>`,1);
  }
}
function canCheck(tk){ return tk.p===ROLE_OWNS[S.role] && !tk.auto; }
function clickTask(cardId,colId,i){
  const card=CARDS.find(c=>c.id===cardId);
  const tk=tasksFor(card,colId)[i];
  if(!canCheck(tk)) return;
  const k=key(card,colId,i);
  S.checks[k]=!S.checks[k];
  if(S.checks[k]) S.when[k]=new Date(); else delete S.when[k];
  if(S.checks[k]) runFx(card,tk,k);
  if(colId===card.col) tryAdvance(card);
  render();
}
function clickEch(cardId,j){
  const card=CARDS.find(c=>c.id===cardId);
  card.ech[j][1]=card.ech[j][1]?0:1;
  if(card.ech.every(e=>e[1])) toast(`Toutes les échéances encaissées : <b>${card.title}</b>`);
  tryAdvance(card);
  render();
}
function unlockCol(kb,colId){
  S.unlocked[kb+"::"+colId]=true;
  toast(`Étape ouverte en avance : les cartes prêtes peuvent maintenant y entrer.`);
  CARDS.filter(c=>c.kb===kb&&c.waiting===colId).forEach(c=>{c.waiting=null;tryAdvance(c)});
  render();
}

/* ════════════════════ RENDU ════════════════════ */
function badge(fin){ if(!fin||!FIN[fin]) return ""; const f=FIN[fin]; return `<span class="badge b-${f.cls}">${f.lbl}</span>` }
function badgeOffre(offre){ if(!offre) return ""; return `<span class="badge b-offre">${OFFRES[offre]||offre}</span>` }
function isFact(card){ return card.kb.startsWith("fact_"); }
function cardBadge(card){
  if(card.kb==="fact_com") return "";
  if(isFact(card)) return badgeOffre(card.offre);
  if(card.kb.startsWith("session")||card.kb==="intra_frm"||card.kb==="coaching_frm") return card.places?`<span class="badge b-neutral">${card.places} places</span>`:"";
  return badge(card.fin);
}
function evRow(ev,state){ /* state : done | now | later */
  return `<div class="evrow ${state}"><span class="dot"></span>${EV[ev]||ev}</div>`;
}
function taskHtml(card,colId,i,tk,ghost){
  const k=key(card,colId,i);
  const done=tk.sub&&card.ech ? card.ech.every(e=>e[1]) : !!S.checks[k];
  const can=canCheck(tk);
  let h="";
  if(tk.grp) h+=`<div class="tgrp">${tk.grp}</div>`;
  h+=`<div class="task ${done?"done":""} ${can?"":"other"}" ${can&&!ghost?`data-c="${card.id}" data-col="${colId}" data-i="${i}"`:'style="cursor:default"'}>
    <span class="box"></span>
    <span><span class="lbl">${tk.t}</span>${tk.btn&&!done&&!ghost&&can?`<button class="tbtn" data-tbtn="${card.id}::${colId}::${i}">${tk.btn}</button>`:""}${tk.tpl?`<span class="tag" data-tpl="${encodeURIComponent(tk.t)}" title="Voir le template">→ template</span>`:""}${tk.note?`<span class="note">${tk.note}</span>`:""}</span>
  </div>`;
  if(tk.sub&&card.ech){
    h+=`<div class="sub">`+card.ech.map((e,j)=>`<div class="task other ${e[1]?"done":""}" style="cursor:default"><span class="box"></span><span class="lbl" style="font-size:11px">${e[0]}</span></div>`).join("")+`</div>`;
  }
  const ev = tk.ev || ((tk.fx && (!tk.fxfin || tk.fxfin.includes(card.fin))) ? tk.fx : null);
  if(ev) h+=evRow(ev, done?"done":"now");
  return h;
}
function openDateStr(card,col){
  if(!col||!col.rule) return null;
  const d=card.dt||{}; let base=null,off=0;
  if(col.rule==="j-14"){base=d.j1;off=-14}
  else if(col.rule==="j2"){base=d.j2}
  else if(col.rule==="j2+1"){base=d.j2;off=1}
  else if(col.rule==="prevue"){base=d.prevue}
  else if(col.rule==="echeance"){base=d.echeance}
  else if(col.rule==="fin_mois"){base="2026-08-31"}
  if(!base) return "date à confirmer";
  const dt=new Date(base+"T12:00:00"); dt.setDate(dt.getDate()+off);
  return "le "+dt.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
}
function taskState(card,colId,i,tk){
  if(tk.sub&&card.ech) return card.ech.every(e=>e[1]);
  return !!S.checks[key(card,colId,i)];
}
function cardHtml(card, colDef, opts={}){
  const isGhost = opts.ghostCols && colDef.ghost;
  const tks=tasksFor(card,colDef.id);
  const factLink = isGhost ? findFactCard(card) : null;
  const done=tks.filter((tk,i)=>taskState(card,colDef.id,i,tk)).length;
  const nextTk=tks.find((tk,i)=>!taskState(card,colDef.id,i,tk));
  const lockInfo = card.waiting ? {c:KB[card.kb].cols.find(x=>x.id===card.waiting),pref:true} : null;
  let h=`<div class="card ${card.fresh?"pop":""} ${card.waiting?"waitlock":""} ${lockInfo?"haslock":""} ${isGhost?"ghost":"clickable"}" id="card-${card.id}" ${isGhost?"":`data-open="${card.id}"`}>`;
  if(lockInfo){
    const lc=lockInfo.c;
    h+=`<div class="lockstrip">🔒 <span>${lockInfo.pref?`<b>${lc.label}</b> · `:""}Ouverture ${openDateStr(card,lc)} <span class="dim">(${lc.open})</span></span></div>`;
  }
  h+=`<div class="ct"><span class="t">${card.title}</span>${cardBadge(card)}</div>`;
  if(card.lines){
    const tot=card.lines.reduce((a,l)=>a+parseInt(l[1].replace(/\D/g,"")||0),0);
    h+=`<div class="cnt"><b>${card.lines.length} ligne${card.lines.length>1?"s":""}</b> · ${tot.toLocaleString("fr-FR")} €</div>`;
  }
  if(isGhost){
    h+=`<div class="ghost-hint">🔒 Lecture seule</div>
      <div class="popover">Inscription confirmée : revenez le lendemain du J2 pour vous assurer que votre client a bien participé à sa formation (sinon la carte passera en Absent). D'ici là, poursuivez sur la carte facturation du client.
      ${factLink?`<a data-goto="${factLink.id}">Voir la carte facturation →</a>`:""}</div>`;
  } else if(tks.length){
    h+=`<div class="prog"><i class="${done===tks.length?"full":""}" style="width:${Math.round(done/tks.length*100)}%"></i></div>`;
    h+=`<div class="cnt"><b>${done}/${tks.length}</b>${nextTk?`<span class="nx"><span class="k">Next</span>${nextTk.t}</span>`:`<span class="nx ok">Étape complète</span>`}</div>`;
  }
  h+=`</div>`;
  return h;
}
function fmtWhen(d){
  const today=new Date();
  const sameDay=d.toDateString()===today.toDateString();
  const dd=d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  const hh=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return (sameDay?"aujourd'hui":dd)+" · "+hh;
}
function fmtDT(iso){ const d=new Date(iso); return d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
function fmtDates(card){
  const d=card.dt||{};
  const f=x=>new Date(x+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
  if(d.j1&&d.j2) return f(d.j1)+" et "+f(d.j2);
  if(d.prevue) return f(d.prevue);
  return null;
}
function evFor(card,tk){ return tk.ev || ((tk.fx && (!tk.fxfin || tk.fxfin.includes(card.fin))) ? tk.fx : null); }
function birthRow(card){
  if(["insc","intra","coaching"].includes(card.kb)) return {d:card.ard?new Date(card.ard):null, t:"Carte créée : ARD soumis par le client", ev:1};
  if(isFact(card)&&card.kb!=="fact_com") return {d:null, t:card.kb==="fact_frm"?"Carte créée au dépôt de la facture du formateur":"Carte créée par le kanban Inscription", ev:1};
  if(card.kb==="fact_com") return {d:null, t:"Carte créée le 1er du mois", ev:1};
  return null;
}
function historyFor(card){
  const cols=colsFor(card);
  const curIx=cols.findIndex(c=>c.id===card.col);
  const past=cols.slice(0,curIx).filter(c=>!c.skip);
  const rows=[];
  const b=birthRow(card);
  const origin=new Date(); origin.setDate(origin.getDate()-(past.length+1)*4);
  if(b) rows.push({d:b.d||origin,t:b.t,ev:1,e:cols[0].label});
  past.forEach((col,j)=>{
    const base=new Date(); base.setDate(base.getDate()-(past.length-j)*4);
    tasksFor(card,col.id).forEach((tk,i)=>{
      const k=key(card,col.id,i);
      const d=S.when[k]?new Date(S.when[k]):(()=>{const x=new Date(base);x.setHours(9+((i*2)%8),(i*17)%60,0,0);return x})();
      rows.push({d,t:tk.t,e:col.label});
      const ev=evFor(card,tk); if(ev) rows.push({d:new Date(d.getTime()+60000),t:EV[ev],ev:1,e:col.label});
    });
  });
  tasksFor(card,card.col).forEach((tk,i)=>{
    if(taskState(card,card.col,i,tk)){
      const k=key(card,card.col,i);
      const d=S.when[k]?new Date(S.when[k]):new Date();
      rows.push({d,t:tk.t,e:cols[curIx].label});
      const ev=evFor(card,tk); if(ev) rows.push({d:new Date(d.getTime()+60000),t:EV[ev],ev:1,e:cols[curIx].label});
    }
  });
  rows.sort((a,b)=>a.d-b.d);
  return rows;
}
function futureFor(card){
  const cols=colsFor(card);
  const curIx=cols.findIndex(c=>c.id===card.col);
  return cols.slice(curIx+1).filter(c=>!c.skip).map(col=>({col,tasks:tasksFor(card,col.id)}));
}

function peopleFor(card){
  const srcId = card.src || card.id;
  let cl = CLIENTS.find(c=>(c.ventes||[]).some(v=>v.inscId===srcId||v.factId===card.id||v.inscId===card.id));
  let aps = APPRENANTS.filter(a=>a.insc.includes(srcId)||a.insc.includes(card.id));
  if(!cl && aps.length && aps[0].client) cl=CLIENTS.find(c=>c.id===aps[0].client);
  if(!aps.length && cl) aps=(cl.apprenants||[]).map(id=>APPRENANTS.find(a=>a.id===id)).filter(Boolean);
  return {cl,aps};
}
function infoFor(card){
  const rows=[];

  const apsHtml = aps.map(a=>`<a class="ilink" data-fiche="apprenant::${a.id}">${a.nom}</a>`);

    return rows;
  }
  if(card.kb==="intra_frm"||card.kb==="coaching_frm"){
    rows.push(["Client",clName||card.title],["Offre",OFFRES[card.offre]+(card.nb?" · "+card.nb:"")],["Date",fmtDates(card)||"À caler"],["Lieu",card.lieu]);
    return rows;
  }
  /* inscription et facturation client */
  rows.push(["Client",clName||card.title]);
  if(apsHtml.length) rows.push([aps.length>1?"Apprenants · "+aps.length:"Apprenant",apsHtml.join(", "),aps.length>2?"wide":""]);
  else rows.push(["Apprenants","À renseigner par le client"]);
  if(isFact(card)) rows.push(["Mode de paiement",FIN[card.fin]?FIN[card.fin].lbl:""]);
  else rows.push(["Offre",OFFRES[card.offre]+(card.nb?" · "+card.nb:"")]);
  rows.push(["Date",fmtDates(card)||"À caler"],["Lieu",card.lieu||"À confirmer"]);
  const src = card.src ? CARDS.find(c=>c.id===card.src) : card;
  rows.push(["Closeur / Setteur",[src&&src.closer,src&&src.setter].filter(Boolean).join(" / ")||"Sans setteur"]);
  if(isFact(card)) rows.push(["Montant",card.m]);
  else rows.push(["Transmission ARD",card.ard?fmtDT(card.ard):null]);
  return rows;
}

};
function sessStage(sess){
  const s=CARDS.find(c=>c.kb==="session_fia"&&c.sess===sess); if(!s) return 0;
  return {brouillon:0,prete:0,demarree:1,enformation:2,preuves:3,terminee:3}[s.col]??0;
}
function preuveState(item, insc, stage){
  if(insc){ if(item.cpf&&insc.fin!=="cpf") return "na"; if(item.noncpf&&insc.fin==="cpf") return "na"; if(insc.col==="absent"&&item.at>=2) return "ko"; }
  return stage>=item.at ? "ok" : "later";
}
const PSTATE={ok:["✓","ok","disponible"],later:["○","later","à venir"],na:["–","na","non applicable"],ko:["✕","ko","absent"]};
function pagePreuves(){
  const sess=SESS[S.fPreuves]?S.fPreuves:"paris";
  const stage=sessStage(sess);
  const sCard=CARDS.find(c=>c.kb==="session_fia"&&c.sess===sess);
  const inscs=CARDS.filter(c=>c.kb==="insc"&&c.sess===sess&&c.col!=="lost");
  const aps=inscs.map(i=>({insc:i,ap:peopleFor(i).aps[0]})).filter(x=>x.ap);
  let h=`<div class="pagehead"><h1>Preuves</h1><p>Où se trouve chaque preuve de réalisation, regroupée par niveau (session ou apprenant) puis par lieu.</p></div>`;
  h+=chips([["Session",Object.entries(SESS).map(([k,v])=>[k,v.lbl])]], sess, "fPreuves");
  h+=`<div class="plegend">${Object.values(PSTATE).map(p=>`<span><i class="pst ${p[1]}">${p[0]}</i>${p[2]}</span>`).join("")}<span class="chip" style="margin-left:auto">${sCard?colLabel(sCard):""}</span></div>`;
  /* niveau session */
  h+=`<div class="fsec"><div class="sect-h">${ICO.cap}Preuves de la session <span class="n2">un document pour toute la session</span></div>`;
  PREUVES.session.forEach(g=>{
    h+=`<div class="subh">${g.lieu}</div>`;
    g.items.forEach(it=>{const st=preuveState(it,null,stage);const p=PSTATE[st];
      h+=`<div class="prow"><i class="pst ${p[1]}">${p[0]}</i><div><div class="pn">${it.n}<span class="chip">${it.src}</span></div><div class="pd">${it.d}</div></div><span class="chip ${st==="ok"?"ok":""}">${p[2]}</span></div>`;});
  });
  h+=`</div>`;
  /* niveau apprenant : matrice */
  h+=`<div class="fsec"><div class="sect-h">${ICO.user}Preuves de l'apprenant <span class="n2">${aps.length} apprenant${aps.length>1?"s":""} sur cette session · une colonne par apprenant</span></div>`;
  h+=`<div style="overflow-x:auto"><table class="pmat"><thead><tr><th class="pl">Preuve</th>`+aps.map(x=>`<th><span class="avat pav" title="${x.ap.nom}" data-fiche="apprenant::${x.ap.id}">${initiales(x.ap.nom)}</span><div class="pname">${x.ap.prenom}</div>${badge(x.insc.fin)}</th>`).join("")+`</tr></thead><tbody>`;
  PREUVES.apprenant.forEach(g=>{
    h+=`<tr class="pgrp"><td colspan="${aps.length+1}">${g.lieu}</td></tr>`;
    g.items.forEach(it=>{
      h+=`<tr><td class="pl"><div class="pn">${it.n}<span class="chip">${it.src}</span>${it.cpf?'<span class="badge b-cpf">CPF</span>':""}${it.noncpf?'<span class="badge b-neutral">hors CPF</span>':""}</div><div class="pd">${it.d}</div></td>`;
      h+=aps.map(x=>{const st=preuveState(it,x.insc,stage);const p=PSTATE[st];return `<td><i class="pst ${p[1]}" title="${x.ap.nom} · ${p[2]}">${p[0]}</i></td>`}).join("");
      h+=`</tr>`;
    });
  });
  h+=`</tbody></table></div></div>`;
  return h;
}
function preuvesApprenantHtml(insc){
  const stage=insc.sess?sessStage(insc.sess):0;
  return PREUVES.apprenant.flatMap(g=>g.items.map(it=>{const st=preuveState(it,insc,stage);if(st==="na")return "";const p=PSTATE[st];
    return `<div class="lrow"><i class="pst ${p[1]}">${p[0]}</i>${it.n}<span class="sm" style="margin-left:4px">${g.lieu}</span><span class="chip ${st==="ok"?"ok":""}">${p[2]}</span></div>`})).join("");
}
const STUBS = {
 anomalies:["Anomalies","Les incohérences détectées automatiquement (dossier EDOF sans facture, mandat sans échéancier, carte sans vente…), avec leur statut de traitement."],
 actions:["Actions","Le journal des actions : qui a fait quoi, quand, depuis quelle carte."],
 utilisateurs:["Utilisateurs","La gestion des comptes et des accès : internes, formateurs (qualifications, profil, onboarding), closeurs (calendriers), setteurs, et les droits d'accès aux pages."],
 automatisations:["Automatisations","Les interrupteurs des automates : détection de paiements, relances, tampons acquittés, création des cartes."],
 templates:["Templates","Les modèles de messages (WhatsApp, email) référencés par les tâches « → template » des kanbans."],
 faq:["FAQ & Feedback","La FAQ interne et la remontée de feedback produit."],
 preuves:["Preuves","La collecte et le stockage des preuves de réalisation (exports WhatsApp, émargements, documents), à l'échelle de la session et de l'apprenant."],
 generer:["Générer","Génération à la demande : devis, convention, lien de mandat, facture depuis la fiche client."],
 aprendre:["À prendre","Les sessions et coachings publiés au Shotgun, disponibles à la demande. Le formateur du présentiel garde la priorité sur les coachings de ses apprenants."],
 profil:["Mon profil","Vos informations, qualifications, villes de notification et offres autorisées."],
 ressources:["Ressources & FAQ","Vidéos, canvas et supports de formation, plus la FAQ formateur et la remontée de feedback."],
};

  const s=STUBS[id]||["Page",""];

/* ── rendu global ── */
/* ── rendu global ── */
function render(){
  /* app tabs */
  const apps=ROLE_APPS[S.role];
  $("#appTabs").innerHTML=apps.map(a=>`<button class="apptab ${S.app===a?"active":""}" data-app="${a}"><span class="dot" style="background:${APPS[a].color}"></span>${APPS[a].name}${S.app===a?"":'<span class="lock">SSO</span>'}</button>`).join("");
  /* subnav */
  const groups = S.app==="delivia" ? DELIVIA_TABS[S.role] : (APP_TABS[S.app]||[]);
  document.documentElement.style.setProperty("--accent", APPS[S.app].accent);
  $("#subnav").innerHTML = `<div class="appctx" style="color:${APPS[S.app].accent}"><span class="dot" style="background:${APPS[S.app].accent}"></span>${APPS[S.app].name}</div>`
    + groups.map(([g,items])=>`<div class="subgrp">${g}</div>`+items.map(([id,lbl])=>`<button class="subtab ${S.tab===id?"active":""}" data-tab="${id}" style="--accent:${APPS[S.app].accent}">${lbl}</button>`).join("")).join("");
  /* crumb + role */
  const crumbEnd = S.fiche
    ? (S.fiche.t==="apprenant" ? "Fiche apprenant · "+(APPRENANTS.find(a=>a.id===S.fiche.id)||{}).nom : "Fiche client · "+(CLIENTS.find(c=>c.id===S.fiche.id)||{}).nom)
    : ((groups.flatMap(g=>g[1]).find(t=>t[0]===S.tab)||["",""])[1]||"");
  $("#crumb").innerHTML=`${APPS[S.app].name}<span class="sep">/</span><span style="color:var(--ink-500);font-weight:500">${crumbEnd}</span>`;
  $("#roleSel").innerHTML=Object.entries(ROLES).map(([id,lbl])=>`<button class="${S.role===id?"active":""}" data-role="${id}">${lbl}</button>`).join("");
  /* content */
  let h="";
  if(S.app==="apprenant") h=pageApprenant();
  else if(S.app==="dash") h=pageDash();
  else if(S.fiche){
    h = S.fiche.t==="apprenant" ? ficheApprenantHtml(S.fiche.id) : ficheClientHtml(S.fiche.id);
  }
  else {
    if(S.tab==="sessions") h=pageSessions();
    else if(S.tab==="inscription") h=pageInscription();
    else if(S.tab==="facturation") h=pageFacturation();
    else if(S.tab==="services") h=pageServices();
    else if(S.tab==="aprendre") h=pageAPrendre();
    else if(S.tab==="utilisateurs") h=pageAnnuaire();
    else if(S.tab==="preuves") h=pagePreuves();
    else h=pageStub(S.tab);
  }
  $("#content").innerHTML=h;
  document.getElementById("modal")?.remove();
  document.getElementById("tplmodal")?.remove();
  if(S.modal){
    const mc=CARDS.find(c=>c.id===S.modal);
    if(mc) document.body.insertAdjacentHTML("beforeend", modalHtml());
    else S.modal=null;
  }
  if(S.tpl) document.body.insertAdjacentHTML("beforeend", tplModalHtml());
  CARDS.forEach(c=>{c.fresh=0;c.newLine=0});
  if(S.highlight){
    const elc=document.getElementById("card-"+S.highlight);
    if(elc){elc.scrollIntoView({block:"center",behavior:"smooth"});elc.style.boxShadow="0 0 0 2px var(--primary)";setTimeout(()=>{elc.style.boxShadow=""},2200)}
    S.highlight=null;
  }
}
function factFilterFor(c){ return c.kb==="fact_cpf"?"cpf":c.kb==="fact_opco"?"opco":c.kb==="fact_frm"?"formateur":c.kb==="fact_com"?(c.fin==="closer"?"closeur":"setteur"):(c.fin==="fp_ent_vir"?"virement":"mandat"); }
/* ── interactions ── */
document.addEventListener("click",e=>{
  if(e.target.id==="tplmodal"||e.target.closest("[data-closetpl]")){S.tpl=null;document.getElementById("tplmodal")?.remove();return}
  const tplBtn=e.target.closest("[data-tpl]");
  if(tplBtn){e.stopPropagation();S.tpl=tplBtn.dataset.tpl;document.getElementById("tplmodal")?.remove();document.body.insertAdjacentHTML("beforeend", tplModalHtml());return}
  const tb=e.target.closest("[data-tbtn]");
  if(tb){e.stopPropagation();const [c,col,i]=tb.dataset.tbtn.split("::");const cd=CARDS.find(x=>x.id===c);if(!taskState(cd,col,parseInt(i),tasksFor(cd,col)[parseInt(i)])){toast(`Facture générée depuis la carte inscription : <b>${cd.title}</b>`);clickTask(c,col,parseInt(i));}return}
  const ms=e.target.closest(".msec2>summary");
  if(ms){const d=ms.parentElement;const k=d.dataset.k;if(k==="hist")S.histOpen=!d.open;else if(k==="cur")S.curOpen=!d.open;else S.futOpen=!d.open}
  if(e.target.id==="modal"||e.target.closest("[data-close]")){S.modal=null;document.getElementById("modal")?.remove();return}
  const acc=e.target.closest("details.acc>summary");
  if(acc){const d=acc.parentElement;S.openAcc[d.dataset.acc]=!d.open}
  const t=e.target.closest("[data-app],[data-tab],[data-role],[data-chip],.task,[data-goto],[data-resa],[data-open],[data-fiche],[data-ficheback],[data-gotoinsc],[data-demande],[data-editstart],[data-editcancel],[data-editsave]");
  if(!t) return;
  if(t.dataset.fiche){const [ty,fid]=t.dataset.fiche.split("::");S.modal=null;S.editing=null;S.fiche={t:ty,id:fid};S.app="delivia";render();return}
  if(t.dataset.editstart){S.editing=t.dataset.editstart;render();return}
  if(t.dataset.editcancel){S.editing=null;render();return}
  if(t.dataset.editsave){
    const [kind,fid]=t.dataset.editsave.split("::");
    const obj=(kind==="apprenant"?APPRENANTS:CLIENTS).find(x=>x.id===fid);
    document.querySelectorAll("#content [data-f]").forEach(inp=>{obj[inp.dataset.f]=inp.value});
    if(kind==="apprenant"){obj.nom=((obj.prenom||"")+" "+(obj.fam||"")).trim()||obj.nom;}
    S.editing=null;render();
    toast("Modifications enregistrées : <b>"+obj.nom+"</b>");
    return}
  if(t.dataset.ficheback){S.fiche=null;render();return}
  if(t.dataset.gotoinsc){const c=CARDS.find(x=>x.id===t.dataset.gotoinsc);S.fiche=null;S.modal=null;S.app="delivia";S.tab="inscription";S.fInsc=inscFilterFor(c);S.fInscMode="all";S.highlight=c.id;render();return}
  if(t.dataset.app){
    if(t.dataset.app===S.app) return;
    const a=t.dataset.app;
    document.documentElement.style.setProperty("--accent2", APPS[a].accent);
    $("#authT1").textContent="Connexion à "+APPS[a].name;
    $("#auth").style.display="flex";
    setTimeout(()=>{ $("#auth").style.display="none";
      S.app=a; S.fiche=null;
      S.tab = a==="delivia" ? (DELIVIA_TABS[S.role][0][1][0][0]) : (APP_TABS[a]?APP_TABS[a][0][1][0][0]:"");
      render();
    },750);
    return;
  }
  if(t.dataset.tab){S.tab=t.dataset.tab;S.fiche=null;render();return}
  if(t.dataset.role){
    S.role=t.dataset.role; S.app="delivia"; S.fiche=null; S.modal=null;
    S.tab=DELIVIA_TABS[S.role][0][1][0][0];
    if(S.role==="setter") S.tab="facturation";
    S.fFact = S.role==="closer"?"virement":S.role==="setter"?"setteur":"cpf";
    S.fFactOffre="all"; S.fInscMode="all";
    if(!["n1","n2"].includes(S.fSession)) S.fSession="n1";
    render();return}
  if(t.dataset.chip){const [k,v]=t.dataset.chip.split("::");S[k]=v;render();return}
  if(t.dataset.goto){S.app="delivia";S.tab="facturation";S.fiche=null;S.modal=null;
    const c=CARDS.find(x=>x.id===t.dataset.goto);
    S.fFact=factFilterFor(c); S.fFactOffre="all";
    S.highlight=c.id;render();return}
  if(t.dataset.resa){toast(`Place réservée pour votre client : elle est bloquée <b>48 h</b>. L'inscription ARD doit être soumise avant expiration.`);return}
  if(t.dataset.demande){toast(`Demande envoyée pour <b>${t.dataset.demande}</b> : France IA doit la valider. Vous serez notifié.`);return}
  if(t.classList.contains("task")&&t.dataset.c){clickTask(t.dataset.c,t.dataset.col,parseInt(t.dataset.i));return}
  if(t.dataset.open){S.modal=t.dataset.open;render();return}
});
document.addEventListener("input",e=>{const ta=e.target.closest("[data-note]");if(!ta)return;const o=CLIENTS.find(c=>c.id===ta.dataset.note)||APPRENANTS.find(a=>a.id===ta.dataset.note);if(o)o.note=ta.value;});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;
  if(S.tpl){S.tpl=null;document.getElementById("tplmodal")?.remove();return}
  if(S.modal){S.modal=null;document.getElementById("modal")?.remove()}});
render();
</script>
