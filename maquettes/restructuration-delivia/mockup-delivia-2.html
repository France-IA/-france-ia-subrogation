<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELIV'IA 2.0 · Plateforme France IA (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc; --surface:#fff; --ink-900:#0f172a; --ink-800:#1e293b; --ink-700:#334155;
  --ink-500:#64748b; --ink-400:#94a3b8; --ink-300:#cbd5e1;
  --line:#f1f5f9; --line-2:#e2e8f0;
  --primary:#4f46e5; --primary-dark:#4338ca; --primary-50:#eef2ff;
  --ok:#059669; --ok-50:#ecfdf5; --warn:#d97706; --warn-50:#fffbeb;
  --err:#e11d48; --err-50:#fff1f2; --info:#2563eb; --info-50:#eff6ff;
  --sh-carte:0 1px 3px 0 rgb(0 0 0/.04),0 1px 2px -1px rgb(0 0 0/.04);
  --sh-hover:0 4px 6px -1px rgb(0 0 0/.06),0 2px 4px -2px rgb(0 0 0/.04);
  --app-delivia:#4f46e5; --app-apprenant:#0284c7; --app-treso:#059669; --app-dash:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink-800);font-size:14px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{display:flex;min-height:100vh}
/* ── Sidebar plateforme ─────────────────────────── */
#sidebar{width:248px;flex-shrink:0;background:#fff;box-shadow:1px 0 0 0 var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
#appzone{margin:4px 10px 2px;padding:7px 6px 6px;background:#e2e8f0;border-radius:14px}
.brand{padding:18px 20px 10px}
.brand .word{font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--ink-900)}
.brand .word em{font-style:italic;font-weight:700}
.brand .tri{display:flex;height:3px;width:64px;margin-top:5px;border-radius:2px;overflow:hidden}
.brand .tri i{flex:1}.brand .tri i:nth-child(1){background:#4379f2}.brand .tri i:nth-child(2){background:#eef0f4}.brand .tri i:nth-child(3){background:#f21b1b}
.brand .plt{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400);margin-top:7px;font-weight:500}
.nav-label{padding:4px 12px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-900)}
.apptab{display:flex;align-items:center;gap:10px;width:100%;margin:1px 0;padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink-700);text-align:left;transition:background .12s,color .12s,box-shadow .12s}
.apptab:hover{background:rgba(255,255,255,.55);color:var(--ink-900)}
.apptab .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.apptab.active{background:#fff;color:var(--ink-900);font-weight:600;box-shadow:var(--sh-carte)}
.apptab .lock{margin-left:auto;font-size:10px;color:var(--ink-400)}
.appsw{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-900);background:#fff;box-shadow:var(--sh-carte);text-align:left}
.appsw .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.appsw .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appsw .chev{margin-left:auto;color:var(--ink-400);font-size:10px;transition:transform .15s}
.appsw.open .chev{transform:rotate(180deg)}
.appmenu{margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,.7)}
.appmenu .apptab{font-size:13px}
.navfold{margin-top:6px}
.navfold>summary{list-style:none;cursor:pointer;padding:12px 20px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400);display:flex;align-items:center;gap:6px}
.navfold>summary::-webkit-details-marker{display:none}
.navfold>summary:hover{color:var(--ink-700)}
.navfold>summary .chev{font-size:9px;color:var(--ink-300);transition:transform .15s}
.navfold[open]>summary .chev{transform:rotate(90deg)}
#subnav{padding-bottom:8px;padding-top:6px}
#subnav .appctx{padding:10px 20px 2px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
#subnav .appctx .dot{width:7px;height:7px;border-radius:50%}
.subgrp{padding:12px 20px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400)}
.subgrp2{padding:9px 20px 3px 28px;font-size:10px;font-weight:600;color:var(--ink-300);letter-spacing:.04em}
.subtab{display:flex;align-items:center;gap:8px;width:calc(100% - 28px);margin:1px 8px 1px 20px;padding:6px 11px;border-radius:7px;font-size:13px;color:var(--ink-500);text-align:left}
.subtab:hover{background:var(--bg);color:var(--ink-700)}
.subtab.active{background:var(--bg);color:var(--ink-900);font-weight:600}
.subtab.active::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent,#4f46e5);margin-left:-8px;margin-right:5px}
.side-note{margin-top:auto;padding:14px 20px;font-size:11px;color:var(--ink-400);border-top:1px solid var(--line);line-height:1.5}
/* ── Topbar ─────────────────────────────────────── */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:52px;background:#fff;box-shadow:0 1px 0 0 var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:30}
#crumb{font-size:14px;font-weight:600;color:var(--ink-900)}
#crumb .sep{color:var(--ink-300);font-weight:400;margin:0 6px}
#roleWrap{margin-left:auto;display:flex;align-items:center;gap:8px}
#roleWrap .lbl{font-size:11px;color:var(--ink-400)}
.rolesel{display:flex;gap:2px;background:#f1f5f9;padding:3px;border-radius:8px}
.rolesel button{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink-500)}
.rolesel button.active{background:#fff;color:var(--ink-900);font-weight:600;box-shadow:var(--sh-carte)}
#content{flex:1;padding:20px 24px 60px}
#content:has(.board){padding-bottom:14px}
.pagehead{margin-bottom:14px}
.pagehead h1{font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--ink-900)}
.pagehead p{font-size:13px;color:var(--ink-500);margin-top:3px;max-width:760px}
/* filtres */
.chips{display:inline-flex;align-items:center;gap:4px;background:#f1f5f9;padding:5px;border-radius:9px;margin:2px 10px 14px 0;flex-wrap:wrap}
.chips .grp{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-400);font-weight:600;padding:0 6px}
.chips button{padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-500)}
.chips button.active{background:#fff;color:var(--ink-900);font-weight:600;box-shadow:var(--sh-carte)}
/* ── Kanban ─────────────────────────────────────── */
.kb-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-900);margin:18px 0 10px}
.kb-title .who{font-size:11px;font-weight:500;color:var(--ink-400)}
.board{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;align-items:stretch;min-height:320px}
.col{flex:1 0 272px;min-width:272px;background:rgba(248,250,252,.9);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;min-height:0}
.colbody{flex:1;overflow-y:auto;min-height:0;padding-right:2px;margin-right:-2px}
.colbody::-webkit-scrollbar{width:6px}
.colbody::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
.col-h{display:flex;align-items:center;gap:7px;padding:2px 4px 8px}
.col-h .pill{width:8px;height:8px;border-radius:50%;background:var(--ink-400);flex-shrink:0}
.col-h h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-900)}
.col-h .n{margin-left:auto;font-size:11px;color:var(--ink-400);font-variant-numeric:tabular-nums}
.col-open{font-size:10.5px;color:var(--info);background:var(--info-50);border-radius:6px;padding:4px 8px;margin:0 2px 8px;display:block;line-height:1.45}
/* paramétrage d'un rail : le même kanban, en plus large, avec trois colonnes par tâche */
.railboard .col{flex:0 0 440px;min-width:440px}
.railcol.masq{opacity:.55;border-style:dashed}
.railcol.railnew{background:none;border-style:dashed;align-items:center;justify-content:center;min-height:120px}
.rt-head{display:grid;grid-template-columns:96px 72px minmax(0,1fr);gap:10px;padding:0 4px 6px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#fbfcfd;z-index:1}
.rtask{display:grid;grid-template-columns:96px 72px minmax(0,1fr);gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:start}
.rtask .rt-do{min-width:0}
.rt-lbl{overflow-wrap:anywhere}
.rtask:last-of-type{border-bottom:none}
.rtask .rt-c{color:var(--ink-500);font-weight:500;line-height:1.35;font-size:11.5px}
.rt-lbl{color:var(--ink-900);line-height:1.45}
.rt-sm{font-size:11px;color:var(--ink-400);margin-top:2px}
.rt-cas{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rt-p{font-size:10px;border-radius:4px;padding:1px 6px;background:#f1f5f9;color:var(--ink-300);border:1px solid transparent;cursor:pointer;white-space:nowrap}
.rt-p.on{background:var(--primary-50);color:var(--primary-dark);font-weight:600}
.rt-p:hover{border-color:#c7d2fe}
.rt-p.tpl{background:var(--warn-50);color:#92400e}
.rt-nat{font-size:10px;border-radius:4px;padding:1px 6px;font-weight:600;white-space:nowrap}
.rt-nat.auto{background:#f5f3ff;color:#6d28d9}
.rt-nat.cablee{background:var(--ok-50);color:var(--ok)}
.rt-acts{display:flex;gap:9px;margin-top:6px;font-size:11px;opacity:0;transition:opacity .12s}
.rtask:hover .rt-acts{opacity:1}
.rt-acts .ilink{font-size:11px}
.rt-vide{font-size:12px;color:var(--ink-400);padding:12px 4px}
.rt-add{padding:10px 2px 2px;display:flex;gap:8px;flex-wrap:wrap}
.apercuboard .col{flex:0 0 320px;min-width:320px}
.aptask{display:flex;gap:9px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
.aptask:last-child{border-bottom:none}
.aptask .box{width:15px;height:15px;border:1.5px solid var(--line-2);border-radius:4px;flex-shrink:0;margin-top:2px;background:#fff}
.aptask.mine .box{border-color:var(--ink-300)}
.aptask .ap-x{min-width:0;flex:1}
.aptask .ap-t{color:var(--ink-500);line-height:1.45;overflow-wrap:anywhere}
.aptask.mine .ap-t{color:var(--ink-900)}
.aptask .ap-m{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.col-open a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.col.locked{background:repeating-linear-gradient(-45deg,#f8fafc 0 10px,#f4f6f9 10px 11px);border-style:dashed;border-color:var(--line-2)}
.col.locked .col-h h3{color:var(--ink-400)}
.col.locked .card{opacity:.55;filter:grayscale(.5)}
.col.locked .card:hover{opacity:.8}
.lockbar{font-size:10.5px;color:var(--ink-500);background:#eef1f5;border-radius:6px;padding:5px 8px;margin:0 2px 8px;display:flex;align-items:center;gap:6px;line-height:1.35}
.lockbar button{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--primary);white-space:nowrap}
.lockbar button:hover{text-decoration:underline;text-underline-offset:2px}
.card.waitlock{background:#fbfcfd}
.card.waitlock .t{color:var(--ink-500)}
.lockstrip{margin:-9px -11px 9px;padding:6px 12px;background:#f1f5f9;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-500);line-height:1.35}
.lockstrip b{color:var(--ink-700);font-weight:600}
.lockstrip .dim{color:var(--ink-400)}
.lockstrip a{margin-left:auto;color:var(--primary);font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.lockstrip a:hover{text-decoration:underline;text-underline-offset:2px}
.openline{margin-top:9px;font-size:11px;color:var(--ink-500);background:#eef1f5;border-radius:6px;padding:5px 8px;display:flex;gap:6px;align-items:center;line-height:1.4}
.openline b{color:var(--ink-700);font-weight:600}
.openline a{color:var(--primary);font-weight:600;cursor:pointer;margin-left:auto;font-size:10.5px;white-space:nowrap}
.openline a:hover{text-decoration:underline;text-underline-offset:2px}
.card{background:#fff;border:1px solid #dfe4ec;border-radius:10px;box-shadow:var(--sh-carte);padding:9px 11px;margin-bottom:9px;position:relative;transition:box-shadow .15s,opacity .3s,transform .3s}
.card:hover{box-shadow:var(--sh-hover)}
.card.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.card .t{font-size:13.5px;font-weight:600;color:var(--ink-900)}
.card .s{font-size:11px;color:var(--ink-400);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1.5px 8px;font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums}
.b-cpf{background:var(--info-50);color:var(--info)} .bar-cpf{background:#3b82f6}
.b-opco{background:#fff7ed;color:#ea580c} .bar-opco{background:#f97316}
.b-vir{background:var(--ok-50);color:var(--ok)} .bar-vir{background:#10b981}
.b-mandat{background:#faf5ff;color:#9333ea} .bar-mandat{background:#a855f7}
.b-wait{background:var(--warn-50);color:var(--warn)}
.b-neutral{background:#f1f5f9;color:var(--ink-500)}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.card .places{font-size:11px;color:var(--ink-400);margin-top:3px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .places+.badge{margin-top:5px}
.card .places.warn{color:var(--warn)}
.card .places.ko{color:var(--err)}
.card.st-other .places{color:var(--ink-300)}
.tasks{margin-top:6px;padding-top:2px;display:flex;flex-direction:column;gap:2px}
.tgrp{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);margin:5px 0 2px}
.tor{display:flex;align-items:center;gap:8px;color:var(--ink-300);font-size:10px;font-weight:600;margin:4px 0}
.tor::before,.tor::after{content:"";flex:1;height:1px;background:var(--line-2)}
.task{display:flex;align-items:flex-start;gap:9px;padding:6px 8px;margin:0 -8px;border-radius:7px;font-size:13px;line-height:1.5;color:var(--ink-700);cursor:pointer}
.task:hover{background:var(--bg)}
.task>.tx{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px}
.task>.tx>.lbl{flex:1 1 250px;min-width:0}
.ftask>span{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 8px;flex:1;min-width:0}
.task .box{width:15px;height:15px;border:1.5px solid var(--ink-300);border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.task.pending{cursor:default}
.task.pending .box{border-style:dashed;border-color:var(--ink-300);background:transparent}
.task.pending .box::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--ink-300)}
.task.done .box{background:var(--primary);border-color:var(--primary)}
.task.done .box::after{content:"";width:8px;height:4.5px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;transform:rotate(-45deg) translate(0.5px,-1px)}
.task.done .lbl{color:var(--ink-400);text-decoration:line-through}
.task.notmine{color:var(--ink-400)}
.task.other .box{border-color:var(--line-2);background:var(--bg)}
.task.other.done .box{background:var(--ink-300);border-color:var(--ink-300)}
.hrow .who,.ftask .who{font-size:11px;font-weight:600;color:var(--ink-500);background:var(--bg);border-radius:5px;padding:1px 6px;margin-right:7px;white-space:nowrap}
.task .who,.ftask .who{flex:0 0 128px;font-size:11.5px;font-weight:600;color:var(--ink-500);background:none;border-radius:0;padding:0;white-space:normal;line-height:1.35}
.ftask .who{background:none;padding:0;margin:0}
@media (max-width:640px){.task .who,.ftask .who{flex:0 0 auto}}
.who.duo2 b{font-weight:700;color:var(--ink-700)}
.who.duo2 .sep{margin:0 4px;color:var(--ink-300)}
.task.notmine .who.duo2 b,.hrow:not(.mine) .who.duo2 b,.ftask:not(.mine) .who.duo2 b{color:var(--ink-500)}
.task:not(.notmine) .who{color:var(--ink-600)}
.task.done .who{color:var(--ink-300)}
.task.next{background:var(--primary-50)}
.task.next.notmine{background:#f1f5f9}
.task .tag{font-size:11.5px;color:#92400e;background:var(--warn-50);border-radius:5px;padding:1px 7px;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.task .tag:hover{border-color:#fcd34d;text-decoration:underline;text-underline-offset:2px}
/* popup template */
#tplmodal{position:fixed;inset:0;background:rgba(15,23,42,.3);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
#tplmodal .mbox{max-width:640px;width:100%}
.tpl-canal{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:600;background:var(--ok-50);color:var(--ok)}
.tpl-body{background:#f8fafc;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.65;color:var(--ink-700);white-space:pre-line}
.tpl-body .var{background:var(--primary-50);color:var(--primary-dark);border-radius:4px;padding:0 4px;font-size:12px;font-weight:500}
.tpl-edit{width:100%;min-height:230px;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.65;color:var(--ink-800);font-family:inherit;resize:vertical;background:#fff}
.tpl-edit:focus{outline:none;border-color:var(--primary)}
.tpl-note{font-size:11px;color:var(--ink-400);margin-top:10px;line-height:1.5}
/* fiches apprenant & client */
/* page de ressource : un document, écrit et relu dans DELIV'IA */
.docpage{max-width:780px;margin:0 auto}
.dp-head{display:flex;align-items:flex-start;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dp-head h1{font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--ink-900);line-height:1.2}
.dp-title-in{font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--ink-900);border:none;border-bottom:2px solid var(--primary);background:none;width:100%;font-family:inherit;padding:0 0 2px}
.dp-title-in:focus{outline:none}
.dp-meta{font-size:12px;color:var(--ink-400);margin-top:7px}
.dp-act{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
.dp-body{padding:18px 0 4px}
.dp-bloc{position:relative;padding:3px 34px 3px 0}
.dp-h2{font-size:17px;font-weight:600;color:var(--ink-900);margin:18px 0 4px;letter-spacing:-.01em}
.dp-p{font-size:15px;line-height:1.75;color:var(--ink-700);margin:6px 0}
.dp-li{display:flex;gap:10px;font-size:15px;line-height:1.7;color:var(--ink-700);margin:3px 0}
.dp-pt{color:var(--ink-300);flex-shrink:0}
.dp-box{width:15px;height:15px;border:1.5px solid var(--ink-300);border-radius:4px;flex-shrink:0;margin-top:4px}
.dp-tx{flex:1;min-width:0}
.dp-callout{display:flex;gap:11px;background:var(--warn-50);border-radius:9px;padding:13px 15px;margin:12px 0;font-size:14.5px;line-height:1.65;color:#92400e}
.dp-callout .dp-ico{color:#d97706;flex-shrink:0;margin-top:2px}
.dp-video{aspect-ratio:16/9;border-radius:10px;background:linear-gradient(145deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;margin-top:10px}
.dp-play{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;padding-left:4px}
.dp-embed{aspect-ratio:16/9;border:1px dashed var(--line-2);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-400);font-size:13px;margin-top:10px;background:#fff}
.dp-cap{font-size:12px;color:var(--ink-400);margin:6px 0 12px}
.dp-body.editing [contenteditable]{border-radius:6px;padding:2px 6px;margin-left:-6px;transition:background .12s}
.dp-body.editing [contenteditable]:hover{background:#f8fafc}
.dp-body.editing [contenteditable]:focus{outline:none;background:var(--primary-50)}
.dp-del{position:absolute;right:0;top:6px;width:22px;height:22px;border-radius:6px;color:var(--ink-300);font-size:12px;display:none;align-items:center;justify-content:center}
.dp-body.editing .dp-bloc:hover .dp-del{display:flex}
.dp-del:hover{background:var(--err-50);color:var(--err)}
.dp-add{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.dp-add .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600;margin-right:4px}
.dp-foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-400);line-height:1.6}
.backbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-500);margin-bottom:12px;cursor:pointer;border-radius:6px;padding:4px 8px}
.backbtn:hover{background:#f1f5f9;color:var(--ink-700)}
.fichehead{background:#fff;border-radius:12px;box-shadow:var(--sh-carte);padding:20px 22px;margin-bottom:14px}
.fh-top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.avat{width:40px;height:40px;border-radius:10px;background:var(--primary-50);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.avat svg{width:19px;height:19px}
.fichehead h1{font-size:19px;font-weight:600;letter-spacing:-.015em;color:var(--ink-900);line-height:1.25}
.fh-contact{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--ink-500)}
.fh-contact span{display:inline-flex;align-items:center;gap:5px}
.fh-contact svg{color:var(--ink-400)}
.fh-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fh-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fh-link{font-size:12px;font-weight:600;color:var(--primary);cursor:pointer;white-space:nowrap}
.fh-link:hover{text-decoration:underline;text-underline-offset:2px}
.apercu{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.apercu .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600}
.apercu .v{font-size:13px;font-weight:600;color:var(--ink-900);margin-top:4px;line-height:1.4}
.apercu .v .sm{font-weight:400;color:var(--ink-500);font-size:12px}
.idchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 18px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px;align-items:start}
.idchips .lbl{grid-column:1/-1;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600;margin-bottom:-4px}
.idchips .perschip,.idchips .idchip{justify-self:start}
.idchips.flexrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.idchips.flexrow .lbl{margin:0 2px 0 0}
.idchip{display:inline-flex;align-items:center;border-radius:6px;background:#f8fafc;border:1px solid var(--line);padding:2px 8px;font-size:10.5px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.perschip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#f8fafc;border:1px solid var(--line);padding:3px 10px 3px 4px;font-size:12px;font-weight:500;color:var(--ink-700);cursor:pointer;margin:0 6px 4px 0}
.perschip:hover{border-color:#c7d2fe;color:var(--primary-dark)}
.perschip .avat{width:22px;height:22px;font-size:9px;border-radius:999px}
.fsec{background:#fff;border-radius:12px;box-shadow:var(--sh-carte);padding:16px 20px;margin-bottom:12px}
.sect-h{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;color:var(--ink-900)}
.sect-h svg{color:var(--ink-400);flex-shrink:0;margin-top:1px}
.sect-h .n2{font-weight:400;color:var(--ink-400);font-size:11.5px}
.sect-h .right{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--ink-400);text-align:right;line-height:1.5}
.fsec>h2{font-size:13px;font-weight:600;color:var(--ink-900);display:flex;align-items:center;gap:7px}
.fsec>h2 .n2{font-weight:400;color:var(--ink-400);font-size:11px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-700)}
.subh+.lrow{border-top:none}
.lrow .chip{margin-left:auto;flex-shrink:0}
.subh{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600;margin:14px 0 4px}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-700);flex-wrap:wrap}
.frow:nth-of-type(1){border-top:none}
.frow .tt{font-weight:500;color:var(--ink-900)}
.frow .sm{font-size:11.5px;color:var(--ink-400)}
.frow>.btn,.frow>button.btn-s,.frow>.right{margin-left:auto}
.frow .go{margin-left:auto;color:var(--primary);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.frow .go:hover{text-decoration:underline;text-underline-offset:2px}
.ntag{display:inline-flex;align-items:center;border-radius:5px;padding:1.5px 8px;font-size:12px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ntag.bleu{background:#eff6ff;color:#1d4ed8}
.ntag.vert{background:#ecfdf5;color:#047857}
.ntag.violet{background:#f5f3ff;color:#6d28d9}
.ntag.orange{background:#fff7ed;color:#c2410c}
.ntag.gris{background:#f1f5f9;color:var(--ink-500)}
.ntags{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1.5px 9px;font-size:10.5px;font-weight:500;background:#f1f5f9;color:var(--ink-500)}
.chip.ok{background:var(--ok-50);color:var(--ok)}
.chip.warn{background:var(--warn-50);color:var(--warn)}
.mlinks{display:flex;gap:12px;margin-top:8px}
.mlinks a{font-size:11.5px;font-weight:600;color:var(--primary);cursor:pointer}
.mlinks a:hover{text-decoration:underline;text-underline-offset:2px}
/* fiches v4 : grille de champs, accordéons, édition */
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 18px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.fld .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600}
.fld .v{font-size:13px;color:var(--ink-800);margin-top:3px;line-height:1.4;font-variant-numeric:tabular-nums;min-height:18px}
.fld .v .muted{color:var(--ink-300)}
.edin{width:100%;font:inherit;font-size:13px;color:var(--ink-900);border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;margin-top:2px;background:#fff;outline:none}
.edin:focus{border-color:transparent;box-shadow:0 0 0 2px var(--primary)}
.notes-ta{width:100%;font:inherit;font-size:13px;color:var(--ink-700);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:10px;background:#fbfcfd;outline:none;resize:vertical;min-height:60px;line-height:1.5}
.notes-ta:focus{background:#fff;border-color:transparent;box-shadow:0 0 0 2px var(--primary)}
.acc{border-top:1px solid var(--line)}
.acc:first-of-type{border-top:none}
.acc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer;border-radius:8px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--bg)}
.acc summary .chev{color:var(--ink-400);font-size:11px;transition:transform .15s;flex-shrink:0}
.acc summary .vsub{font-size:12px;font-weight:400;color:var(--ink-400)}
.acc[open] summary .chev{transform:rotate(90deg)}
.acc summary .tt{font-size:13.5px;font-weight:600;color:var(--ink-900)}
.acc summary .sm{font-size:11.5px;color:var(--ink-400)}
.acc summary .end{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}
.acc .inner{padding:2px 2px 16px 23px;width:100%}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin:6px 0 2px}
.wathread{display:flex;flex-direction:column;gap:10px}
.wamsg{background:#f8fafc;border-radius:10px;padding:8px 11px}
.wah{font-size:11px;font-weight:600;color:var(--ink-700);display:flex;justify-content:space-between;gap:10px}
.wah span{font-weight:400;color:var(--ink-400)}
.wab{font-size:12.5px;color:var(--ink-800);margin-top:3px;line-height:1.45}
.qard{display:flex;flex-direction:column;gap:2px}
.qrow{padding:8px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:none}
.qrow .q{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400)}
.qrow .a{font-size:12.5px;color:var(--ink-800);margin-top:2px;line-height:1.45}
.pgrp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px;padding:6px 10px;background:#f8fafc;border-radius:8px;border-left:2px solid var(--line-2)}
.pgrp:first-child{margin-top:4px}
.pgrp .lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-700)}
.pgrp .ilink{font-size:11px;margin-left:auto}
.seance{border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;margin-bottom:8px;background:#fff}
.seance .sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--ink-500)}
.seance .sh b{font-size:12.5px;color:var(--ink-800)}
.seance .sb{font-size:12.5px;color:var(--ink-700);line-height:1.5;margin-top:4px}
.espadv{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:11px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.espadv b{color:var(--ink-800)}
.espadv .nx{color:var(--ink-600,#475569)}
.espadv .nx .k{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);margin-right:5px}
.espadv .nx.ok{color:var(--ok)}
.espadv .ilink{margin-left:0}
.acc.sub2acc{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.card.locked-fact{opacity:.75;background:#f8fafc;border-style:dashed}
.card.locked-fact .s{font-size:11px;color:var(--ink-500);margin-top:4px}
.pd2{font-size:10.5px;color:var(--ink-400);line-height:1.45;margin-top:4px}
.vbar{display:flex;justify-content:flex-end;gap:8px;margin:0 0 2px}
.vcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px;align-items:stretch}
.vcards>div{display:flex;flex-direction:column}
.vcards .card{flex:1;margin-bottom:0;display:flex;flex-direction:column}
.vcards .card .cnt{margin-top:auto}
.acc .inner .docs{max-width:none}
/* historique des to_do */
.hist{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.hist summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-500);list-style:none;display:flex;align-items:center;gap:6px}
.hist summary::before{content:"▸";font-size:10px;color:var(--ink-400);transition:transform .15s}
.hist[open] summary::before{transform:rotate(90deg)}
.hist summary:hover{color:var(--ink-700)}
.hist summary .n2{font-weight:400;color:var(--ink-400);font-size:11px}
.hrow{display:flex;gap:9px;font-size:13px;padding:3.5px 0;color:var(--ink-600,#475569);line-height:1.45;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.hrow .d{flex-shrink:0;width:118px;color:var(--ink-400);font-variant-numeric:tabular-nums}
.hrow .ck{color:var(--ok);flex-shrink:0}
.hrow .e{color:var(--ink-300);margin:0 2px}
.hrow .w{color:var(--ink-400)}
.task .fx{font-size:10px;color:var(--ok);background:var(--ok-50);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.task .note{flex:1 0 100%;font-size:11.5px;color:var(--ink-400);margin-top:-1px}
.sub{margin:2px 0 2px 21px;display:flex;flex-direction:column;gap:1px}
.waiting{margin-top:8px;font-size:11px;color:var(--warn);background:var(--warn-50);border-radius:6px;padding:5px 8px;line-height:1.4}
/* carte compacte */
.card.pointer{border:1.5px dashed var(--line-2);box-shadow:none;background:#fbfcfd}
.card.pointer:hover{border-color:#c7d2fe;background:#fff}
.card.pointer .t{color:var(--ink-700)}
.card.clickable{cursor:pointer}
.card.clickable:hover .t{color:var(--primary)}
.prog{height:4px;background:#f1f5f9;border-radius:999px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:#818cf8;transition:width .3s}
.prog i.full{background:#34d399}
.cnt{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.cnt b{font-weight:600;color:var(--ink-700)}
.nextt{display:flex;gap:6px;margin-top:5px;font-size:11.5px;color:var(--ink-700);line-height:1.35}
.nextt .k{flex-shrink:0;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);margin-top:1px}
.nextt .v{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nextt .who2{color:var(--ink-400)}
.opendetail{margin-top:8px;font-size:10.5px;color:var(--ink-400)}
.card.clickable:hover .opendetail{color:var(--primary)}
/* modal détail de carte */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px}
.mbox{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgb(0 0 0/.2);width:100%;max-width:520px;max-height:86vh;overflow-y:auto}
.mhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line-2);padding:16px 20px 12px;border-radius:14px 14px 0 0}
.mhead .row{display:flex;align-items:flex-start;gap:10px}
.mhead .t{font-size:16px;font-weight:600;color:var(--ink-900);letter-spacing:-.01em}
.mhead .s{font-size:12px;color:var(--ink-400);margin-top:2px}
.mclose{margin-left:auto;width:28px;height:28px;border-radius:7px;color:var(--ink-400);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.mclose:hover{background:var(--bg);color:var(--ink-700)}
.mstep{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-500)}
.mstep .pill{width:8px;height:8px;border-radius:50%;background:#818cf8}
.mbody{padding:14px 16px 16px;background:#f8fafc;border-radius:0 0 14px 14px}
.msec{font-size:12px;font-weight:600;color:var(--ink-900);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.msec .n2{font-weight:400;color:var(--ink-400);font-size:11px}
/* carte grisée */
.card.ghost{opacity:.62;background:#f8fafc}
.card.ghost .t,.card.ghost .s{color:var(--ink-400)}
.ghost-hint{margin-top:8px;font-size:11px;color:var(--ink-400);display:flex;align-items:center;gap:5px}
.popover{display:none;position:absolute;z-index:40;left:8px;right:8px;top:calc(100% - 6px);background:var(--ink-900);color:#e2e8f0;font-size:11.5px;line-height:1.55;padding:10px 12px;border-radius:9px;box-shadow:0 8px 24px rgb(0 0 0/.18)}
.card.ghost:hover .popover{display:block}
.popover a{color:#a5b4fc;font-weight:600;text-decoration:none;display:inline-block;margin-top:5px;cursor:pointer}
/* lignes facture mensuelle */
.lines{margin-top:8px;border-top:1px solid var(--line);padding-top:7px}
.lines .ln{display:flex;justify-content:space-between;font-size:11.5px;padding:2.5px 2px;color:var(--ink-700)}
.lines .ln.new{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--ok-50)}100%{background:transparent}}
.lines .ln .k{color:var(--ink-400)}
.lines .tot{display:flex;justify-content:space-between;font-size:12px;font-weight:600;border-top:1px solid var(--line-2);margin-top:4px;padding-top:5px;color:var(--ink-900)}
/* liste sessions closer */
.slist{display:flex;flex-direction:column;gap:10px;max-width:680px}
.slist.wide{max-width:none}
.slist.wide .srow{display:grid;grid-template-columns:1.5fr 1.4fr 1.25fr 190px;gap:18px;align-items:center}
.slist .fcell{display:flex;flex-direction:column;gap:2px}
.slist .fline{display:grid;grid-template-columns:74px 78px 1fr;gap:6px;font-size:11.5px;color:var(--ink-500);align-items:baseline}
.slist .fline .fq{font-weight:600;color:var(--ink-700)}
.slist .fline .fd{font-variant-numeric:tabular-nums}
.slist .fline .fr{color:var(--ink-400)}
.slist .fline.warn .fq,.slist .fline.warn .fr{color:#b45309}
.slist .fline.off{opacity:.5}
.slist .fline.off .fr{text-decoration:line-through}
.slist.wide .srow.shead{background:none;box-shadow:none;padding:2px 16px 0;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-400)}
.slist .scell .d2{font-size:13px;color:var(--ink-700)}
.slist .scell .d2.ko{color:var(--err)}
.slist .scell .v{font-size:11.5px;color:var(--ink-400);margin-top:2px}
.slist .scell.right{justify-self:end}
.slist.wide .ilink.d{font-size:13.5px;font-weight:600;color:var(--primary)}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.srow{background:#fff;border-radius:10px;box-shadow:var(--sh-carte);padding:13px 16px;display:flex;align-items:center;gap:14px}
.srow .d{font-size:13.5px;font-weight:600;color:var(--ink-900)}
.srow .v{font-size:12px;color:var(--ink-500)}
.srow .pl{margin-left:auto;font-size:12px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:500;transition:background .12s}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-dark)}
.btn-s{border:1px solid var(--line-2);color:var(--ink-700);background:#fff}.btn-s:hover{background:var(--bg)}
/* stubs */
.stub{background:#fff;border-radius:12px;box-shadow:var(--sh-carte);padding:22px;max-width:680px}
.stub h2{font-size:14px;font-weight:600;color:var(--ink-900);margin-bottom:6px}
.stub p{font-size:13px;color:var(--ink-500);line-height:1.6}
.stub ul{margin:10px 0 0 18px;font-size:13px;color:var(--ink-700);line-height:1.9}
.simnote{display:inline-flex;align-items:center;gap:6px;background:var(--warn-50);color:#92400e;font-size:11px;border-radius:999px;padding:3px 10px;margin-bottom:14px}
/* ── Apps simulées ──────────────────────────────── */
.appframe{border-radius:12px;overflow:hidden;box-shadow:var(--sh-carte);background:#fff;max-width:1060px}
/* apprenant */
.ap-head{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--line-2);background:rgba(255,255,255,.95)}
.ap-body{background:#f8fafc;padding:26px 22px;display:flex;flex-direction:column;gap:18px;align-items:center}
.ap-card{background:#fff;border-radius:12px;box-shadow:var(--sh-carte);width:100%;max-width:760px}
.ap-card .h{display:flex;justify-content:space-between;align-items:center;padding:14px 22px}
.ap-card .h h2{font-size:17px;font-weight:600;color:#0f172a}

.cal-bar.draft{background:#e2e8f0;color:var(--ink-700);box-shadow:none}
.cal-bar:hover{filter:brightness(.95)}
.seg{display:inline-flex;background:#f1f5f9;border-radius:8px;padding:3px;gap:2px;margin-top:4px}
.seg button{padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-500)}
.seg button.on{background:#fff;color:var(--ink-900);font-weight:600;box-shadow:var(--sh-carte)}
.mactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#modal2{position:fixed;inset:0;background:rgba(15,23,42,.3);z-index:220;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
#modal2 .mbox{max-width:520px;border-radius:18px;box-shadow:0 24px 64px rgb(15 23 42/.18)}
#modal2 .mhead{border-bottom:none;padding:20px 24px 4px}
#modal2 .mbody{background:#fff;padding:6px 24px 20px;border-radius:0 0 18px 18px}
#modal2 .mpanel{background:transparent;border:none;padding:14px 0;border-top:1.5px solid #cbd5e1}
#modal2 .mpanel:first-child{border-top:none}
.drow{display:flex;align-items:center;gap:12px}
.drow>div:first-child{flex:1}
.drow .tt{font-weight:600;color:var(--ink-900);font-size:13.5px}
.drow .sm{font-size:12px;color:var(--ink-400);margin-top:2px}
.dbtns{display:flex;gap:6px}
.k2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600}
.ul{margin:6px 0 0 18px;font-size:13px;color:var(--ink-700);line-height:1.7}
#modal[data-kind="newsession"] .igrid{grid-template-columns:repeat(2,1fr)}
#modal[data-kind="newsession"] .edin{margin-top:3px}
/* ── preuves v39 : par mois, par session ── */
.pvmonth{background:#fff;border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--sh-carte);margin-bottom:10px;overflow:hidden}
.pvmonth>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;background:#fff;padding:14px 18px}
.pvmonth[open]>summary{border-bottom:1px solid var(--line-2)}
.pvmonth .pvbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pvmonth .pvs{background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:none;margin:0;padding:0}
.pvmonth .pvs>summary{padding:10px 12px}
.pvmonth .pvs .inner{padding:0 12px 12px}
.pvmonth>summary::-webkit-details-marker{display:none}
.pvmonth .mt{font-size:15px;font-weight:600;color:var(--ink-900)}
.pvmonth .ms{font-size:12px;color:var(--ink-400);margin-top:2px}
.pvmonth .mpct{margin-left:auto;display:flex;align-items:center;gap:10px}
.pvmonth .mpct .bar{width:140px;height:6px;background:#f1f5f9;border-radius:999px;overflow:hidden}
.pvmonth .mpct .bar i{display:block;height:100%;background:#34d399;border-radius:999px}
.pvmonth .mpct b{font-size:15px;color:var(--ink-900);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.pvmonth.old .mt{color:var(--ink-500)}
.pvs summary .tt{font-size:13.5px}
.pvpct{font-size:13px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.pmat th .pname a{display:block;font-size:11.5px;line-height:1.35}
.pmat th{min-width:120px}

.accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px;margin-top:10px}
.accrow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:8px;font-size:13px;color:var(--ink-800);cursor:pointer}
.accrow:hover{background:#f8fafc}
.accrow.fixed{cursor:default;color:var(--ink-500)}
.sw{display:inline-block;width:34px;height:20px;border-radius:999px;background:#cbd5e1;position:relative;flex-shrink:0;transition:background .15s;cursor:pointer;vertical-align:middle}
.swrow{display:flex;align-items:center;gap:10px}
.ardduo{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.4fr);gap:14px 32px;margin-top:12px;align-items:start}
.ardleft{display:flex;flex-direction:column;gap:12px}
.ardright .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:600;margin-bottom:2px}
.closegrid{display:flex;flex-direction:column;gap:2px}
.closerow{display:grid;grid-template-columns:96px 132px 1fr auto;align-items:baseline;gap:14px;padding:9px 2px;border-top:1px solid var(--line);font-size:13px}
.closerow:first-child{border-top:none}
.closerow .fintxt{font-weight:500}
.closerow .cd{color:var(--ink-900);font-weight:500;font-variant-numeric:tabular-nums}
.closerow .cl{color:var(--ok);font-weight:600}
.closerow .cl.warn{color:var(--warn)}
.closerow .cl.off{color:var(--ink-400);font-weight:500}
.closerow .cr{justify-self:end;text-align:right;font-size:11.5px;color:var(--ink-400)}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.2);transition:left .15s}
.sw.on{background:var(--primary)}
.sw.on i{left:16px}
.accrow.fixed .sw.on{background:#a5b4fc}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){#sidebar{width:200px}.rolesel button{padding:4px 7px}}

/* fermeture des inscriptions ARD par mode de paiement : CPF = 11 jours ouvrés avant J1, entreprise = J-1, particulier = J-14 */
function ardClosings(card){
  if(!card.dt||!card.dt.j1) return [];
  const j1=new Date(card.dt.j1+"T12:00:00");
  const minusBiz=(d,n)=>{const x=new Date(d);let k=0;while(k<n){x.setDate(x.getDate()-1);if(x.getDay()!==0&&x.getDay()!==6)k++;}return x;};
  const minus=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()-n);return x;};
  const today=new Date(); today.setHours(12,0,0,0);
  const f=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
  return [["CPF",minusBiz(j1,11),"11 jours ouvrés avant le J1"],["Entreprise",minus(j1,1),"jusqu'à J-1"],["Particulier",minus(j1,14),"J-14"]].map(([lbl,d,rule])=>{
    const left=Math.round((d-today)/86400000);
    return {lbl,rule,date:f(d),left,txt:left<0?"fermée":left===0?"ferme aujourd'hui":left+" jour"+(left>1?"s":"")+" restant"+(left>1?"s":"")};
  });
}

function linkFld(label,key,obj,ed,txt){

  if(ed) return `<div class="fld"><div class="k">${label}</div><input class="edin" data-f="${key}" value="${url.replace(/"/g,"&quot;")}" placeholder="https://…"></div>`;
  return `<div class="fld"><div class="k">${label}</div><div class="v">${url?`<a class="dlink" href="${url}" target="_blank" rel="noopener">${txt||"Ouvrir"}</a>`:'<span class="muted">non renseigné</span>'}</div></div>`;
}

/* ════════════════════ MOTEUR ════════════════════ */
function tasksFor(card, colId){
  const def=KB[card.kb].tasks[colId]||[];
  return def.filter(tk=>(!tk.fin || tk.fin.includes(card.fin)) && (!tk.kind || tk.kind.includes(card.kind)));
}
function colsFor(card){ return KB[card.kb].cols.filter(c=>!c.fin || c.fin.includes(card.fin)); }
function key(card,colId,i){return card.id+"::"+colId+"::"+i}
function allDone(card){
  const tks=tasksFor(card,card.col);
  if(!tks.length) return false;
  return tks.every((tk,i)=>taskState(card,card.col,i,tk));
}
function nextCol(card){
  const cols=colsFor(card);
  let ix=cols.findIndex(c=>c.id===card.col);
  for(let j=ix+1;j<cols.length;j++){ if(!cols[j].skip) return cols[j]; }
  return null;
}
function colUnlocked(kb,col){ if(typeof col==="string") col=KB[kb].cols.find(c=>c.id===col); return !col.open || S.unlocked[kb+"::"+col.id]; }
function tryAdvance(card){
  if(!allDone(card)) return;
  const nc=nextCol(card);
  if(!nc) return;
  if(!colUnlocked(card.kb,nc)){ card.waiting=nc.id; render(); return; }
  card.waiting=null; card.col=nc.id; card.justMoved=true;
  toast(`Carte avancée : <b>${card.title}</b> → ${nc.label}`);
  render();
}
function runFx(card, tk, k){
  if(!tk.fx || S.fxDone[k]) return;
  if(tk.fxfin && !tk.fxfin.includes(card.fin)) return;
  S.fxDone[k]=true;
  if(tk.fx==="carte_client"){
    let kb,col;
    if(card.fin==="cpf"){kb="fact_cpf";col="sortie"}
    else if(card.fin==="opco"){kb="fact_opco";col="raf"}
    else if(card.fin==="fp_ent_vir"){kb="fact_fp";col="raf"}
    else {kb="fact_fp";col="attente"}
    const nid="dyn"+Math.floor(performance.now());
    const m = card.kb==="coaching"?"1 200 €":card.kb==="intra"?"7 900 €":"1 650 €";
    CARDS.push({id:nid,kb,offre:card.offre,sess:card.sess,dt:card.dt,lieu:card.lieu,title:card.title,fin:card.fin,m,src:card.id,col,fresh:1,
      ech:(card.fin==="fp_part"||card.fin==="fp_ent_man")?[["Échéance 1/1 · montant total · J+14 de la vente",0]]:null});
    toast(`${EV.carte_client} : <b>${card.title}</b> (${FIN[card.fin]?.lbl||""})`,1);
  }
  if(tk.fx==="carte_formateur"){
    const nid="dynf"+Math.floor(performance.now());
    const frm=card.frm||"Sarah K.";
    CARDS.push({id:nid,kb:"fact_frm",offre:card.offre,sess:card.sess,dt:card.dt,lieu:card.lieu,title:frm,frm,m:card.kb.startsWith("coaching")?"400 €":"1 400 €",srcTitle:card.title,col:"valider",fresh:1});
    toast(`${EV.carte_formateur} : <b>${frm}</b> · ${card.title}`,1);
  }
  if(tk.fx==="ligne_closer"){
    const m=CARDS.find(c=>c.id==="m1");
    m.lines.push(["Close · "+card.title,"165 €"]);
    m.newLine=true;
    toast(`${EV.ligne_closer} : <b>${card.title}</b>`,1);
  }
}
function canCheck(tk){ return tk.p===ROLE_OWNS[S.role] && !tk.auto; }
/* noir = j'en reponds (meme si c'est une automatisation ou le client qui agit) ; gris = quelqu'un d'autre */
function isMine(card,tk){ return responsableOf(card,tk)===ROLE_OWNS[S.role]; }
function clickTask(cardId,colId,i){
  const card=CARDS.find(c=>c.id===cardId);
  const tk=tasksFor(card,colId)[i];
  if(!canCheck(tk)) return;
  const k=key(card,colId,i);
  S.checks[k]=!S.checks[k];
  if(S.checks[k]) S.when[k]=new Date(); else delete S.when[k];
  if(S.checks[k]) runFx(card,tk,k);
  if(colId===card.col) tryAdvance(card);
  render();
}
function clickEch(cardId,j){ /* réservé : les échéances se pilotent depuis le bloc paiements */
  const card=CARDS.find(c=>c.id===cardId);
  card.ech[j].st=card.ech[j].st==="ok"?"":"ok";
  if(card.ech.every(e=>e.st==="ok")) toast(`Toutes les échéances encaissées : <b>${card.title}</b>`);
  tryAdvance(card);
  render();
}
function unlockCol(kb,colId){
  S.unlocked[kb+"::"+colId]=true;
  toast(`Étape ouverte en avance : les cartes prêtes peuvent maintenant y entrer.`);
  CARDS.filter(c=>c.kb===kb&&c.waiting===colId).forEach(c=>{c.waiting=null;tryAdvance(c)});
  render();
}

/* le mode de paiement s'écrit en texte, jamais en badge coloré */
function badge(fin){ if(!fin||!FIN[fin]) return ""; return `<span class="fintxt">${FIN[fin].lbl}</span>` }
function badgeOffre(offre){ if(!offre) return ""; return `<span class="badge b-offre">${OFFRES[offre]||offre}</span>` }
function isFact(card){ return card.kb.startsWith("fact_"); }
/* changer le mode de paiement d'une carte : elle change de rail de facturation */
function changeFin(card,v){
  card.fin=v;
  if(!isFact(card)) return;
  const kb = v==="cpf"?"fact_cpf" : v==="opco"?"fact_opco" : "fact_fp";
  if(kb!==card.kb){ card.kb=kb; card.col=KB[kb].cols.find(c=>!c.skip).id; }
  const mandat=["fp_part","fp_ent_man"].includes(v);
  if(mandat&&!card.ech) card.ech=[{n:"1/1",m:amtOf(card.m),d:(card.dt&&card.dt.echeance)||"2026-09-30",st:""}];
  if(!mandat) card.ech=null;
}
/* ── argent : facture Qonto, échéances, virements reçus ── */
function amtOf(str){ const m=String(str||"").match(/([\d\s\u00a0]+)\s*€/); return m?parseInt(m[1].replace(/\D/g,""),10)||0:0; }
function eur(n){ return n.toLocaleString("fr-FR",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+" €"; }
function fmtJour(iso){ return new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
function facUrl(f){ return "https://app.qonto.com/invoicing/client-invoices/"+f.num; }
/* le bloc paiements s'affiche sous la première tâche de constat de paiement de l'étape */
function payKind(card,tk){
  if(!isFact(card)||card.kb==="fact_frm"||card.kb==="fact_com") return null;
  const l=tk.t.toLowerCase();
  if(l.includes("edof vers bibby")) return null;
  if(tk.sub) return "ech";
  if(/constate le paiement|constate le règlement|encaisse|rejeu/.test(l)) return card.ech?"ech":"vir";
  return null;
}
function payPanel(card){
  const tot=amtOf(card.m), f=card.fac, enc=card.enc||[];
  const recu = card.ech ? card.ech.filter(e=>e.st==="ok").reduce((a,e)=>a+e.m,0) : enc.reduce((a,e)=>a+e.m,0);
  const reste=Math.max(0,tot-recu);
  let h=`<div class="paypanel"><div class="pph"><span class="ttl">Paiements</span>`
    +(f?`<span>facture <a class="ilink" href="${facUrl(f)}" target="_blank" rel="noopener">${f.num}</a> · ${eur(tot)}</span>`:`<span>facture pas encore générée · ${eur(tot)}</span>`)
    +`<span class="rest ${reste?"":"ok"}">${reste?"Reste dû "+eur(reste):"Soldée"}</span></div>`;
  if(card.ech){
    h+=`<table class="paytbl">`+card.ech.map((e,j)=>`<tr><td class="lib">Échéance ${e.n}</td><td class="dt">${fmtJour(e.d)}</td><td class="amt">${eur(e.m)}</td><td class="act">`
      +(e.st==="ok"?`<span class="chip ok">Encaissée</span>`
        :e.st==="ko"?`<span class="chip" style="background:var(--err-50);color:var(--err)">Refusée</span> <button class="btn-xs" data-rejeu="${card.id}::${j}">Rejouer</button>`
        :`<span class="chip">À venir</span>`)+`</td></tr>`).join("")+`</table>`;
  } else if(enc.length){
    h+=`<table class="paytbl">`+enc.map(e=>`<tr><td class="dt">${fmtJour(e.d)}</td><td class="lib">${e.lib}<div style="color:var(--ink-400);font-size:10.5px">${e.ref||""}</div></td><td class="amt">+${eur(e.m)}</td><td class="act"><span class="chip ok">Rapproché</span></td></tr>`).join("")+`</table>`;
  } else {
    h+=`<div class="paynone">Aucun virement rattaché à cette facture pour l'instant.</div>`;
  }
  if(reste>0&&!card.ech) h+=rapBlock(card);
  return h+`</div>`;
}
function rapBlock(card){
  const q=(S.rapQ||"").toLowerCase();
  const list=QONTO_ENC.filter(t=>!q||[t.lib,t.ref,String(t.m)].join(" ").toLowerCase().includes(q));
  return `<details class="payrap" data-k="rap"${S.rapOpen?" open":""}><summary><span class="chev">▸</span>Rapprocher un virement reçu <span class="sub2">${QONTO_ENC.length} virement(s) sans facture sur le compte Qonto</span></summary>
    <div class="payq">${ICO.search}<input type="text" data-fq="rapQ" value="${(S.rapQ||"").replace(/"/g,"&quot;")}" placeholder="Nom, référence, montant…"></div>
    <table class="paytbl">`
    +(list.map(t=>`<tr><td class="dt">${fmtJour(t.d)}</td><td class="lib">${t.lib}<div style="color:var(--ink-400);font-size:10.5px">${t.ref}</div></td><td class="amt">+${eur(t.m)}</td><td class="act"><button class="btn-xs p" data-rap="${card.id}::${t.id}">Rapprocher</button></td></tr>`).join("")

const ACTEUR_PREFIXES=[["Admin France IA","France IA"],["France IA","France IA"],["Formateur","Formateur"],["Closeur","Closeur"],["Setteur","Setteur"],["Client","Client"],["Apprenant","Apprenant"]];
function splitActeur(tk,lbl){
  const t=lbl||tk.t;
  for(const pair of ACTEUR_PREFIXES){
    if(t.startsWith(pair[0]+" ")) return {who:pair[1], what:t.slice(pair[0].length+1)};

   à défaut, la première qui reste, pour savoir qui on attend. */
function prochaineTache(card,colId){

function taskHtml(card,colId,i,tk,ghost){

function openDateStr(card,col){
  if(!col||!col.rule) return null;
  const d=card.dt||{}; let base=null,off=0;
  if(col.rule==="j-14"){base=d.j1;off=-14}
  else if(col.rule==="j2"){base=d.j2}
  else if(col.rule==="j2+1"){base=d.j2;off=1}
  else if(col.rule==="prevue"){base=d.prevue}
  else if(col.rule==="echeance"){base=d.echeance}
  else if(col.rule==="fin_mois"){base="2026-08-31"}
  if(!base) return "date à confirmer";
  const dt=new Date(base+"T12:00:00"); dt.setDate(dt.getDate()+off);
  return "le "+dt.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
}
/* Deux natures d'automatisme, que le libellé distingue déjà :
   « (automatique) » = DELIV'IA le fait en entrant dans l'étape, donc c'est fait ;
   « (détecté automatiquement) » = DELIV'IA attend un signal du dehors, donc ça reste en attente. */
function autoFaite(tk){ return !!tk.auto && !/détect|constate/i.test(tk.t); }
function autoAttente(tk){ return !!tk.auto && !autoFaite(tk); }
function taskState(card,colId,i,tk){
  if(autoFaite(tk)) return true;
  if(tk.sub&&card.ech) return card.ech.every(e=>e.st==="ok");
  if(tk.todoRef){const its=todoRefItems(card,tk); return its.length>0 && its.every(x=>x.done);}
  if(tk.apTodo){const k=key(card,colId,i), aps=peopleFor(card).aps;
    return aps.length>0 && aps.every((_,ai)=>apTodoItems().every((_,j)=>S.checks[k+"::"+ai+"::"+j]));}
  return !!S.checks[key(card,colId,i)];
}
/* inscrits réels / en cours (dont réservations) / capacité d'une session */
function sessCounts(card){
  const sess=card.sess; const cap=card.cap||12;
  if(!sess) return {ins:0,enc:0,cap,over:false,risk:false,txt:"0 sur "+cap};
  const list=CARDS.filter(i=>i.kb==="insc"&&i.sess===sess&&i.col!=="lost"&&!i.movedFrom);
  const ins=list.filter(i=>["validee","absent","termine"].includes(i.col)).length;
  const enc=list.length-ins;
  return {ins,enc,cap,over:ins>cap,risk:ins<=cap&&ins+enc>cap,txt:`${ins} sur ${cap}${enc?" · "+enc+" en cours":""}`};
}
function placesBadge(card,alerteSeule){

}

/* Deux rôles par tâche, jamais confondus : celui qui AGIT (tk.p, lu dans le libellé)
   et celui qui en RÉPOND. La règle maison : le closeur répond de son client tant qu'on est
   dans la vente, France IA reprend la main sur l'administratif (CPF, OPCO, convention) et
   répond de ce que le formateur doit faire sur un rail France IA. `tk.resp` force le cas
   particulier. */
function responsableOf(card,tk){
  if(tk.resp) return tk.resp;
  const kb=card.kb;
  if(tk.p==="formateur" && !kb.endsWith("_frm")) return "fia";
  if(tk.p!=="client") return tk.p;
  if(kb.startsWith("session")||kb.startsWith("intra")||kb.startsWith("coaching")) return "fia";
  if(["cpf","opco"].includes(card.fin)) return "fia";
  return "closer";
}
/* le même couple, hors carte : dans le paramétrage on ne connaît pas le financement */
function respLabelKb(kb,tk){
  if(tk.resp) return ACTEURS[tk.resp]||tk.resp;
  if(tk.p==="formateur" && !kb.endsWith("_frm")) return ACTEURS.fia;
  if(tk.p!=="client") return ACTEURS[tk.p]||tk.p;
  if(kb.startsWith("session")||kb.startsWith("intra")||kb.startsWith("coaching")) return ACTEURS.fia;
  return "Closeur, France IA si CPF ou OPCO";
}
/* l'étiquette d'une tâche : le responsable, puis celui qui agit quand ce n'est pas la même personne */
function whoTag(card,tk,who){
  if(!who) return "";
  const respL=ACTEURS[responsableOf(card,tk)]||"";
  if(!respL||respL===who) return `<span class="who">${who}</span>`;
  return `<span class="who duo2" title="${respL} en répond, ${who} fait l'action"><b>${respL}</b><span class="sep">▸</span>${who}</span>`;
}
/* noir = j'en suis responsable ; gris = quelqu'un d'autre en répond, ou rien à faire */
function cardState(card,colId){
  if(card.waiting) return "locked";
  const tks=tasksFor(card,colId);
  const nextTk=tks.find((tk,i)=>!taskState(card,colId,i,tk));
  if(!nextTk) return "other";
  if(nextTk.auto && nextTk.p!=="client") return "other";
  return responsableOf(card,nextTk)===ROLE_OWNS[S.role] ? "mine" : "other";
}

function historyFor(card){
  const cols=colsFor(card);
  const curIx=cols.findIndex(c=>c.id===card.col);
  const past=cols.slice(0,curIx).filter(c=>!c.skip);
  const rows=[];
  const b=birthRow(card);
  const origin=new Date(); origin.setDate(origin.getDate()-(past.length+1)*4);
  if(b) rows.push({d:b.d||origin,t:b.t,ev:1,e:cols[0].label});
  past.forEach((col,j)=>{
    const base=new Date(); base.setDate(base.getDate()-(past.length-j)*4);
    tasksFor(card,col.id).forEach((tk,i)=>{
      const k=key(card,col.id,i);
      const d=S.when[k]?new Date(S.when[k]):(()=>{const x=new Date(base);x.setHours(9+((i*2)%8),(i*17)%60,0,0);return x})();
      rows.push({d,t:tk.t,who:splitActeur(tk).who,what:splitActeur(tk).what,e:col.label,mine:isMine(card,tk),tag:whoTag(card,tk,splitActeur(tk).who)});
      const ev=evFor(card,tk); if(ev) rows.push({d:new Date(d.getTime()+60000),t:EV[ev],ev:1,e:col.label});
    });
  });
  tasksFor(card,card.col).forEach((tk,i)=>{
    if(taskState(card,card.col,i,tk)){
      const k=key(card,card.col,i);
      const d=S.when[k]?new Date(S.when[k]):new Date();
      rows.push({d,t:tk.t,who:splitActeur(tk).who,what:splitActeur(tk).what,e:cols[curIx].label,mine:isMine(card,tk),tag:whoTag(card,tk,splitActeur(tk).who)});
      const ev=evFor(card,tk); if(ev) rows.push({d:new Date(d.getTime()+60000),t:EV[ev],ev:1,e:cols[curIx].label});
    }
  });
  rows.sort((a,b)=>a.d-b.d);
  return rows;
}

  if(l.includes("caler la ou les séances")) return {n:"Proposition de créneaux",c:W,b:"Bonjour {{prenom}} 👋 Pour votre coaching de {{nb_heures}} h, je vous propose ces créneaux : {{creneaux}}. Lequel vous conviendrait ?"};
  if(l.includes("attentes")) return {n:"Demande des attentes",c:W,b:"Bonjour {{prenom}}, avant notre séance, pouvez-vous me préciser en quelques lignes vos attentes et le cas d'usage sur lequel vous aimeriez avancer ?"};
  return {n:"Modèle de message",c:E,b:"Bonjour {{prenom}},\n[Contenu du template à rédiger dans l'onglet Templates.]\nBien cordialement,\nL'équipe France IA"};
}

function peopleFor(card){
  const srcId = card.src || card.id;
  let cl = CLIENTS.find(c=>(c.ventes||[]).some(v=>v.inscId===srcId||v.factId===card.id||v.inscId===card.id));
  let aps = APPRENANTS.filter(a=>a.insc.includes(srcId)||a.insc.includes(card.id));
  if(!cl && aps.length && aps[0].client) cl=CLIENTS.find(c=>c.id===aps[0].client);
  if(!aps.length && cl) aps=(cl.apprenants||[]).map(id=>APPRENANTS.find(a=>a.id===id)).filter(Boolean);
  return {cl,aps};
}
function infoFor(card){
  const rows=[];
  const {cl,aps}=peopleFor(card);
  const clName = cl ? `<a class="ilink" data-fiche="client::${cl.id}">${cl.nom}</a>` : null;
  const apsHtml = aps.map(a=>`<a class="ilink" data-fiche="apprenant::${a.id}">${a.nom}</a>`);
  if(card.kb==="fact_com"){
    rows.push([card.fin==="closer"?"Closeur":"Setteur",card.who],["Mois",card.mois]);
    return rows;
  }
  if(card.kb==="fact_frm"){
    rows.push(["Formateur",card.frm],["Session",card.srcTitle||(card.sess?SESS[card.sess].lbl:"")],["Offre",OFFRES[card.offre]],["Date",fmtDates(card)],["Lieu",card.lieu],["Montant",card.m]);
    return rows;
  }
  if(card.kb.startsWith("session")){
    rows.push(["Session",card.kb==="session_fia"?`<a class="ilink" data-fiche="session::${card.id}">${card.title}</a>`:card.title],["Offre",OFFRES[card.offre]],["Dates",fmtDates(card)]);
    if(card.lieuJ2&&card.lieuJ2!==card.lieu) rows.push(["Lieu J1",ntag(card.lieu,"bleu")],["Lieu J2",ntag(card.lieuJ2,"bleu")]); else rows.push(["Lieu J1 et J2",ntag(card.lieu,"bleu")]);
    if(card.salle) rows.push(["Salle",ntag(card.salle,"violet")]);
    rows.push(["Formateur",card.frm?ntag(card.frm,"vert"):"À confirmer"],["Inscrits",(()=>{const c=sessCounts(card);return `<b>${c.ins}</b> inscrit${c.ins>1?"s":""} · <b>${c.enc}</b> en cours · ${c.cap} places ${c.over?'<span class="badge b-over">Surbooking</span>':c.risk?'<span class="badge b-risk">Risque de surbooking</span>':""}`})()]);
    return rows;
  }
  if(card.kb==="intra_frm"||card.kb==="coaching_frm"){
    rows.push(["Client",clName||card.title],["Offre",OFFRES[card.offre]+(card.nb?" · "+card.nb:"")],["Date",fmtDates(card)||"À caler"],["Lieu",card.lieu]);
    return rows;
  }
  /* inscription et facturation client */
  rows.push(["Client",clName||card.title]);
  if(apsHtml.length) rows.push([aps.length>1?"Apprenants · "+aps.length:"Apprenant",apsHtml.join(", "),aps.length>2?"wide":""]);
  else rows.push(["Apprenants","À renseigner par le client"]);
  if(isFact(card)) rows.push(["Mode de paiement",FIN[card.fin]?FIN[card.fin].lbl:""]);
  else rows.push(["Offre",OFFRES[card.offre]+(card.nb?" · "+card.nb:"")]);
  rows.push(["Date",fmtDates(card)||"À caler"],["Lieu",card.lieu||"À confirmer"]);
  const src = card.src ? CARDS.find(c=>c.id===card.src) : card;
  rows.push(["Closeur / Setteur",[src&&src.closer,src&&src.setter].filter(Boolean).join(" / ")||"Sans setteur"]);
  if(isFact(card)) rows.push(["Montant",card.m]);
  else rows.push(["Transmission ARD",card.ard?fmtDT(card.ard):null]);
  return rows;
}

function chips(list, active, onKey){

  return h+`</div>`;
}

  const q=(S.fSessQ||"").toLowerCase();
  const list=CARDS.filter(c=>c.kb==="session_fia"&&c.offre===f
    &&(S.fSessLieu==="all"||c.lieu===S.fSessLieu)
    &&(S.fSessFrm==="all"||(S.fSessFrm==="none"?!c.frm:c.frm===S.fSessFrm))

  if(S.fSessView==="cal") h+=calendarHtml(list);
  else if(S.fSessView==="list"){

  }
  else h+=boardHtml("session_fia", list);
  return h;
}

function calendarHtml(list){
  const [y,m]=S.calMonth.split("-").map(Number);
  const first=new Date(y,m-1,1); const start=(first.getDay()+6)%7; const days=new Date(y,m,0).getDate();
  const lbl=first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const prev=new Date(y,m-2,1), next=new Date(y,m,1);
  const key=d=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  let h=`<div class="calhead"><button class="btn btn-s" data-chip="calMonth::${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}">‹</button><b>${lbl.charAt(0).toUpperCase()+lbl.slice(1)}</b><button class="btn btn-s" data-chip="calMonth::${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,"0")}">›</button></div>`;
  h+=`<div class="cal"><div class="cal-wk head">`+["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(d=>`<div class="cal-dh">${d}</div>`).join("")+`</div>`;
  /* semaines : cellules de jour en fond, barres continues par-dessus (une session sur deux jours = une seule barre) */
  const cells=[]; for(let i=0;i<start;i++) cells.push(null); for(let d=1;d<=days;d++) cells.push(d); while(cells.length%7) cells.push(null);
  for(let w=0;w<cells.length/7;w++){
    const wk=cells.slice(w*7,w*7+7);
    const kOf=i=>wk[i]?key(wk[i]):null;
    const bars=[]; const lanes=[];
    list.filter(c=>c.dt&&c.dt.j1).forEach(c=>{
      let a=-1,bb=-1;
      for(let i=0;i<7;i++){const k=kOf(i); if(!k) continue; if(c.dt.j1<=k&&k<=c.dt.j2){ if(a<0)a=i; bb=i; }}
      if(a<0) return;
      let lane=0; while(lanes[lane]&&lanes[lane].some(([x,yy])=>!(bb<x||a>yy))) lane++;
      (lanes[lane]=lanes[lane]||[]).push([a,bb]);
      bars.push({c,a,bb,lane});
    });
    const nl=Math.max(1,lanes.length);
    h+=`<div class="cal-wk" style="grid-template-rows:22px repeat(${nl},24px) 8px">`;
    wk.forEach((d,i)=>{const k=d?key(d):null; h+=`<div class="cal-d ${d?"":"off"} ${k==="2026-09-12"?"today":""}" style="grid-column:${i+1};grid-row:1 / span ${nl+2}">${d?`<span class="n">${d}</span>`:""}</div>`;});
    bars.forEach(({c,a,bb,lane})=>{h+=`<div class="cal-bar ${c.col==="brouillon"?"draft":""}" ${c.lienAttr||`data-open="${c.id}"`} style="grid-column:${a+1} / span ${bb-a+1};grid-row:${lane+2}" title="${c.title}">${c.ville||c.title}${c.frm?" · "+c.frm:""}<span class="cb-n">${sessCounts(c).txt}</span></div>`;});
    h+=`</div>`;
  }
  return h+`</div>`;
}

function actionsUrgence(d){
  if(!d) return 3;
  const auj=new Date().toISOString().slice(0,10);
  if(d<auj) return 0;
  if(d===auj) return 1;
  const j7=new Date(); j7.setDate(j7.getDate()+7);
  return d<=j7.toISOString().slice(0,10) ? 2 : 3;
}

    const tks=tasksFor(c,c.col);

      closer:   {n1:{kb:"insc",acces:"lecture"}, n2:{kb:"insc",acces:"lecture"}, intra:{kb:"intra",acces:"lecture"}, coaching:{kb:"coaching",acces:"lecture"}},
      formateur:{n1:null, n2:null, intra:{kb:"intra_frm"}, coaching:{kb:"coaching_frm"}},
      setter:   {n1:null, n2:null, intra:null, coaching:null}}},
  facturation:{
    axes:[["Mode de paiement",[["cpf","CPF"],["mandat","Mandat"],["virement","Virement"],["opco","OPCO"]]],
          ["Externes",[["formateur","Facturation formateur"],["closeur","Facturation closeur"],["setteur","Facturation setteur"]]]],
    vues:{
      admin:    {cpf:{kb:"fact_cpf",cas:"cpf"}, mandat:{kb:"fact_fp",cas:"fp_ent_man"}, virement:{kb:"fact_fp",cas:"fp_ent_vir"}, opco:{kb:"fact_opco",cas:"opco"}, formateur:{kb:"fact_frm"}, closeur:{kb:"fact_com"}, setteur:{kb:"fact_com"}},
      closer:   {cpf:null, mandat:{kb:"fact_fp",cas:"fp_ent_man"}, virement:{kb:"fact_fp",cas:"fp_ent_vir"}, opco:{kb:"fact_opco",cas:"opco"}, formateur:null, closeur:{kb:"fact_com",note:"sa propre facture mensuelle"}, setteur:null},
      formateur:{cpf:null, mandat:null, virement:null, opco:null, formateur:{kb:"fact_frm",note:"sa propre facture de prestation"}, closeur:null, setteur:null},
      setter:   {cpf:null, mandat:null, virement:null, opco:null, formateur:null, closeur:null, setteur:{kb:"fact_com",note:"sa propre facture mensuelle"}}}},
};
function railOffres(page){ return (RAIL_MAP[page]||RAIL_MAP.sessions).axes.flatMap(a=>a[1]); }
function railCible(page,offre,role){ const m=RAIL_MAP[page]||RAIL_MAP.sessions; return (m.vues[role]||{})[offre]||null; }
/* l'accès d'un rôle à un rail est modifiable ici : la valeur posée à la main prime sur celle d'origine */
function railAcces(page,offre,role){
  const k=page+"::"+offre+"::"+role;
  if(S.railAcc[k]) return S.railAcc[k];
  const c=railCible(page,offre,role);
  return !c?"aucun":(c.acces==="lecture"?"lecture":"plein");
}
function railColMasquee(kb,role,colId){ return !!S.railColAcc[kb+"::"+role+"::"+colId]; }
const CAS_FIN=[["cpf","CPF"],["fp_ent_man","Ent. mandat"],["fp_ent_vir","Ent. virement"],["opco","OPCO"],["fp_part","Particulier"]];
const CAS_COURT={cpf:"CPF",fp_ent_man:"Mandat",fp_ent_vir:"Virement",opco:"OPCO",fp_part:"Particulier"};
const ACTEURS={fia:"France IA",closer:"Closeur",setter:"Setteur",formateur:"Formateur",client:"Client"};
const ACTIONS_CABLEES=["Générer la facture","Générer le devis","Générer la convention","Générer le mandat de prélèvement","Déclarer l'entrée WEDOF","Déclarer la sortie WEDOF","Lancer la session Qualiobee","Créer le groupe WhatsApp","Ouvrir les émargements Qualiobee","Envoyer la demande de signature","Ouvrir EDOF","Déposer un fichier"];
/* une étape terminale ne porte aucune tâche : c'est voulu, le contrôle ne doit pas le reprocher */
["terminee","termine","final","lost"].forEach(id=>Object.values(KB).forEach(d=>{
  const c=d.cols.find(x=>x.id===id); if(c) c.vide=1;
}));
/* l'absence n'a de conséquence réglementaire qu'en CPF : cette étape ne concerne que ce cas */
(KB.insc.cols.find(c=>c.id==="absent")||{}).cas=["cpf"];
function natureTk(tk){ return tk.auto?["auto","Automatique"] : (tk.btn||tk.btnAuto)?["cablee",tk.btn||tk.btnAuto] : ["simple","Simple"]; }
function railUtiliseFin(kb){ const d=KB[kb]; return d.cols.some(c=>(d.tasks[c.id]||[]).some(t=>t.fin)); }
function railAnos(kb){
  const d=KB[kb], out=[], parCas=railUtiliseFin(kb);
  d.cols.forEach(c=>{
    const tks=d.tasks[c.id]||[];
    tks.forEach(tk=>{ if(tk.fin && !tk.fin.length) out.push(`« ${tk.t} » n'est active dans aucun cas : elle ne s'affichera jamais.`); });
    if(c.vide) return;
    if(!tks.length && !c.skip) out.push(`L'étape « ${c.label} » ne porte aucune tâche.`);
    else if(parCas) CAS_FIN.filter(([k])=>!c.cas||c.cas.includes(k)).forEach(([k,lbl])=>{
      if(!tks.some(t=>!t.fin||t.fin.includes(k))) out.push(`À l'étape « ${c.label} », le cas ${lbl} n'a aucune tâche.`);
    });
  });
  return out;
}

function pageRail(){
  const page=S.rail.page, m=RAIL_MAP[page]||RAIL_MAP.sessions;
  const offres=railOffres(page).map(o=>o[0]);
  const offre=offres.includes(S.rail.offre)?S.rail.offre:offres[0];
  const role=RAIL_ROLES.some(r=>r[0]===S.railRole)?S.railRole:"admin";
  const cible=railCible(page,offre,role), acces=railAcces(page,offre,role);
  const offreLbl=(railOffres(page).find(o=>o[0]===offre)||[])[1];
  const roleLbl=(RAIL_ROLES.find(r=>r[0]===role)||[])[1];
  const vue=S.railVue==="apercu"?"apercu":"matrice";
  let h=`<button class="backbtn" data-railback="1">← Retour au paramétrage des rails</button>`;
  h+=`<div class="pagehead row"><h1>Paramétrer les étapes et les tâches</h1></div>`;
  /* les mêmes filtres que la page réelle, puis le rôle qui regarde */
  h+=`<div class="fbar">`+chips(m.axes, offre, "railOffre")+`</div>`;
  h+=`<div class="fbar">`+chips([["Vue utilisateur",RAIL_ROLES]], role, "railRole")
    +chips([["Vue",[["matrice","Matrice"],["apercu","Aperçu"]]]], vue, "railVue")+`</div>`;

  /* le rôle n'a pas ce rail : on le dit, et on peut lui ouvrir */
  if(acces==="aucun"){
    return h+`<div class="railacc none"><div class="ra-t">${roleLbl} ne voit pas « ${offreLbl} »</div>
      <div class="ra-s">${cible?"L'accès a été retiré ici.":"Ce rail n'existe pas dans sa vision : rien ne s'affiche dans son menu."}</div>
      <div class="ra-b"><button class="btn btn-s" data-railacc="${page}::${offre}::${role}::lecture">Ouvrir en lecture seule</button>
      <button class="btn btn-p" data-railacc="${page}::${offre}::${role}::plein">Ouvrir avec les tâches</button></div></div>`;
  }
  const kb=cible?cible.kb:null;
  if(!kb) return h+`<div class="railacc none"><div class="ra-t">Aucun rail derrière cette combinaison</div></div>`;
  const d=KB[kb];
  const parCas=railUtiliseFin(kb);
  const cas=CAS_FIN.some(c=>c[0]===S.railCas)?S.railCas:(cible.cas||"cpf");

  /* la ligne d'accès : c'est ici qu'on modifie ce que ce rôle voit */
  if(role!=="admin"){
    h+=`<div class="railacc"><div class="ra-l"><b>${roleLbl}</b> ${acces==="lecture"?"voit ce rail en lecture seule":"voit ce rail et coche ses tâches"}${cible.note?` <span class="sm">· ${cible.note}</span>`:""}</div>
      <div class="ra-seg"><button class="${acces==="plein"?"on":""}" data-railacc="${page}::${offre}::${role}::plein">Avec les tâches</button><button class="${acces==="lecture"?"on":""}" data-railacc="${page}::${offre}::${role}::lecture">Lecture seule</button><button data-railacc="${page}::${offre}::${role}::aucun">Aucun accès</button></div></div>`;
  }

  /* contrôle de cohérence */
  const anos=railAnos(kb);
  h+=anos.length
    ? `<div class="railano"><div class="k">${anos.length} point${anos.length>1?"s":""} à regarder dans ce rail</div><ul>`+anos.slice(0,6).map(a=>`<li>${a}</li>`).join("")+(anos.length>6?`<li class="sm">et ${anos.length-6} autre(s)</li>`:"")+`</ul></div>`
    : "";

  if(vue==="matrice"){
    /* le rail se lit comme son kanban : une colonne par étape, dans l'ordre de progression,
       et dans chaque colonne les tâches en trois colonnes claires. */
    h+=`<div class="board railboard">`;
    h+=d.cols.map(c=>{
      const tks=d.tasks[c.id]||[];
      const masq=role!=="admin"&&railColMasquee(kb,role,c.id);
      const mienne=tk=>ROLE_OWNS[role]===tk.p;
      let head=`<div class="col railcol ${masq?"masq":""}"><div class="col-h"><span class="pill"></span><h3>${c.label}</h3><span class="n">${tks.length}</span></div>`;
      const notes=[];
      if(c.open) notes.push(`Ouverture : ${c.open}`);
      if(c.cas) notes.push(`Seulement ${c.cas.map(k=>(CAS_FIN.find(x=>x[0]===k)||[])[1]).join(", ")}`);
      if(c.vide) notes.push(`Étape terminale, aucune tâche attendue`);
      if(masq) notes.push(`Masquée pour ${roleLbl.toLowerCase()}`);
      if(notes.length) head+=`<div class="col-open">${notes.join(" · ")}</div>`;
      head+=`<div class="colbody">`;
      head+=`<div class="rt-head"><span>Responsable</span><span>Acteur</span><span>Action</span></div>`;
      head+=(tks.map((tk,i)=>{
        const nat=natureTk(tk);
        const coche = role!=="admin" && mienne(tk) && !tk.auto && acces==="plein" && !masq;
        return `<div class="rtask">
          <span class="rt-c">${respLabelKb(kb,tk)}</span>
          <span class="rt-c">${ACTEURS[tk.p]||tk.p}</span>
          <div class="rt-do">
            <div class="rt-lbl">${tk.t}</div>
            ${tk.grp?`<div class="rt-sm">${tk.grp}</div>`:""}
            ${tk.todoRef?`<div class="rt-sm">les to do du formateur, repliées sur la carte</div>`:""}
            ${tk.apTodo?`<div class="rt-sm">une sous-carte par apprenant</div>`:""}
            <div class="rt-cas">`
              +(parCas?CAS_FIN.map(([k,lbl])=>{const on=!tk.fin||tk.fin.includes(k);
                  return `<span class="rt-p ${on?"on":""}" ${role==="admin"?`data-tkcas="${kb}::${c.id}::${i}::${k}"`:""} title="${lbl}">${CAS_COURT[k]||lbl}</span>`}).join("")
                :`<span class="rt-p on">tous les cas</span>`)
              +(nat[0]==="simple"?"":`<span class="rt-nat ${nat[0]}">${nat[1]}</span>`)
              +(tk.tpl?`<span class="rt-p tpl" data-tpl="${encodeURIComponent(tk.t)}">template</span>`:"")
              +(coche?`<span class="rt-p on">${roleLbl} coche</span>`:"")
            +`</div>
            ${role==="admin"?`<div class="rt-acts"><a class="ilink" data-tkmove="${kb}::${c.id}::${i}::-1">↑</a><a class="ilink" data-tkmove="${kb}::${c.id}::${i}::1">↓</a><a class="ilink" data-tkedit="${kb}::${c.id}::${i}">Modifier</a><a class="ilink danger" data-tkdel="${kb}::${c.id}::${i}">Supprimer</a></div>`:""}
          </div></div>`;
      }).join("")||`<div class="rt-vide">Aucune tâche à cette étape.</div>`);
      head+=`<div class="rt-add">${role==="admin"
        ? `<button class="btn btn-s" data-tknew="${kb}::${c.id}">+ Tâche</button>${tks.length?"":`<button class="btn btn-s danger" data-coldel="${kb}::${c.id}">Supprimer l'étape</button>`}`
        : `<button class="btn btn-s" data-railcol="${kb}::${role}::${c.id}">${masq?"Rendre visible":"Masquer pour "+roleLbl.toLowerCase()}</button>`}</div>`;
      return head+`</div></div>`;
    }).join("");
    if(role==="admin") h+=`<div class="col railcol railnew"><button class="btn btn-s" data-colnew="${kb}">+ Ajouter une étape</button></div>`;
    h+=`</div>`;
  } else {
    h+=`<div class="fbar">`+(parCas?chips([["Cas",CAS_FIN]], cas, "railCas"):`<span class="sm">Ce rail ne dépend pas du mode de paiement : toutes les cartes voient les mêmes tâches.</span>`)+`</div>`;
    h+=`<div class="railhint">Le rail tel que ${role==="admin"?"l'admin":roleLbl.toLowerCase()} le verra${parCas?` pour une carte ${(CAS_FIN.find(x=>x[0]===cas)||[])[1]}`:""}${acces==="lecture"?", en lecture seule":""}.</div>`;
    h+=`<div class="board apercuboard">`;
    h+=d.cols.filter(c=>!(role!=="admin"&&railColMasquee(kb,role,c.id))).map(c=>{
      const tks=(d.tasks[c.id]||[]).filter(tk=>!tk.fin||tk.fin.includes(cas));
      let last="";
      return `<div class="col"><div class="col-h"><span class="pill"></span><h3>${c.label}</h3><span class="n">${tks.length}</span></div>`
        +(c.open?`<div class="col-open">Ouverture : ${c.open}</div>`:"")
        +`<div class="colbody">`
        +(tks.map(tk=>{ const g=tk.grp&&tk.grp!==last?`<div class="tgrp">${tk.grp}</div>`:""; last=tk.grp||last;
          const nat=natureTk(tk);
          const sienne=role!=="admin"&&ROLE_OWNS[role]===tk.p;
          return g+`<div class="aptask ${sienne?"mine":""}"><span class="box"></span>
            <div class="ap-x"><div class="ap-t">${tk.t}</div>
            <div class="ap-m"><span class="rt-p on">${respLabelKb(kb,tk)}${(ACTEURS[tk.p]&&respLabelKb(kb,tk)!==ACTEURS[tk.p])?" ▸ "+ACTEURS[tk.p]:""}</span>${nat[0]==="simple"?"":`<span class="rt-nat ${nat[0]}">${nat[1]}</span>`}${tk.tpl?`<span class="rt-p tpl">template</span>`:""}</div></div></div>`;
        }).join("")||`<div class="rt-vide">Aucune tâche dans ce cas.</div>`)
        +`</div></div>`;
    }).join("");
    h+=`</div>`;
  }
  return h;
}

function villeDuLieu(lieu){
  const r=LIEUX_REF.find(l=>lieu&&l.n&&lieu.startsWith(l.n));
  return r?r.ville:(lieu==="Visio"?"Visio":(lieu||"").split(", ").pop());
}
function mkInfos(m){
  /* une entrée du marché, ramenée aux quatre informations qui décident : quoi, où, combien de places, où j'en suis */
  if(m.type==="inter"){
    const s=SESS[m.sess]||{};
    const carte=CARDS.find(c=>c.kb==="session_fia"&&c.sess===m.sess);
    const sc=carte?sessCounts(carte):null;
    return {titre:s.lbl||m.sess, sous:OFFRES[m.offre]+(m.note?" · "+m.note:""), lieu:s.lieu, ville:s.ville,
            places:sc?`${sc.ins+sc.enc} / ${sc.cap} places`:"12 places", dt:s.dt, offreLbl:OFFRES[m.offre]};
  }
  if(m.type==="intra") return {titre:m.titre, sous:"Intra"+(m.note?" · "+m.note:""), lieu:m.lieu, ville:villeDuLieu(m.lieu), places:m.ap+" apprenants", offreLbl:"Intra"};
  return {titre:m.titre, sous:(m.kind==="prio"?"Coaching prioritaire":"Coaching libre")+(m.note?" · "+m.note:""), lieu:m.lieu, ville:villeDuLieu(m.lieu), places:m.h+" h de coaching", offreLbl:"Coaching"};
}

/* lit les champs de vente présents à l'écran (fiche entière en édition, ou une seule vente) */
function applyVenteInputs(obj){
  document.querySelectorAll("#content [data-vdoc]").forEach(inp=>{const [vi,dk]=inp.dataset.vdoc.split("::");if(obj.ventes&&obj.ventes[vi])obj.ventes[vi].docs[dk]=inp.value.trim()||null;});
  document.querySelectorAll("#content [data-vsel]").forEach(sel=>{const [vi,ky]=sel.dataset.vsel.split("::");const v=obj.ventes&&obj.ventes[vi];if(!v)return;const val=sel.value||null;
    if(ky==="fin"){ if(val&&val!==v.fin){ v.fin=val; [v.inscId,v.factId].filter(Boolean).forEach(cid=>{const c=CARDS.find(x=>x.id===cid);if(c)changeFin(c,val);}); } return; }
    v[ky]=val;
    [v.inscId,v.factId].filter(Boolean).forEach(cid=>{const c=CARDS.find(x=>x.id===cid);if(c)c[ky]=val;});});
  document.querySelectorAll("#content [data-vaps]").forEach(sel=>{const v=obj.ventes&&obj.ventes[sel.dataset.vaps];if(!v)return;
    const ids=[...sel.selectedOptions].map(o=>o.value); v.apprenants=ids;
    const srcId=v.inscId||v.factId;
    if(srcId) APPRENANTS.forEach(a=>{const has=a.insc.includes(srcId);const want=ids.includes(a.id);
      if(want&&!has) a.insc=a.insc.concat([srcId]);
      if(!want&&has) a.insc=a.insc.filter(x=>x!==srcId);});
    obj.apprenants=[...new Set((obj.ventes||[]).flatMap(x=>x.apprenants||[]).concat(obj.apprenants||[]))];});
}
function venteDocs(cl,v,ix,ed){

function ficheFormateurHtml(key){

    +`</div></details>`;
  return h;
}

  /* section 5 : publication ARD, visible dès que la session est publiée */
  if(c.col!=="brouillon"){
    const sc=sessCounts(c);
